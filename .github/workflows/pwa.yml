# Publica la app instalable (PWA) en GitHub Pages cada vez que cambia su código en main (6-nov-2026).
# Monta pwa/dist/ con node pwa/build.js (sin dependencias) y lo sube a Pages.
# Hace falta, una vez: Settings › Pages › Build and deployment › Source: «GitHub Actions», y la variable URL_SERVIDOR
# (Settings › Secrets and variables › Actions › Variables) con la dirección /exec de la implementación.
name: Publicar PWA

on:
  push:
    branches: [main]
    paths: ['Index.html', 'Estilos.html', 'Cliente.html', 'Main.gs', 'pwa/**', '.github/workflows/pwa.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pwa/build.js
        env:
          # Dirección /exec de la implementación (Settings › Secrets and variables › Actions › Variables).
          # Sin ella, la app pide la dirección en la pantalla de entrada.
          URL_SERVIDOR: ${{ vars.URL_SERVIDOR }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist
      - id: despliegue
        uses: actions/deploy-pages@v4

<script>
  (function () {
    'use strict';

    // ---------- Estado de la app ----------
    const app = {
      init: null,        // datos de api_init
      fecha: null,       // fecha elegida en Inicio (yyyy-MM-dd)
      vista: 'inicio',
      alVolver: null,    // qué hace el botón «Volver» de la barra
      pase: null,        // pase de lista abierto
      grupo: null,       // gestión de un grupo abierta
      pestana: 'lista',
      busqueda: 0,       // nº de la última búsqueda (para ignorar respuestas viejas)
      hist: { grupo_id: '', mes: '' },
      inf: { desde: '', hasta: '', taller_id: '', datos: null, enlace: null },
      gest: null,        // datos de api_gestion
      usuarios: { texto: '' },
      guardando: {},     // pases de lista guardándose en segundo plano: 'grupo|fecha' → 'guardando' o 'error'
      hechos: {},        // pases guardados o cancelados en esta visita: 'grupo|fecha' → true
      ultimoInicio: null // últimos datos de api_inicio recibidos (para el siguiente pase mientras se vuelven a pedir)
    };

    const $ = function (id) { return document.getElementById(id); };

    // ---------- Utilidades ----------

    function esc(texto) {
      return String(texto == null ? '' : texto)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto',
      'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const LETRAS_DIAS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
    const ORDEN_DIAS = [['L', 'Lun'], ['M', 'Mar'], ['X', 'Mié'], ['J', 'Jue'], ['V', 'Vie'], ['S', 'Sáb'], ['D', 'Dom']];
    const TIPOS_ESTADO = [['presente', 'Cuenta como asistencia'], ['ausente', 'Cuenta como falta'], ['neutro', 'No cuenta (evento, excursión…)']];

    function aFecha(texto) {
      const p = String(texto).split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }
    function fechaLarga(texto) {
      const d = aFecha(texto);
      return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    }
    function fechaCorta(texto) {
      const d = aFecha(texto);
      return DIAS[d.getDay()].substring(0, 3) + ' ' + d.getDate() + ' ' + MESES[d.getMonth()].substring(0, 3);
    }
    function fechaNumerica(texto) {
      if (!texto) return '';
      const p = String(texto).substring(0, 10).split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }
    function fechaHora(texto) {
      if (!texto) return '';
      return fechaNumerica(texto) + ' ' + String(texto).substring(11, 16);
    }
    function nombreMes(mes) {
      const p = mes.split('-').map(Number);
      return MESES[p[1] - 1] + ' ' + p[0];
    }
    function nombreMesCorto(mes) {
      const p = mes.split('-').map(Number);
      return MESES[p[1] - 1].substring(0, 3) + ' ' + p[0];
    }
    function sumarMes(mes, n) {
      const p = mes.split('-').map(Number);
      const d = new Date(p[0], p[1] - 1 + n, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function sumarDias(texto, n) {
      const d = aFecha(texto);
      d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function porcentaje(valor) {
      return valor === null || valor === undefined ? '—' : String(valor).replace('.', ',') + ' %';
    }
    function esAdmin() { return app.init.monitora.rol === 'admin'; }

    /**
     * Nombre de un usuario para mostrar: «GARCIA DE LA FUENTE MARIA» → «Garcia de la Fuente Maria».
     * Solo cambia cómo se ve: en la hoja, en los campos para editar y en las búsquedas sigue en mayúsculas.
     */
    const PARTICULAS = { DE: 1, DEL: 1, LA: 1, LAS: 1, LOS: 1, Y: 1, I: 1, E: 1 };
    function nombreVisible(texto) {
      const t = String(texto || '');
      if (!t || t.charAt(0) === '(') return t;   // «(ID 12 sin ficha)» se deja tal cual
      return t.split(' ').map(function (palabra, i) {
        if (i > 0 && PARTICULAS[palabra.toUpperCase()]) return palabra.toLowerCase();
        return palabra.toLowerCase().replace(/(^|[-'])(\S)/g, function (m, antes, letra) { return antes + letra.toUpperCase(); });
      }).join(' ');
    }
    /**
     * Círculo con las iniciales (como en Contactos): primer apellido y nombre (tercera palabra, o la última si hay
     * menos), sin partículas. El color sale del propio nombre, así cada usuario tiene siempre el mismo.
     */
    function avatar(nombre) {
      const palabras = String(nombre || '').toUpperCase().split(' ').filter(function (p) { return p && !PARTICULAS[p] && /[A-ZÑ]/.test(p); });
      if (!palabras.length || String(nombre).charAt(0) === '(') return '<span class="avatar av-0" aria-hidden="true">?</span>';
      const segunda = palabras.length > 2 ? palabras[2] : palabras[palabras.length - 1];
      const iniciales = palabras[0].replace(/[^A-ZÑÁÉÍÓÚÜ]/g, '').charAt(0) +
        (palabras.length > 1 ? segunda.replace(/[^A-ZÑÁÉÍÓÚÜ]/g, '').charAt(0) : '');
      let suma = 0;
      for (let k = 0; k < nombre.length; k++) suma += nombre.charCodeAt(k);
      return '<span class="avatar av-' + (suma % 6) + '" aria-hidden="true">' + esc(iniciales) + '</span>';
    }

    /** Vibración muy corta al marcar un estado (solo en los móviles que la admiten, como Android). */
    function vibrar() {
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* sin vibración: se ignora */ }
    }

    /** Color de texto legible sobre un color de fondo (#rrggbb). */
    function colorTexto(fondo) {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(fondo || '').trim());
      if (!m) return '#000';
      const n = parseInt(m[1], 16);
      const luz = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      return luz > 0.6 ? '#000' : '#fff';
    }

    function estadoInfo(codigo, lista) {
      const e = (lista || app.init.estados || []).find(function (x) { return x.codigo === codigo; });
      return e || { codigo: codigo, etiqueta: codigo, color: '#9e9e9e', letra: String(codigo).charAt(0) };
    }
    /** Pasa el color del estado al CSS (--estado), que lo suaviza; --estado-texto sirve si el navegador no sabe mezclar colores. */
    function estiloColor(color) {
      return '--estado:' + esc(color) + ';--estado-texto:' + colorTexto(color);
    }
    function estiloEstado(codigo, lista) {
      return estiloColor(estadoInfo(codigo, lista).color);
    }

    /**
     * Icono de cada estado (SVG propios, relleno con currentColor). Se elige por el tipo de la hoja Estados,
     * así un estado nuevo tiene icono sin tocar código: presente = marca, la falta (el primer «ausente») = aspa,
     * otros «ausente» (Justificada…) = calendario tachado y «neutro» (Evento…) = estrella.
     */
    const ICONOS_ESTADO = {
      presente: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4 3.6 3.6 7.6-7.6L19 8z"/>',
      falta: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 13.6L15.6 17 12 13.4 8.4 17 7 15.6 10.6 12 7 8.4 8.4 7l3.6 3.6L15.6 7 17 8.4 13.4 12z"/>',
      justificada: '<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM9.5 18.6l2.5-2.5 2.5 2.5 1.1-1.1-2.5-2.5 2.5-2.5-1.1-1.1-2.5 2.5-2.5-2.5-1.1 1.1 2.5 2.5-2.5 2.5z"/>',
      neutro: '<path d="M12 17.3 18.2 21l-1.7-7 5.5-4.8-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/>',
      otro: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>'
    };
    function iconoEstado(e) {
      let clave = 'otro';
      if (e.tipo === 'presente') clave = 'presente';
      else if (e.tipo === 'neutro') clave = 'neutro';
      else if (e.tipo === 'ausente') {
        const par = estadosAlternar();
        clave = par && par.falta.codigo !== e.codigo ? 'justificada' : 'falta';
      }
      return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">' + ICONOS_ESTADO[clave] + '</svg>';
    }
    /** Chip de un estado: pastilla de color suave con su icono y el texto (por defecto, la etiqueta). */
    function chipEstado(codigo, html, clase) {
      const e = estadoInfo(codigo);
      return '<span class="chip' + (clase ? ' ' + clase : '') + '" style="' + estiloEstado(codigo) + '">' + iconoEstado(e) +
        (html === undefined ? esc(e.etiqueta) : html) + '</span>';
    }

    function opciones(lista, valor, valorDe, textoDe) {
      return lista.map(function (x) {
        const v = valorDe ? valorDe(x) : x;
        return '<option value="' + esc(v) + '"' + (String(v) === String(valor) ? ' selected' : '') + '>' +
          esc(textoDe ? textoDe(x) : x) + '</option>';
      }).join('');
    }

    function valor(id) { const el = $(id); return el ? el.value.trim() : ''; }
    function marcado(id) { const el = $(id); return !!(el && el.checked); }

    const ICONO_TELEFONO = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';

    const ICONO_MAS = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>';
    const ICONO_GUARDAR = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';

    function enlaceLlamar(telefono) {
      if (!telefono) return '';
      return '<a class="llamar" href="tel:' + esc(telefono) + '" aria-label="Llamar al ' + esc(telefono) + '">' + ICONO_TELEFONO + '</a>';
    }

    // ---------- Servidor ----------

    let llamadasEnCurso = 0;
    let temporizadorCarga = null;

    function cargando(sumar) {
      llamadasEnCurso += sumar;
      if (llamadasEnCurso > 0 && !temporizadorCarga) {
        temporizadorCarga = setTimeout(function () { $('cargando').classList.remove('oculto'); }, 150);
      }
      if (llamadasEnCurso <= 0) {
        llamadasEnCurso = 0;
        clearTimeout(temporizadorCarga);
        temporizadorCarga = null;
        $('cargando').classList.add('oculto');
      }
    }

    /** Llama a una función api_* y devuelve una promesa con sus datos. */
    function llamar(funcion) {
      const args = Array.prototype.slice.call(arguments, 1);
      return llamarSinCarga(true, funcion, args);
    }
    function llamarSinCarga(conCarga, funcion, args) {
      if (conCarga) cargando(1);
      return new Promise(function (resolver, rechazar) {
        const runner = google.script.run
          .withSuccessHandler(function (r) {
            if (conCarga) cargando(-1);
            if (r && r.ok) resolver(r.data);
            else rechazar(new Error((r && r.error) || 'Respuesta no válida del servidor.'));
          })
          .withFailureHandler(function () {
            if (conCarga) cargando(-1);
            rechazar(new Error('No se ha podido conectar con el servidor. Comprueba la conexión e inténtalo de nuevo.'));
          });
        runner[funcion].apply(runner, args);
      });
    }

    // ---------- Memoria de datos ----------
    // Las lecturas se recuerdan por función y argumentos: volver a una pantalla ya vista no espera al servidor.
    // Cada escritura olvida solo lo que deja anticuado (anticuar) y la precarga lo vuelve a pedir en segundo plano.

    const memoria = {};          // clave → { funcion, args, promesa, listo, datos }
    let memoriaDesde = Date.now();
    const REFRESCO_MS = 10 * 60 * 1000;

    function claveMemoria(funcion, args) { return funcion + '|' + JSON.stringify(args); }
    function copia(d) { return d === undefined ? d : JSON.parse(JSON.stringify(d)); }

    /** Como llamar(), pero si ya tiene la respuesta la devuelve al momento y sin barra de carga. Devuelve siempre una copia. */
    function pedir(funcion) {
      return pedirCon(true, funcion, Array.prototype.slice.call(arguments, 1));
    }
    function pedirCon(conCarga, funcion, args) {
      const clave = claveMemoria(funcion, args);
      let e = memoria[clave];
      if (!e) {
        e = memoria[clave] = { funcion: funcion, args: args, listo: false, datos: null };
        e.promesa = llamarSinCarga(false, funcion, args).then(function (d) {
          if (memoria[clave] === e) { e.datos = d; e.listo = true; }
          return d;
        }, function (err) {
          if (memoria[clave] === e) delete memoria[clave];
          throw err;
        });
      }
      if (e.listo) return Promise.resolve(copia(e.datos));
      if (!conCarga) return e.promesa.then(copia);
      cargando(1);
      return e.promesa.then(function (d) { cargando(-1); return copia(d); },
        function (err) { cargando(-1); throw err; });
    }
    function tieneMemoria(funcion, args) { return !!memoria[claveMemoria(funcion, args)]; }

    /** Olvida las respuestas de una función (todas, o las que cumplan el filtro sobre sus argumentos). */
    function olvidar(funcion, filtro) {
      Object.keys(memoria).forEach(function (k) {
        const e = memoria[k];
        if (e.funcion === funcion && (!filtro || filtro.apply(null, e.args))) delete memoria[k];
      });
    }
    function olvidarTodo() {
      Object.keys(memoria).forEach(function (k) { delete memoria[k]; });
    }

    /** Qué deja anticuado cada tipo de cambio. */
    function anticuar(cambio, grupoId, fecha) {
      const varias = function (lista) { lista.forEach(function (f) { olvidar(f); }); };
      if (cambio === 'sesion') {
        // Pase de lista guardado o cancelado
        olvidar('api_sesion', function (g, f) { return g === grupoId && f === fecha; });
        olvidar('api_historial', function (g, m) { return g === grupoId && m === fecha.substring(0, 7); });
        varias(['api_inicio', 'api_informe', 'api_usuario']);
      } else if (cambio === 'inscripciones') {
        // Altas, bajas y cambios de grupo
        varias(['api_grupo', 'api_sesion', 'api_inicio', 'api_historial', 'api_informe', 'api_usuario', 'api_gestion', 'api_usuariosGestion']);
      } else if (cambio === 'usuario-nuevo') {
        // Usuario nuevo, todavía sin grupo
        varias(['api_usuariosGestion', 'api_gestion', 'api_usuariosAlta']);
      } else if (cambio === 'usuario') {
        // Datos de un usuario (nombre, teléfono, activo)
        varias(['api_usuario', 'api_usuariosGestion', 'api_gestion', 'api_grupo', 'api_sesion', 'api_historial', 'api_usuariosAlta']);
      } else if (cambio === 'dias') {
        varias(['api_inicio', 'api_sesion', 'api_historial', 'api_gestion']);
      } else if (cambio === 'lista') {
        olvidar('api_gestion');
      } else {
        // Grupos, estados o curso: afecta a casi todo
        olvidarTodo();
      }
    }

    // --- Precarga en segundo plano: como mucho dos peticiones a la vez, para no saturar Apps Script ---

    const colaFondo = [];
    let enFondo = 0;
    const MAX_FONDO = 2;

    /** Pide algo en segundo plano si aún no está en memoria. alLlegar recibe los datos. */
    function enCola(funcion, args, primero, alLlegar) {
      const tarea = { funcion: funcion, args: args, alLlegar: alLlegar };
      if (primero) colaFondo.unshift(tarea); else colaFondo.push(tarea);
      siguienteFondo();
    }
    function siguienteFondo() {
      while (enFondo < MAX_FONDO && colaFondo.length) {
        const t = colaFondo.shift();
        if (tieneMemoria(t.funcion, t.args)) continue;
        enFondo++;
        const fin = function () { enFondo--; siguienteFondo(); };
        pedirCon(false, t.funcion, t.args).then(function (d) {
          fin();
          if (t.alLlegar) t.alLlegar(d);
        }, fin);
      }
    }

    function periodoInforme() {
      return {
        desde: app.init.inicioCurso || app.init.hoy.substring(0, 4) + '-01-01',
        hasta: app.init.hoy
      };
    }

    /** Pases de lista que se abrirán desde Inicio: pendientes y grupos del día. */
    function precargarSesiones(d) {
      d.grupos.slice().reverse().forEach(function (g) { enCola('api_sesion', [g.grupo_id, d.fecha], true); });
      d.pendientes.slice().reverse().forEach(function (p) { enCola('api_sesion', [p.grupo_id, p.fecha], true); });
    }

    /** Pide en segundo plano lo que necesitan las secciones y aún no está en memoria. Primero Inicio y sus pases de lista. */
    function precargar() {
      pedirCon(false, 'api_inicio', [app.fecha]).then(function (d) {
        app.ultimoInicio = d;
        precargarSesiones(d);
        precargarResto();
      }, precargarResto);
    }
    function precargarResto() {
      const grupos = app.init.grupos;
      const mes = app.init.hoy.substring(0, 7);
      if (app.hist.grupo_id && app.hist.mes) enCola('api_historial', [app.hist.grupo_id, app.hist.mes]);
      grupos.forEach(function (g) { enCola('api_historial', [g.grupo_id, mes]); });
      const p = periodoInforme();
      enCola('api_informe', [p.desde, p.hasta, '']);
      if (app.inf.desde && (app.inf.desde !== p.desde || app.inf.hasta !== p.hasta || app.inf.taller_id)) {
        enCola('api_informe', [app.inf.desde, app.inf.hasta, app.inf.taller_id]);
      }
      if (esAdmin()) {
        enCola('api_gestion', [], false, function (d) { app.gest = d; });
        enCola('api_usuariosGestion', ['']);
      }
      grupos.forEach(function (g) { enCola('api_grupo', [g.grupo_id]); });
      enCola('api_usuariosAlta', []);
    }

    /** Tras un rato sin usar la app, lo vuelve a pedir todo (por si se ha tocado la hoja a mano). */
    function refrescarTodo() {
      memoriaDesde = Date.now();
      llamarSinCarga(false, 'api_init', []).then(function (d) {
        if (app.fecha === app.init.hoy) app.fecha = d.hoy;
        app.init = d;
        olvidarTodo();
        precargar();
      }).catch(function () { /* sin conexión: se seguirá con lo que hay */ });
    }

    let temporizadorAviso = null;
    function aviso(texto, esError) {
      const a = $('aviso');
      a.textContent = texto;
      a.classList.toggle('error', !!esError);
      a.classList.remove('oculto');
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(function () { a.classList.add('oculto'); }, esError ? 7000 : 3500);
    }
    function avisoError(e) { aviso(e.message, true); }

    // ---------- Panel inferior ----------

    function abrirPanel(html) {
      $('panel').innerHTML = html;
      $('panel').classList.remove('oculto');
      $('fondoPanel').classList.remove('oculto');
      $('panel').scrollTop = 0;
    }
    function cerrarPanel() {
      $('panel').classList.add('oculto');
      $('fondoPanel').classList.add('oculto');
      $('panel').innerHTML = '';
    }

    /** Panel de confirmación: al aceptar se ejecuta alAceptar. */
    let confirmacionPendiente = null;
    function confirmar(titulo, texto, botonSi, peligro, alAceptar) {
      confirmacionPendiente = alAceptar;
      abrirPanel('<div><h3>' + esc(titulo) + '</h3>' + (texto ? '<p>' + texto + '</p>' : '') +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">No</button>' +
        '<button type="button" class="boton ' + (peligro ? 'peligro-lleno' : 'primario') + '" data-accion="confirmar-si">' +
        esc(botonSi) + '</button></div></div>');
    }

    /**
     * Panel de posibles duplicados: al crear un usuario, el servidor devuelve { parecidos } en vez de crearlo.
     * alUsar(usuario_id): se elige uno de los que ya existen. alCrear(): es otra persona, se crea igualmente.
     */
    let parecidosPendiente = null;
    function avisarParecidos(nombre, parecidos, textoUsar, alUsar, alCrear) {
      parecidosPendiente = { usar: alUsar, crear: alCrear };
      abrirPanel('<div><h3>¿Es la misma persona?</h3>' +
        '<p>Ya hay ' + (parecidos.length === 1 ? 'un usuario' : 'usuarios') + ' con un nombre parecido a <strong>' + esc(nombreVisible(nombre)) + '</strong>:</p>' +
        parecidos.map(function (u) {
          return '<div class="resultado"><div class="cuerpo"><div><strong>' + esc(nombreVisible(u.nombre)) + '</strong></div>' +
            '<div class="sub">ID ' + esc(u.usuario_id) + (u.activo ? '' : ' · inactivo') + '</div></div>' +
            '<button type="button" class="boton primario" data-accion="parecido-usar" data-usuario="' + esc(u.usuario_id) + '">' + esc(textoUsar) + '</button></div>';
        }).join('') +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton" data-accion="parecido-crear">Es otra persona: crear</button></div></div>');
    }

    // ---------- Barra, pie y navegación ----------

    /** alVolver: función del botón «Volver», o null para ocultarlo. */
    function barra(titulo, sub, alVolver) {
      $('barraTitulo').textContent = titulo;
      $('barraSub').textContent = sub || '';
      app.alVolver = alVolver || null;
      $('btnVolver').classList.toggle('oculto', !alVolver);
    }
    function pie(html) {
      $('pie').innerHTML = html || '';
      $('pie').classList.toggle('oculto', !html);
      $('vista').classList.toggle('con-pie', !!html);
    }

    const SECCIONES = [
      ['inicio', 'Inicio', '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>'],
      ['historial', 'Historial', '<path d="M4 5h16v3H4zM4 10.5h16v3H4zM4 16h16v3H4z"/>'],
      ['informe', 'Informe', '<path d="M5 20V10h3v10zM10.5 20V4h3v16zM16 20v-7h3v7z"/>'],
      ['gestion', 'Gestión', '<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.2 5l1.6 1.3-1.8 3.1-2-.7a7 7 0 0 1-1.9 1.1l-.3 2.1h-3.6l-.3-2.1a7 7 0 0 1-1.9-1.1l-2 .7-1.8-3.1 1.6-1.3a7 7 0 0 1 0-2.2L2.2 10l1.8-3.1 2 .7A7 7 0 0 1 7.9 6.5l.3-2.1h3.6l.3 2.1a7 7 0 0 1 1.9 1.1l2-.7L17.8 10l-1.6 1.3a7 7 0 0 1 0 2.2z"/>']
    ];

    /** Muestra la barra inferior con la sección activa, o la oculta (activa = null). */
    function navegacion(activa) {
      const nav = $('navegacion');
      if (!activa) {
        nav.classList.add('oculto');
        $('vista').classList.remove('con-nav');
        return;
      }
      nav.innerHTML = SECCIONES.filter(function (s) { return s[0] !== 'gestion' || esAdmin(); }).map(function (s) {
        return '<button type="button" class="nav-boton' + (s[0] === activa ? ' activa' : '') + '" data-accion="nav" data-destino="' + s[0] + '">' +
          '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor">' + s[2] + '</svg>' +
          '<span>' + s[1] + '</span></button>';
      }).join('');
      nav.classList.remove('oculto');
      $('vista').classList.add('con-nav');
    }

    /** Prepara una pantalla principal (con barra inferior). */
    function pantallaPrincipal(seccion, titulo, sub) {
      app.vista = seccion;
      app.pase = null;
      cerrarPanel();
      pie('');
      barra(titulo, sub, null);
      navegacion(seccion);
    }

    /** Prepara una pantalla secundaria (con «Volver» y sin barra inferior). */
    function pantallaSecundaria(vista, titulo, sub, alVolver) {
      app.vista = vista;
      cerrarPanel();
      pie('');
      barra(titulo, sub, alVolver);
      navegacion(null);
    }

    function irSeccion(destino) {
      if (destino === 'historial') irHistorial();
      else if (destino === 'informe') irInforme();
      else if (destino === 'gestion') irGestion();
      else irInicio();
    }

    function pintar(html) {
      $('vista').innerHTML = html;
      window.scrollTo(0, 0);
    }

    // ---------- Inicio ----------

    function irInicio() {
      pantallaPrincipal('inicio', 'Hola, ' + app.init.monitora.nombre, app.init.curso ? 'Curso ' + app.init.curso : '');
      pedir('api_inicio', app.fecha).then(function (d) {
        pintarInicio(d);
        precargarSesiones(d);
        // La flecha ‹ suele ser lo siguiente: el día anterior se pide ya en segundo plano.
        enCola('api_inicio', [sumarDias(app.fecha, -1)]);
      }).catch(function (e) {
        $('vista').innerHTML = '<p class="vacio">' + esc(e.message) + '</p>';
      });
    }

    /** Etiqueta de un pase de lista que se está guardando en segundo plano o cuyo guardado ha fallado. */
    function etiquetaGuardado(grupoId, fecha) {
      const estado = app.guardando[claveBorrador(grupoId, fecha)];
      if (estado === 'guardando') return '<span class="etiqueta guardando">Guardando…</span>';
      if (estado === 'error') return '<span class="etiqueta sin-guardar">Sin guardar</span>';
      return '';
    }

    function etiquetaSesion(g, fecha) {
      const guardado = etiquetaGuardado(g.grupo_id, fecha);
      if (guardado) return guardado;
      if (g.estadoSesion === 'realizada') return '<span class="etiqueta realizada">Lista pasada</span>';
      if (g.estadoSesion === 'cancelada') return '<span class="etiqueta cancelada">Cancelada</span>';
      if (g.diaEspecial) return '<span class="etiqueta especial">' + esc(g.diaEspecial.tipo || 'Sin clase') + '</span>';
      return '<span class="etiqueta pendiente">Pendiente</span>';
    }

    /** Cuadro de delante de un pendiente: día de la semana abreviado y número del día. */
    function cuadroFecha(texto) {
      const dia = aFecha(texto);
      return '<span class="lead"><small>' + esc(dia.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', '')) + '</small>' +
        dia.getDate() + '</span>';
    }

    function pintarInicio(d) {
      app.ultimoInicio = d;
      if (app.vista !== 'inicio') return;
      let html = '<div class="selector-fecha"><label for="fechaInicio">Fecha</label>' +
        '<button type="button" class="boton flecha-dia" data-accion="dia" data-salto="-1" aria-label="Día anterior">‹</button>' +
        '<input type="date" id="fechaInicio" value="' + esc(app.fecha) + '" max="' + esc(d.hoy) + '">' +
        '<button type="button" class="boton flecha-dia" data-accion="dia" data-salto="1" aria-label="Día siguiente"' +
        (app.fecha >= d.hoy ? ' disabled' : '') + '>›</button></div>';

      if (d.pendientes.length) {
        html += '<h2 class="seccion peligro">Pendientes (' + d.pendientes.length + ')</h2>';
        // Cada pendiente: la tarjeta abre el pase y «No hubo clase» la cancela sin abrirlo.
        html += '<div class="lista">';
        d.pendientes.forEach(function (p) {
          const guardado = etiquetaGuardado(p.grupo_id, p.fecha);
          html += '<div class="tarjeta pendiente con-accion"><button type="button" class="tarjeta-abrir" data-accion="pase" data-grupo="' +
            esc(p.grupo_id) + '" data-fecha="' + esc(p.fecha) + '">' + cuadroFecha(p.fecha) + '<div class="tarjeta-cuerpo"><div class="tarjeta-titulo">' + esc(p.nombre) +
            '</div><div class="tarjeta-detalle">' + esc(p.taller) + (p.hora ? ' · ' + esc(p.hora) : '') + '</div></div>' + guardado + '</button>' +
            (guardado ? '' : '<button type="button" class="boton compacto" data-accion="no-hubo-clase" data-grupo="' + esc(p.grupo_id) +
              '" data-fecha="' + esc(p.fecha) + '">No hubo clase</button>') + '</div>';
        });
        html += '</div>';
      }

      html += '<h2 class="seccion">' + (d.fecha === d.hoy ? 'Hoy' : esc(fechaLarga(d.fecha))) + '</h2>';
      if (!d.grupos.length) {
        html += '<p class="vacio">No hay clases este día.</p>';
      } else {
        // Una lista agrupada por taller; delante de cada grupo, su hora.
        let tallerActual = null;
        d.grupos.forEach(function (g) {
          if (g.taller !== tallerActual) {
            html += (tallerActual === null ? '' : '</div>') + '<h3 class="taller">' + esc(g.taller) + '</h3><div class="lista">';
            tallerActual = g.taller;
          }
          html += '<button type="button" class="tarjeta" data-accion="pase" data-grupo="' + esc(g.grupo_id) +
            '" data-fecha="' + esc(d.fecha) + '"><span class="lead">' + (g.hora ? esc(g.hora) : '—') + '</span>' +
            '<div class="tarjeta-cuerpo"><div class="tarjeta-titulo">' + esc(g.nombre) +
            '</div><div class="tarjeta-detalle">' + g.inscritos + ' usuarios</div></div>' +
            etiquetaSesion(g, d.fecha) + '</button>';
        });
        html += '</div>';
      }

      html += '<details class="plegable"><summary>Mis grupos (' + app.init.grupos.length + ')</summary>';
      if (!app.init.grupos.length) {
        html += '<p class="vacio">No tienes grupos asignados.' + (esAdmin() ? ' Créalos en Gestión › Grupos.' : '') + '</p>';
      }
      app.init.grupos.forEach(function (g) {
        html += '<div class="grupo-fila"><div class="tarjeta-titulo">' + esc(g.nombre) + '</div>' +
          '<div class="tarjeta-detalle">' + esc(g.taller) + ' · ' + esc(g.dias) + (g.hora ? ' · ' + esc(g.hora) : '') + '</div>' +
          '<div class="botones"><button type="button" class="boton" data-accion="pase" data-grupo="' + esc(g.grupo_id) +
          '" data-fecha="' + esc(d.fecha) + '">Pasar lista</button>' +
          '<button type="button" class="boton" data-accion="grupo" data-grupo="' + esc(g.grupo_id) + '">Altas y bajas</button></div></div>';
      });
      html += '</details>';
      pintar(html);
    }

    // ---------- Pase de lista ----------

    function claveBorrador(grupoId, fecha) { return grupoId + '|' + fecha; }

    function leerBorrador(clave) {
      try { return JSON.parse(window.localStorage.getItem(clave) || 'null'); } catch (e) { return null; }
    }
    function leerBorradorTexto(clave) {
      try { return window.localStorage.getItem(clave); } catch (e) { return null; }
    }
    function guardarBorrador() {
      const p = app.pase;
      if (!p) return;
      const usuarios = {};
      p.usuarios.forEach(function (u) { usuarios[u.usuario_id] = { estado: u.estado, observaciones: u.observaciones }; });
      try {
        window.localStorage.setItem(claveBorrador(p.grupo.grupo_id, p.fecha), JSON.stringify({ usuarios: usuarios, nota: p.nota }));
      } catch (e) { /* sin localStorage: se ignora */ }
    }
    function borrarBorrador(grupoId, fecha) {
      try { window.localStorage.removeItem(claveBorrador(grupoId, fecha)); } catch (e) { /* se ignora */ }
    }

    /**
     * volver: función para regresar a la pantalla de origen (Inicio por defecto).
     * sinAvisoBorrador: al reabrirlo tras una baja hecha desde el propio pase no se avisa de las marcas recuperadas.
     */
    function abrirPase(grupoId, fecha, volver, sinAvisoBorrador) {
      pedir('api_sesion', grupoId, fecha).then(function (d) {
        d.nota = d.sesion ? (d.sesion.nota || '') : '';
        d.borradorRecuperado = false;
        d.volver = volver || irInicio;
        const b = leerBorrador(claveBorrador(grupoId, fecha));
        if (b && b.usuarios) {
          d.usuarios.forEach(function (u) {
            const g = b.usuarios[u.usuario_id];
            if (g) { u.estado = g.estado; u.observaciones = g.observaciones || ''; }
          });
          if (typeof b.nota === 'string') d.nota = b.nota;
          d.borradorRecuperado = !sinAvisoBorrador;
        }
        pantallaSecundaria('pase', d.grupo.nombre, fechaLarga(fecha), d.volver);
        app.pase = d;
        pintarPase();
      }).catch(avisoError);
    }

    function pintarPase() {
      const p = app.pase;
      let html = '<div class="avisos-sesion">';
      const guardado = app.guardando[claveBorrador(p.grupo.grupo_id, p.fecha)];
      if (guardado === 'guardando') html += '<div class="banda info">Se está guardando esta lista. Espera a que termine antes de cambiarla.</div>';
      else if (guardado === 'error') html += '<div class="banda error">No se pudo guardar esta lista. Tus marcas se conservan: revísalas y pulsa Guardar otra vez.</div>';
      else if (p.borradorRecuperado) html += '<div class="banda info">Se han recuperado cambios sin guardar de la última vez.</div>';
      if (p.diaEspecial) {
        html += '<div class="banda especial">Día sin clase: ' + esc(p.diaEspecial.tipo || '') +
          (p.diaEspecial.descripcion ? ' – ' + esc(p.diaEspecial.descripcion) : '') +
          '. Si aun así hubo clase, puedes pasar lista.</div>';
      }
      if (p.sesion && p.sesion.estado === 'realizada') {
        html += '<div class="banda realizada">Lista guardada el ' + esc(fechaHora(p.sesion.timestamp)) + '. Puedes corregirla y volver a guardar.</div>';
      }
      if (p.sesion && p.sesion.estado === 'cancelada') {
        html += '<div class="banda cancelada">Sesión cancelada' + (p.sesion.nota ? ': ' + esc(p.sesion.nota) : '') +
          '. Si guardas la lista, volverá a contar como realizada.</div>';
      }
      html += '</div>';

      if (!p.usuarios.length) {
        html += '<p class="vacio">No hay usuarios inscritos en este grupo en esta fecha.</p>';
      } else {
        html += '<button type="button" class="boton ancho" data-accion="aplicar-todos" style="margin-bottom:10px">Aplicar un estado a todos…</button>';
        const par = estadosAlternar();
        if (par) {
          html += '<p class="ayuda">Toca el estado para cambiar entre ' + esc(par.presente.etiqueta) + ' y ' + esc(par.falta.etiqueta) +
            '. Toca el nombre para los demás estados y las observaciones.</p>';
        }
        html += '<div id="listaUsuarios" class="lista">' + p.usuarios.map(function (u, i) { return filaUsuario(u, i); }).join('') + '</div>';
      }
      html += '<div class="campo" style="margin-top:14px"><label for="notaSesion">Nota de la sesión (opcional)</label>' +
        '<textarea id="notaSesion" rows="2">' + esc(p.nota) + '</textarea></div>';
      pintar(html);
      pintarPiePase();
    }

    /** recien: el estado acaba de cambiar (el icono del chip aparece con una animación corta). */
    function filaUsuario(u, i, recien) {
      const e = estadoInfo(u.estado);
      // Si no está en el estado por defecto, la fila toma un tinte muy suave de su color (como las citas de fisio).
      const tinte = u.estado !== app.init.estadoPorDefecto ? ' style="--tinte:' + esc(e.color) + '"' : '';
      return '<div class="fila-usuario" data-accion="usuario" data-indice="' + i + '" id="fila' + i + '"' + tinte + '>' +
        avatar(u.nombre) + '<div class="nombre">' + esc(nombreVisible(u.nombre)) +
        (u.faltasSeguidas ? '<span class="faltas-seguidas">' + u.faltasSeguidas + ' faltas seguidas</span>' : '') +
        (u.observaciones ? '<span class="obs">' + esc(u.observaciones) + '</span>' : '') + '</div>' +
        '<button type="button" class="alternar" data-accion="alternar" data-indice="' + i + '" aria-label="' + esc(e.etiqueta) + '. Cambiar estado">' +
        chipEstado(u.estado, undefined, recien ? 'recien' : '') + '</button>' +
        // Sin teléfono, un hueco del mismo ancho para que los chips queden alineados en columna.
        (u.telefono ? enlaceLlamar(u.telefono) : '<span class="sin-telefono" aria-hidden="true"></span>') + '</div>';
    }

    /**
     * Estados entre los que alterna el chip de cada fila con un toque: el estado por defecto (Asistido)
     * y el primero de tipo «ausente» de la hoja Estados (Falta). null si falta alguno.
     */
    function estadosAlternar() {
      const presente = app.init.estados.find(function (e) { return e.codigo === app.init.estadoPorDefecto; });
      const falta = app.init.estados.find(function (e) { return e.tipo === 'ausente'; });
      return presente && falta ? { presente: presente, falta: falta } : null;
    }

    /** Un toque en el chip: presente → falta; cualquier otro estado → presente. Sin pareja, abre el panel. */
    function alternarEstado(i) {
      const par = estadosAlternar();
      if (!par) { abrirPanelUsuario(i); return; }
      const u = app.pase.usuarios[i];
      u.estado = u.estado === par.presente.codigo ? par.falta.codigo : par.presente.codigo;
      vibrar();
      $('fila' + i).outerHTML = filaUsuario(u, i, true);
      pintarPiePase();
      guardarBorrador();
    }

    function contadores() {
      const cuenta = {};
      app.pase.usuarios.forEach(function (u) { cuenta[u.estado] = (cuenta[u.estado] || 0) + 1; });
      return cuenta;
    }

    function pintarPiePase() {
      const cuenta = contadores();
      let html = '<div class="contadores">';
      app.init.estados.concat(Object.keys(cuenta).filter(function (c) {
        return !app.init.estados.some(function (e) { return e.codigo === c; });
      }).map(function (c) { return estadoInfo(c); })).forEach(function (e) {
        if (!cuenta[e.codigo]) return;
        html += chipEstado(e.codigo, '<span class="numero">' + cuenta[e.codigo] + '</span> ' + esc(e.etiqueta));
      });
      html += '</div><div class="botones">' +
        '<button type="button" class="boton peligro" data-accion="cancelar-sesion">Sesión cancelada</button>' +
        '<button type="button" class="boton lleno" data-accion="guardar"' + (app.pase.usuarios.length ? '' : ' disabled') + '>' +
        ICONO_GUARDAR + 'Guardar</button></div>';
      pie(html);
    }

    function botonesEstados(accion) {
      return '<div class="opciones-estado">' + app.init.estados.map(function (e) {
        return '<button type="button" class="opcion-estado" data-accion="' + accion + '" data-estado="' + esc(e.codigo) +
          '" style="' + estiloEstado(e.codigo) + '">' + iconoEstado(e) + esc(e.etiqueta) + '</button>';
      }).join('') + '</div>';
    }

    /** Añade un texto rápido a las observaciones (separado por coma), si no está ya. */
    function anadirObsRapida(texto) {
      const caja = $('obsUsuario');
      if (!caja) return;
      const actual = caja.value.trim();
      if (actual.split(/\s*,\s*/).indexOf(texto) >= 0) return;
      caja.value = actual ? actual + ', ' + texto : texto;
    }

    function abrirPanelUsuario(i) {
      const u = app.pase.usuarios[i];
      app.pase.indice = i;
      abrirPanel('<div><h3>' + esc(nombreVisible(u.nombre)) + '</h3>' +
        botonesEstados('elegir-estado').replace('data-estado="' + esc(u.estado) + '"', 'data-estado="' + esc(u.estado) + '" data-elegido="1"') +
        '<div class="campo"><label for="obsUsuario">Observaciones</label><textarea id="obsUsuario" rows="2">' + esc(u.observaciones) + '</textarea>' +
        // Textos rápidos: lista obs_rapida de la hoja Listas (Gestión › Listas).
        ((app.init.obsRapidas || []).length ? '<div class="obs-rapidas">' + app.init.obsRapidas.map(function (t) {
          return '<button type="button" class="boton compacto" data-accion="obs-rapida" data-texto="' + esc(t) + '">' + esc(t) + '</button>';
        }).join('') + '</div>' : '') + '</div>' +
        '<button type="button" class="boton ancho" data-accion="cerrar-usuario">Hecho</button>' +
        (u.inscripcion_id && !u.fecha_baja ? '<button type="button" class="boton peligro ancho separado" data-accion="pase-baja">Dar de baja de este grupo…</button>' : '') +
        '</div>');
      const elegido = $('panel').querySelector('[data-elegido]');
      if (elegido) elegido.classList.add('elegido');
    }

    function cerrarPanelUsuario(nuevoEstado) {
      const p = app.pase;
      const u = p.usuarios[p.indice];
      if (nuevoEstado) { u.estado = nuevoEstado; vibrar(); }
      const obs = $('obsUsuario');
      if (obs) u.observaciones = obs.value.trim();
      cerrarPanel();
      $('fila' + p.indice).outerHTML = filaUsuario(u, p.indice, !!nuevoEstado);
      pintarPiePase();
      guardarBorrador();
    }

    /**
     * Siguiente pase de lista por hacer, para encadenarlos sin pasar por Inicio: el primer pendiente y, si no hay,
     * el primer grupo del día sin lista. Solo desde Inicio (desde el Historial se corrige un día suelto). null si no hay.
     */
    function siguientePase(p) {
      if (p.volver !== irInicio) return null;
      // Justo después de guardar, Inicio está olvidado y se está volviendo a pedir: se usan los últimos datos recibidos.
      const e = memoria[claveMemoria('api_inicio', [app.fecha])];
      const d = e && e.listo ? e.datos : app.ultimoInicio;
      if (!d || d.fecha !== app.fecha) return null;
      const libre = function (grupoId, fecha) {
        const clave = claveBorrador(grupoId, fecha);
        return !(grupoId === p.grupo.grupo_id && fecha === p.fecha) && !app.guardando[clave] && !app.hechos[clave];
      };
      const pendiente = d.pendientes.find(function (x) { return libre(x.grupo_id, x.fecha); });
      if (pendiente) return { grupo_id: pendiente.grupo_id, fecha: pendiente.fecha, nombre: pendiente.nombre };
      const delDia = d.grupos.find(function (g) { return g.estadoSesion === 'pendiente' && !g.diaEspecial && libre(g.grupo_id, d.fecha); });
      return delDia ? { grupo_id: delDia.grupo_id, fecha: d.fecha, nombre: delDia.nombre } : null;
    }

    function botonSiguiente(accion, texto) {
      const s = siguientePase(app.pase);
      if (!s) return '';
      return '<button type="button" class="boton ancho siguiente" data-accion="' + accion + '" data-siguiente="1">' + esc(texto) +
        '<span class="sub">' + esc(s.nombre) + ' · ' + esc(fechaCorta(s.fecha)) + '</span></button>';
    }

    /** Tras guardar o cancelar: abre el siguiente pase s (si lo hay) o vuelve a la pantalla de origen. */
    function seguirTrasPase(p, s) {
      if (s) abrirPase(s.grupo_id, s.fecha, p.volver);
      else p.volver();
    }

    function abrirResumenGuardar() {
      const cuenta = contadores();
      let lista = '<ul class="resumen-lista">';
      Object.keys(cuenta).forEach(function (c) {
        lista += '<li>' + chipEstado(c) + '<strong>' + cuenta[c] + '</strong></li>';
      });
      lista += '<li><span>Total</span><strong>' + app.pase.usuarios.length + '</strong></li></ul>';
      abrirPanel('<div><h3>¿Guardar la lista?</h3><p>' + esc(app.pase.grupo.nombre) + ' · ' + esc(fechaLarga(app.pase.fecha)) + '</p>' +
        lista + '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton lleno" data-accion="confirmar-guardar">' + ICONO_GUARDAR + 'Sí, guardar</button></div>' +
        botonSiguiente('confirmar-guardar', 'Guardar y pasar a la siguiente') + '</div>');
    }

    /**
     * Guarda en segundo plano: vuelve (o abre el siguiente pase) sin esperar al servidor. Las marcas quedan en el
     * borrador hasta que el servidor confirma; si falla, la tarjeta sale como «Sin guardar» y al reabrir se recuperan.
     */
    function guardarPase(conSiguiente) {
      const p = app.pase;
      const grupoId = p.grupo.grupo_id;
      const clave = claveBorrador(grupoId, p.fecha);
      const payload = {
        grupo_id: grupoId,
        fecha: p.fecha,
        nota: p.nota,
        registros: p.usuarios.map(function (u) {
          return { usuario_id: u.usuario_id, estado: u.estado, observaciones: u.observaciones };
        })
      };
      guardarBorrador();
      const borradorEnviado = leerBorradorTexto(clave);
      const siguiente = conSiguiente ? siguientePase(p) : null;
      app.guardando[clave] = 'guardando';
      seguirTrasPase(p, siguiente);

      llamarSinCarga(false, 'api_guardarSesion', [payload]).then(function () {
        delete app.guardando[clave];
        app.hechos[clave] = true;
        // Si se ha vuelto a abrir y cambiar mientras se guardaba, se conserva el borrador nuevo.
        if (leerBorradorTexto(clave) === borradorEnviado) borrarBorrador(grupoId, p.fecha);
        anticuar('sesion', grupoId, p.fecha);
        aviso('Lista guardada: ' + p.grupo.nombre + ', ' + fechaCorta(p.fecha) + '.');
        trasGuardarEnFondo(clave);
        precargar();
      }).catch(function (e) {
        app.guardando[clave] = 'error';
        aviso('No se ha guardado ' + p.grupo.nombre + ' (' + fechaCorta(p.fecha) + '). ' + e.message, true);
        trasGuardarEnFondo(clave);
      });
    }

    function trasGuardarEnFondo(clave) {
      refrescarVista();
      // Si se ha vuelto a abrir ese mismo pase mientras se guardaba, se quita o cambia su aviso.
      if (app.vista === 'pase' && app.pase && claveBorrador(app.pase.grupo.grupo_id, app.pase.fecha) === clave) pintarPase();
    }

    /** Vuelve a pintar Inicio o el Historial, si son la pantalla abierta, sin mover la página. */
    function refrescarVista() {
      const y = window.scrollY;
      const recolocar = function () { window.scrollTo(0, y); };
      if (app.vista === 'inicio') {
        pedirCon(false, 'api_inicio', [app.fecha]).then(function (d) { pintarInicio(d); recolocar(); }).catch(function () { /* se queda como está */ });
      } else if (app.vista === 'historial') {
        const grupoId = app.hist.grupo_id;
        const mes = app.hist.mes;
        pedirCon(false, 'api_historial', [grupoId, mes]).then(function (d) {
          if (app.vista === 'historial' && app.hist.grupo_id === grupoId && app.hist.mes === mes) { pintarHistorial(d); recolocar(); }
        }).catch(function () { /* se queda como está */ });
      }
    }

    function abrirCancelarSesion() {
      abrirPanel('<div><h3>¿Marcar la sesión como cancelada?</h3>' +
        '<p>No contará como clase realizada y se borrarán las marcas guardadas de este día.</p>' +
        '<div class="campo"><label for="motivoCancelar">Motivo (opcional)</label><textarea id="motivoCancelar" rows="2"></textarea></div>' +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">No</button>' +
        '<button type="button" class="boton peligro-lleno" data-accion="confirmar-cancelar">Sí, cancelar</button></div>' +
        botonSiguiente('confirmar-cancelar', 'Cancelar y pasar a la siguiente') + '</div>');
    }

    function cancelarPase(conSiguiente) {
      const p = app.pase;
      // Se busca antes de anticuar, que olvida los datos de Inicio de donde sale.
      const siguiente = conSiguiente ? siguientePase(p) : null;
      llamar('api_cancelarSesion', p.grupo.grupo_id, p.fecha, $('motivoCancelar').value.trim()).then(function () {
        app.hechos[claveBorrador(p.grupo.grupo_id, p.fecha)] = true;
        borrarBorrador(p.grupo.grupo_id, p.fecha);
        anticuar('sesion', p.grupo.grupo_id, p.fecha);
        aviso('Sesión marcada como cancelada.');
        seguirTrasPase(p, siguiente);
        precargar();
      }).catch(avisoError);
    }

    /** «No hubo clase» en un pendiente de Inicio: cancela la sesión sin abrir el pase de lista. */
    let cancelarPendiente = null;
    function abrirNoHuboClase(grupoId, fecha) {
      const d = app.ultimoInicio;
      const p = d && d.pendientes.find(function (x) { return x.grupo_id === grupoId && x.fecha === fecha; });
      cancelarPendiente = { grupo_id: grupoId, fecha: fecha, nombre: p ? p.nombre : grupoId };
      abrirPanel('<div><h3>¿No hubo clase?</h3>' +
        '<p><strong>' + esc(cancelarPendiente.nombre) + '</strong> · ' + esc(fechaLarga(fecha)) + '</p>' +
        '<p>Se marcará como sesión cancelada y dejará de salir en Pendientes.</p>' +
        '<div class="campo"><label for="motivoCancelar">Motivo (opcional)</label><textarea id="motivoCancelar" rows="2"></textarea></div>' +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">No</button>' +
        '<button type="button" class="boton peligro-lleno" data-accion="confirmar-no-hubo">Sí, cancelar</button></div></div>');
    }

    function cancelarDesdeInicio() {
      const c = cancelarPendiente;
      if (!c) return;
      const clave = claveBorrador(c.grupo_id, c.fecha);
      llamar('api_cancelarSesion', c.grupo_id, c.fecha, $('motivoCancelar').value.trim()).then(function () {
        cancelarPendiente = null;
        app.hechos[clave] = true;
        borrarBorrador(c.grupo_id, c.fecha);
        anticuar('sesion', c.grupo_id, c.fecha);
        cerrarPanel();
        aviso('Sesión marcada como cancelada: ' + c.nombre + ', ' + fechaCorta(c.fecha) + '.');
        // Se quita al momento de la lista y después se repinta con los datos del servidor.
        if (app.vista === 'inicio' && app.ultimoInicio) {
          const d = copia(app.ultimoInicio);
          d.pendientes = d.pendientes.filter(function (x) { return claveBorrador(x.grupo_id, x.fecha) !== clave; });
          const y = window.scrollY;
          pintarInicio(d);
          window.scrollTo(0, y);
        }
        refrescarVista();
        precargar();
      }).catch(avisoError);
    }

    // ---------- Altas y bajas de un grupo ----------

    function abrirGrupo(grupoId, pestana, volver) {
      pedir('api_grupo', grupoId).then(function (d) {
        d.volver = volver || (app.grupo && app.grupo.grupo.grupo_id === grupoId ? app.grupo.volver : irInicio);
        app.grupo = d;
        app.pestana = pestana || 'lista';
        pantallaSecundaria('grupo', d.grupo.nombre, d.grupo.taller + ' · ' + d.inscritos.length + ' inscritos', d.volver);
        pintarGrupo();
      }).catch(avisoError);
    }

    function pintarGrupo() {
      const d = app.grupo;
      const pestanas = [['lista', 'Lista'], ['alta', 'Alta'], ['baja', 'Baja']];
      let html = '<div class="pestanas">' + pestanas.map(function (p) {
        return '<button type="button" class="pestana' + (app.pestana === p[0] ? ' activa' : '') + '" data-accion="pestana" data-pestana="' +
          p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div>';

      if (app.pestana === 'lista') html += htmlLista(d);
      if (app.pestana === 'alta') html += htmlAlta();
      if (app.pestana === 'baja') html += htmlBaja(d);
      // Botón flotante de Material 3 en la Lista: lleva a Alta con el buscador listo para escribir.
      if (app.pestana === 'lista') {
        html += '<div class="hueco-fab"></div><button type="button" class="fab" data-accion="pestana" data-pestana="alta" data-enfocar="1">' +
          ICONO_MAS + 'Inscribir</button>';
      }
      pintar(html);
      if (app.pestana === 'alta' && app.enfocarBuscador) { app.enfocarBuscador = false; $('textoBuscar').focus(); }
    }

    function htmlLista(d) {
      if (!d.inscritos.length) return '<p class="vacio">Todavía no hay usuarios inscritos.</p>';
      return '<p class="ayuda">Toca a un usuario para darle de baja o cambiarle de grupo.</p><div class="lista">' + d.inscritos.map(function (u) {
        return '<div class="resultado tocable" data-accion="inscrito" data-inscripcion="' + esc(u.inscripcion_id) + '">' + avatar(u.nombre) +
          '<div class="cuerpo"><div><strong>' + esc(nombreVisible(u.nombre)) + '</strong></div>' +
          '<div class="sub">ID ' + esc(u.usuario_id) + ' · alta ' + esc(fechaNumerica(u.fecha_alta)) +
          (u.fecha_baja ? ' · baja ' + esc(fechaNumerica(u.fecha_baja)) : '') + '</div></div>' + enlaceLlamar(u.telefono) + '</div>';
      }).join('') + '</div>';
    }

    /** Panel de un usuario de la pestaña Lista: baja, cambio de grupo y llamada, con el usuario ya elegido. */
    function abrirPanelInscrito(inscripcionId) {
      const u = app.grupo.inscritos.find(function (x) { return x.inscripcion_id === inscripcionId; });
      if (!u) return;
      let html = '<div><h3>' + esc(nombreVisible(u.nombre)) + '</h3><p>ID ' + esc(u.usuario_id) + ' · alta ' + esc(fechaNumerica(u.fecha_alta)) +
        (u.fecha_baja ? '<br>Ya tiene la baja: su último día es el ' + esc(fechaNumerica(u.fecha_baja)) + '.' : '') + '</p><div class="pila">';
      if (!u.fecha_baja) {
        html += '<button type="button" class="boton peligro ancho" data-accion="panel-baja" data-inscripcion="' + esc(u.inscripcion_id) + '">Dar de baja</button>' +
          '<button type="button" class="boton ancho" data-accion="panel-cambio" data-inscripcion="' + esc(u.inscripcion_id) + '">Cambiar de grupo</button>';
      }
      if (u.telefono) {
        html += '<a class="boton ancho" href="tel:' + esc(u.telefono) + '">' + ICONO_TELEFONO + ' Llamar al ' + esc(u.telefono) + '</a>';
      }
      html += '<button type="button" class="boton ancho" data-accion="cerrar-panel">Cerrar</button></div></div>';
      abrirPanel(html);

    function camposBaja() {
      return '<div class="campo"><label for="fechaBaja">Último día en el grupo</label><input type="date" id="fechaBaja" value="' + esc(app.init.hoy) + '"></div>' +

        opciones(app.init.motivosBaja, '') + '</select></div>';

    function camposCambio(destinos) {
      const opcionesDestino = '<option value="">— Elige el grupo nuevo —</option>' + destinos.map(function (g) {
        return '<option value="' + esc(g.grupo_id) + '">' + esc(g.taller) + ' · ' + esc(g.nombre) + (g.dias ? ' (' + esc(g.dias) + ')' : '') + '</option>';
      }).join('');
      return '<div class="campo"><label for="grupoDestino">Grupo nuevo</label><select id="grupoDestino">' + opcionesDestino + '</select></div>' +
        '<div class="campo"><label for="fechaCambio">Primer día en el grupo nuevo</label><input type="date" id="fechaCambio" value="' + esc(app.init.hoy) + '"></div>';

    /** Baja o cambio de grupo de un usuario ya elegido, en el panel: el campo oculto bajaUsuario hace de selector para pedirBaja/pedirCambio. */
    function abrirPanelBaja(inscripcionId) {
      abrirPanel('<div><h3>Dar de baja</h3><p><strong>' + esc(nombreVisible(nombreInscripcion(inscripcionId))) + '</strong></p>' +
        '<input type="hidden" id="bajaUsuario" value="' + esc(inscripcionId) + '">' + camposBaja() +

    function abrirPanelCambio(inscripcionId) {
      abrirPanel('<div><h3>Cambiar de grupo</h3><p><strong>' + esc(nombreVisible(nombreInscripcion(inscripcionId))) + '</strong></p>' +
        '<input type="hidden" id="bajaUsuario" value="' + esc(inscripcionId) + '">' + camposCambio(app.grupo.destinos) +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton primario" data-accion="cambiar-grupo">Cambiar de grupo</button></div></div>');

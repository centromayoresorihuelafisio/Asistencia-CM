    function irCurso() {
      const c = app.gest.config;
      pantallaSecundaria('g-curso', 'Curso', '', volverGestion);
      pintar('<div class="bloque">' +
        '<div class="campo"><label for="cCurso">Nombre del curso</label><input type="text" id="cCurso" enterkeyhint="done" value="' + esc(c.curso) + '" placeholder="2026-2027"></div>' +
        '<div class="fila-campos"><div class="campo"><label for="cInicio">Primer día de clase</label><input type="date" id="cInicio" value="' + esc(c.inicio) + '"></div>' +
        '<div class="campo"><label for="cFin">Último día de clase</label><input type="date" id="cFin" value="' + esc(c.fin) + '"></div></div>' +
        '<div class="campo"><label for="cPendientes">Avisar de listas sin pasar de los últimos… (días)</label>' +
        '<input type="number" id="cPendientes" inputmode="numeric" enterkeyhint="next" min="1" max="60" value="' + esc(c.diasPendientes) + '"></div>' +
        '<div class="campo"><label for="cFaltas">Avisar en el pase de lista a partir de… faltas seguidas</label>' +
        '<input type="number" id="cFaltas" inputmode="numeric" enterkeyhint="done" min="2" max="20" value="' + esc(c.faltasSeguidas) + '"></div>' +
        '<p class="ayuda">Fuera de estas fechas no se avisa de pendientes. Los grupos nuevos se apuntan en el curso indicado.</p>' +
        '<button type="button" class="boton primario ancho" data-accion="g-guardar-curso">Guardar</button></div>');
    }

    function guardarCurso() {
      const datos = { curso: valor('cCurso'), inicio: valor('cInicio'), fin: valor('cFin'), diasPendientes: valor('cPendientes'), faltasSeguidas: valor('cFaltas') };
      const entero = function (v, min, max) { const n = Number(v); return v !== '' && Math.floor(n) === n && n >= min && n <= max; };
      if (!datos.curso) return errorCampo('cCurso', 'Escribe el nombre del curso (por ejemplo, 2026-2027).');
      if (!datos.inicio) return errorCampo('cInicio', 'Indica el primer día de clase.');
      if (!datos.fin) return errorCampo('cFin', 'Indica el último día de clase.');
      if (datos.fin < datos.inicio) return errorCampo('cFin', 'El último día es anterior al primero.');
      if (!entero(datos.diasPendientes, 1, 60)) return errorCampo('cPendientes', 'Escribe un número de días entre 1 y 60.');
      if (!entero(datos.faltasSeguidas, 2, 20)) return errorCampo('cFaltas', 'Escribe un número entre 2 y 20.');
      llamar('api_guardarConfig', datos).then(function () {
        aviso('Curso guardado.');
        return recargarDatos('gestion');
      }).then(siSigue(volverGestion)).catch(avisoError);
    }

    // --- Listas ---

    function irListas() {
      const l = app.gest.listas;
      pantallaSecundaria('g-listas', 'Listas', 'Motivos de baja, tipos de día libre y observaciones rápidas', volverGestion);
      pintar('<div class="bloque"><h3>Motivos de baja</h3>' +
        '<div class="campo"><label for="lMotivos">Uno por línea</label><textarea id="lMotivos" rows="7">' + esc(l.motivo_baja.join('\n')) + '</textarea>' +
        '<p class="ayuda">«' + esc(app.gest.motivoReservado) + '» se mantiene siempre: lo usa la acción de cambiar de grupo.</p></div>' +
        '<button type="button" class="boton primario ancho" data-accion="g-guardar-lista" data-lista="motivo_baja" data-campo="lMotivos">Guardar motivos</button></div>' +
        '<div class="bloque"><h3>Tipos de día libre</h3>' +
        '<div class="campo"><label for="lTipos">Uno por línea</label><textarea id="lTipos" rows="5">' + esc(l.tipo_dia.join('\n')) + '</textarea></div>' +
        '<button type="button" class="boton primario ancho" data-accion="g-guardar-lista" data-lista="tipo_dia" data-campo="lTipos">Guardar tipos</button></div>' +
        '<div class="bloque"><h3>Observaciones rápidas</h3>' +
        '<div class="campo"><label for="lObs">Una por línea</label><textarea id="lObs" rows="5">' + esc((l.obs_rapida || []).join('\n')) + '</textarea>' +
        '<p class="ayuda">Salen como botones en el panel de cada usuario del pase de lista y se añaden a sus observaciones con un toque.</p></div>' +
        '<button type="button" class="boton primario ancho" data-accion="g-guardar-lista" data-lista="obs_rapida" data-campo="lObs">Guardar observaciones</button></div>');
    }

    function guardarLista(lista, campo) {
      const valores = $(campo).value.split('\n').map(function (v) { return v.trim(); }).filter(Boolean);
      if (!valores.length && lista !== 'motivo_baja') return errorCampo(campo, 'La lista no puede quedar vacía: escribe al menos uno.');
      llamar('api_guardarLista', lista, valores).then(function () {
        aviso('Cambios guardados.');
        return recargarDatos('lista');
      }).then(siSigue(irListas)).catch(avisoError);
    }

    // ---------- Eventos ----------

    function volverAHistorial() { irHistorial(); }

    // Mantener pulsada una fila del pase de lista abre su panel (como «⋮»). El clic que llega al soltar se descarta.
    let pulsacionLarga = null;
    let saltarClic = false;
    const MS_PULSACION_LARGA = 500;
    function cortarPulsacion() {
      if (pulsacionLarga) { clearTimeout(pulsacionLarga.temporizador); pulsacionLarga = null; }
    }
    document.addEventListener('pointerdown', function (ev) {
      saltarClic = false;
      cortarPulsacion();
      if (ev.button !== 0) return;
      const fila = ev.target.closest('.fila-usuario');
      if (!fila || ev.target.closest('a.llamar, .mas-opciones')) return;
      pulsacionLarga = {
        x: ev.clientX,
        y: ev.clientY,
        temporizador: setTimeout(function () {
          pulsacionLarga = null;
          saltarClic = true;
          vibrar();
          abrirPanelUsuario(Number(fila.getAttribute('data-indice')));
        }, MS_PULSACION_LARGA)
      };
    }, { passive: true });
    document.addEventListener('pointermove', function (ev) {
      if (pulsacionLarga && Math.hypot(ev.clientX - pulsacionLarga.x, ev.clientY - pulsacionLarga.y) > 10) cortarPulsacion();
    }, { passive: true });
    document.addEventListener('pointerup', cortarPulsacion, { passive: true });
    document.addEventListener('pointercancel', cortarPulsacion, { passive: true });
    // ---------- Deslizar (5-nov-2026) ----------
    // Un gesto solo cuenta como deslizamiento si es claramente horizontal: más de MIN_DECIDIR px de lado y el
    // doble de lado que de alto. Si empieza en vertical, se deja al scroll. Así no choca con el toque, la pulsación
    // larga (que se corta al moverse) ni el scroll de la página (touch-action: pan-y en Estilos.html).
    // - Fila del pase: hacia la izquierda, el primer estado «ausente» (Falta); hacia la derecha, el de por defecto
    //   (Asistido). El fondo de color con el icono aparece al arrastrar; pasados UMBRAL_FILA px, se aplica al soltar.
    // - Inicio y Historial (fuera de la cuadrícula): hacia la izquierda, el día o mes siguiente; hacia la derecha, el
    //   anterior. Lo mismo que las flechas.

    const MIN_DECIDIR = 12;
    const UMBRAL_FILA = 80;
    const UMBRAL_PAGINA = 70;
    let gesto = null;   // { tipo: 'fila' | 'pagina', x, y, id, decidido, dx, fila, fondo }

    function puedeDeslizarPagina(ev) {
      if (app.vista !== 'inicio' && app.vista !== 'historial') return false;
      if (panelAbierto() || !$('vista').contains(ev.target)) return false;
      return !ev.target.closest('.marco-historial, .tabla-scroll, input, textarea, select, .selector-fecha, .selector-mes');
    }

    document.addEventListener('pointerdown', function (ev) {
      gesto = null;
      if (ev.button !== 0 || !ev.isPrimary) return;
      const fila = app.vista === 'pase' ? ev.target.closest('.fila-usuario') : null;
      if (fila && !ev.target.closest('.mas-opciones') && estadosAlternar()) {
        gesto = { tipo: 'fila', x: ev.clientX, y: ev.clientY, id: ev.pointerId, decidido: false, dx: 0, fila: fila };
      } else if (!fila && ev.pointerType !== 'touch' && puedeDeslizarPagina(ev)) {
        // Con el dedo, el deslizamiento de página va por eventos táctiles (más abajo), sin tocar touch-action.
        gesto = { tipo: 'pagina', x: ev.clientX, y: ev.clientY, id: ev.pointerId, decidido: false, dx: 0 };
      }
    }, { passive: true });

    document.addEventListener('pointermove', function (ev) {
      const g = gesto;
      if (!g || ev.pointerId !== g.id) return;
      const dx = ev.clientX - g.x;
      const dy = ev.clientY - g.y;
      if (!g.decidido) {
        if (Math.abs(dy) > MIN_DECIDIR && Math.abs(dy) > Math.abs(dx)) { gesto = null; return; }   // vertical: scroll
        if (Math.abs(dx) < MIN_DECIDIR || Math.abs(dx) < 2 * Math.abs(dy)) return;
        g.decidido = true;
        cortarPulsacion();
        if (g.tipo === 'fila') {
          try { g.fila.setPointerCapture(ev.pointerId); } catch (e) { /* sin captura: sigue igual */ }
          g.fondo = document.createElement('span');
          g.fondo.className = 'desliz-fondo';
          g.fondo.setAttribute('aria-hidden', 'true');
          g.fila.appendChild(g.fondo);
          g.fila.classList.add('deslizando');
        }
      }
      g.dx = dx;
      if (g.tipo === 'fila') pintarDeslizFila(g);
      else $('vista').style.setProperty('--desliz', String(Math.max(-1, Math.min(1, dx / 240))));
    }, { passive: true });

    /** Fondo de la fila mientras se arrastra: color e icono del estado que se pondrá, más marcado pasado el umbral. */
    function pintarDeslizFila(g) {
      const par = estadosAlternar();
      const e = g.dx < 0 ? par.falta : par.presente;
      const listo = Math.abs(g.dx) >= UMBRAL_FILA;
      g.fila.style.setProperty('--dx', g.dx + 'px');
      if (g.lado !== e.codigo) {
        g.lado = e.codigo;
        g.fondo.className = 'desliz-fondo ' + (g.dx < 0 ? 'a-la-izquierda' : 'a-la-derecha');
        g.fondo.style.setProperty('--desliz-color', e.color);
        g.fondo.innerHTML = iconoEstado(e) + '<span>' + esc(e.etiqueta) + '</span>';
      }
      g.fondo.style.width = Math.abs(g.dx) + 'px';
      if (listo !== !!g.listo) {
        g.listo = listo;
        g.fondo.classList.toggle('listo', listo);
        if (listo) vibrar();
      }
    }

    function soltarGesto(ev, cancelado) {
      const g = gesto;
      if (!g || ev.pointerId !== g.id) return;
      gesto = null;
      if (!g.decidido) return;
      saltarClic = true;   // el clic que llega al soltar no alterna el estado ni abre nada
      setTimeout(function () { saltarClic = false; }, 0);
      if (g.tipo === 'pagina') { soltarPagina(g.dx, cancelado); return; }
      const fila = g.fila;
      const i = Number(fila.getAttribute('data-indice'));
      const par = estadosAlternar();
      const nuevo = g.dx < 0 ? par.falta.codigo : par.presente.codigo;
      const p = app.pase;
      if (!cancelado && Math.abs(g.dx) >= UMBRAL_FILA && p && p.usuarios[i] && fila.isConnected) {
        const u = p.usuarios[i];
        if (u.estado !== nuevo) {
          u.estado = nuevo;
          vibrar();
          fila.outerHTML = filaUsuario(u, i, true);
          pintarPiePase();
          guardarBorrador();
          return;
        }
      }
      // Sin cambio: la fila vuelve a su sitio.
      fila.classList.add('volviendo');
      fila.style.setProperty('--dx', '0px');
      if (g.fondo) g.fondo.style.width = '0px';
      setTimeout(function () {
        fila.classList.remove('deslizando', 'volviendo');
        fila.style.removeProperty('--dx');
        if (g.fondo) g.fondo.remove();
      }, MS_VUELTA_FILA);
    }
    const MS_VUELTA_FILA = 200;   // como --dur-panel

    /** Fin de un deslizamiento de página: pasado el umbral, el día o mes siguiente (dx < 0) o el anterior. */
    function soltarPagina(dx, cancelado) {
      $('vista').style.removeProperty('--desliz');
      if (cancelado || Math.abs(dx) < UMBRAL_PAGINA) return;
      const n = dx < 0 ? 1 : -1;
      const cambia = app.vista === 'inicio' ? saltarDia(n) : app.vista === 'historial' ? saltarMes(n) : true;
      if (!cambia) aviso(app.vista === 'inicio' ? 'No se puede pasar de hoy.' : 'No se puede pasar del mes actual.');
    }
    document.addEventListener('pointerup', function (ev) { soltarGesto(ev, false); }, { passive: true });
    document.addEventListener('pointercancel', function (ev) { soltarGesto(ev, true); }, { passive: true });

    // ---------- Tirar hacia abajo para actualizar Inicio (5-nov-2026) ----------
    // Con eventos táctiles (los de puntero se cortan en cuanto empieza el scroll): si Inicio está arriba del todo y
    // el dedo baja, se para el scroll del navegador y baja un círculo que gira con el dedo. Pasados UMBRAL_TIRAR px,
    // al soltar se olvida la memoria de Inicio y se vuelve a pedir; el círculo gira hasta que llegan los datos.

    const UMBRAL_TIRAR = 72;
    const MAX_TIRAR = 120;
    let toque = null;   // { y, x, dy, dx, tirar (puede tirar), pagina (puede deslizar), modo: '' | 'tirar' | 'pagina' }
    let refrescando = false;

    // El dedo también desliza entre días y meses por aquí (y no con eventos de puntero): así no hace falta quitar
    // el scroll lateral del navegador (touch-action), que necesitan las tablas.
    document.addEventListener('touchstart', function (ev) {
      toque = null;
      if (ev.touches.length !== 1 || panelAbierto()) return;
      const t = ev.touches[0];
      const puedeTirar = app.vista === 'inicio' && !refrescando && window.scrollY <= 0 &&
        ($('vista').contains(ev.target) || $('barra').contains(ev.target));
      const puedePagina = puedeDeslizarPagina(ev);
      if (!puedeTirar && !puedePagina) return;
      toque = { y: t.clientY, x: t.clientX, dy: 0, dx: 0, tirar: puedeTirar, pagina: puedePagina, modo: '' };
    }, { passive: true });

    document.addEventListener('touchmove', function (ev) {
      const t = toque;
      if (!t) return;
      const dy = ev.touches[0].clientY - t.y;
      const dx = ev.touches[0].clientX - t.x;
      if (!t.modo) {
        if (t.pagina && Math.abs(dx) >= MIN_DECIDIR && Math.abs(dx) >= 2 * Math.abs(dy)) {
          t.modo = 'pagina';
        } else if (t.tirar && dy >= MIN_DECIDIR && dy > Math.abs(dx) && window.scrollY <= 0) {
          t.modo = 'tirar';
        } else if (Math.abs(dy) > MIN_DECIDIR || Math.abs(dx) > MIN_DECIDIR) {
          toque = null;   // otro gesto (scroll normal): se deja al navegador
          return;
        } else {
          return;
        }
        cortarPulsacion();
        gesto = null;
      }
      if (ev.cancelable) ev.preventDefault();   // sin scroll, rebote ni recarga del navegador
      if (t.modo === 'pagina') {
        t.dx = dx;
        $('vista').style.setProperty('--desliz', String(Math.max(-1, Math.min(1, dx / 240))));
      } else {
        // Resistencia: el círculo baja la mitad que el dedo, hasta MAX_TIRAR px.
        t.dy = Math.max(0, Math.min(MAX_TIRAR, (dy - MIN_DECIDIR) * 0.5));
        pintarTirar(t.dy, false);
      }
    }, { passive: false });

    document.addEventListener('touchend', function () {
      const t = toque;
      toque = null;
      if (!t || !t.modo) return;
      saltarClic = true;
      setTimeout(function () { saltarClic = false; }, 0);
      if (t.modo === 'pagina') { soltarPagina(t.dx, false); return; }
      if (t.dy >= UMBRAL_TIRAR * 0.5) refrescarInicio();
      else pintarTirar(0, false);
    }, { passive: true });
    document.addEventListener('touchcancel', function () {
      const t = toque;
      toque = null;
      if (!t) return;
      if (t.modo === 'tirar') pintarTirar(0, false);
      if (t.modo === 'pagina') soltarPagina(0, true);
    }, { passive: true });

    /** Coloca el círculo: dy px por debajo de la barra (0 = escondido). girando: gira solo, esperando al servidor. */
    function pintarTirar(dy, girando) {
      const el = $('tirar');
      el.classList.toggle('oculto', dy <= 0 && !girando);
      el.classList.toggle('girando', !!girando);
      el.classList.toggle('listo', dy >= UMBRAL_TIRAR * 0.5);
      el.style.setProperty('--tirar-y', dy + 'px');
      el.style.setProperty('--tirar-giro', (dy * 4) + 'deg');
      el.style.setProperty('--tirar-trazo', String(Math.min(1, dy / (UMBRAL_TIRAR * 0.5))));
    }

    /** Olvida la memoria de Inicio y la vuelve a pedir; el círculo gira mientras tanto. */
    function refrescarInicio() {
      refrescando = true;
      pintarTirar(UMBRAL_TIRAR * 0.5, true);
      olvidar('api_inicio');
      const n = app.nav;
      const fin = function () {
        refrescando = false;
        pintarTirar(0, false);
      };
      pedirCon(false, 'api_inicio', [app.fecha]).then(function (d) {
        fin();
        if (n !== app.nav || app.vista !== 'inicio') return;
        pintarInicio(d);
        precargarSesiones(d);
        aviso('Inicio actualizado');
      }, function (e) {
        fin();
        if (n === app.nav) avisoError(e);
      });
    }

    // Sin menú del navegador al mantener pulsada una fila.
    document.addEventListener('contextmenu', function (ev) {
      if (ev.target.closest('.fila-usuario')) ev.preventDefault();
    });
    // Las filas con role="button" responden también a Intro y Espacio.
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && panelAbierto()) {
        ev.preventDefault();
        cerrarPanelComoFondo();
        return;
      }
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-accion]')) {
        ev.preventDefault();
        ev.target.click();
      }
    });

    document.addEventListener('click', function (ev) {
      if (saltarClic) { saltarClic = false; return; }
      if (ev.target.closest('a.llamar')) return;
      const el = ev.target.closest('[data-accion]');
      if (!el) return;
      const accion = el.getAttribute('data-accion');
      const dato = function (n) { return el.getAttribute('data-' + n); };
      // Si este toque lanza una escritura (llamar), ese botón queda ocupado hasta que responda.
      botonPulsado = el.tagName === 'BUTTON' ? el : null;
      try {
        accionClic(accion, el, dato);
      } finally {
        botonPulsado = null;
      }
    });

    function accionClic(accion, el, dato) {
      switch (accion) {
        case 'reintentar-carga': if (app.reintentar) app.reintentar(); break;
        case 'nav': irSeccion(dato('destino')); break;
        case 'pase':
          if (app.vista === 'inicio') abrirPaseConTransicion(el, dato('grupo'), dato('fecha'));
          else abrirPase(dato('grupo'), dato('fecha'), irInicio);
          break;
        case 'pase-desde-menu': {
          const g = dato('grupo');
          const f = dato('fecha');
          cerrarPanel();
          abrirPase(g, f, irInicio);
          break;
        }
        case 'grupo': abrirGrupo(dato('grupo'), 'lista', irInicio); break;
        case 'usuario': abrirPanelUsuario(Number(dato('indice'))); break;
        case 'alternar': alternarEstado(Number(dato('indice'))); break;
        case 'elegir-estado': cerrarPanelUsuario(dato('estado')); break;
        case 'cerrar-usuario': cerrarPanelUsuario(null); break;
        case 'obs-rapida': anadirObsRapida(dato('texto')); break;
        case 'aplicar-todos':
          abrirPanel('<div><h3>Aplicar a todos</h3><p>Se pondrá el mismo estado a todo el grupo. Después puedes cambiar casos sueltos.</p>' +
            botonesEstados('aplicar-estado') + '<button type="button" class="boton ancho" data-accion="cerrar-panel">Cancelar</button></div>');
          break;
        case 'aplicar-estado': aplicarATodos(dato('estado')); break;
        case 'menu-pase': abrirMenuPase(); break;
        case 'nota-sesion': abrirNotaSesion(); break;
        case 'nota-hecho': cerrarNotaSesion(); break;
        case 'pase-inscribir': {
          const p = app.pase;
          abrirGrupo(p.grupo.grupo_id, 'alta', function () { abrirPase(p.grupo.grupo_id, p.fecha, p.volver); });
          break;
        }
        case 'menu-pendiente': abrirMenuPendiente(dato('grupo'), dato('fecha')); break;
        case 'aviso-accion': {
          const a = accionAviso;
          cerrarAviso();
          botonPulsado = null;   // el botón del aviso ya no se ve: no se ocupa
          if (a) a.fn();
          break;
        }
        case 'guardar': pedirGuardar(); break;
        case 'confirmar-guardar': guardarPase(!!dato('siguiente')); break;
        case 'cancelar-sesion': abrirCancelarSesion(); break;
        case 'confirmar-cancelar': cancelarPase(!!dato('siguiente')); break;
        case 'dia': saltarDia(Number(dato('salto'))); break;
        case 'no-hubo-clase': abrirNoHuboClase(dato('grupo'), dato('fecha')); break;
        case 'confirmar-no-hubo': cancelarDesdeInicio(); break;
        case 'reintentar-guardados': reintentarGuardados(true); break;
        case 'cerrar-panel': cerrarPanel(); break;
        case 'fecha-atajo': elegirAtajoFecha(el); break;
        case 'confirmar-si': if (confirmacionPendiente) confirmacionPendiente(); break;
        case 'parecido-usar': cerrarPanel(); if (parecidosPendiente) parecidosPendiente.usar(dato('usuario')); break;
        case 'parecido-crear': cerrarPanel(); if (parecidosPendiente) parecidosPendiente.crear(); break;
        case 'pestana': app.pestana = dato('pestana'); app.enfocarBuscador = !!dato('enfocar'); pintarGrupo(); break;
        case 'inscribir': inscribir({ usuario_id: dato('usuario') }); break;
        case 'crear-usuario': {
          const id = valor('nuevoId');
          const nombre = valor('nuevoNombre');
          if (!id) { errorCampo('nuevoId', 'Escribe el ID del centro.'); break; }
          if (!nombre) { errorCampo('nuevoNombre', 'Escribe los apellidos y el nombre.'); break; }
          inscribir({ usuario_id: id, nombre: nombre, telefono: valor('nuevoTelefono') });
          break;
        }
        case 'dar-baja': pedirBaja(); break;
        case 'cambiar-grupo': pedirCambio(); break;
        case 'inscrito': abrirPanelInscrito(dato('inscripcion')); break;
        case 'panel-baja': abrirPanelBaja(dato('inscripcion')); break;
        case 'panel-cambio': abrirPanelCambio(dato('inscripcion')); break;
        case 'pase-baja': {
          // Se guardan antes el estado y las observaciones del panel (quedan en el borrador al reabrir el pase).
          const u = app.pase.usuarios[app.pase.indice];
          cerrarPanelUsuario(null);
          abrirPanelBaja(u.inscripcion_id);
          break;
        }
        // Historial
        case 'mes': saltarMes(Number(dato('salto'))); break;
        case 'hist-inscribir': abrirGrupo(app.hist.grupo_id, 'alta', volverAHistorial); break;
        case 'pase-historial': abrirPase(app.hist.grupo_id, dato('fecha'), volverAHistorial); break;
        case 'ficha': abrirFicha(dato('usuario'), app.vista === 'historial' ? volverAHistorial : irUsuarios, dato('nombre')); break;
        // Informe
        case 'ver-informe': verInforme(); break;
        case 'abrir-periodo': abrirPanelPeriodo(); break;
        case 'abrir-taller': abrirPanelTaller(); break;
        case 'taller-informe': elegirTallerInforme(dato('taller')); break;
        case 'abrir-grupo-hist': abrirPanelGrupoHistorial(); break;
        case 'grupo-hist': elegirGrupoHistorial(dato('grupo')); break;
        case 'periodo': elegirPeriodo(dato('desde'), dato('hasta')); break;
        case 'abrir-exportar': abrirPanelExportar(); break;
        case 'exportar-descargar': descargarInforme(); break;
        case 'exportar-correo': enviarInforme(); break;
        case 'info-porcentaje': abrirInfoPorcentaje(); break;
        // Gestión
        case 'g-grupos': irGrupos(); break;
        case 'g-grupo-nuevo': formularioGrupo(''); break;
        case 'g-grupo': formularioGrupo(dato('grupo')); break;
        case 'g-guardar-grupo': guardarGrupo(dato('grupo')); break;
        case 'g-inscritos': {
          const id = dato('grupo');
          abrirGrupo(id, 'lista', function () { formularioGrupo(id); });
          break;
        }
        case 'g-usuarios': irUsuarios(); break;
        case 'g-usuario-nuevo': formularioUsuarioNuevo(); break;
        case 'g-crear-usuario': crearUsuario(); break;
        case 'g-guardar-usuario': guardarFicha(); break;
        case 'g-inscribir-usuario': inscribirDesdeFicha(); break;
        case 'g-dias': irDias(); break;
        case 'g-guardar-dia': guardarDia(); break;
        case 'g-borrar-dia': borrarDia(dato('fecha'), dato('grupo')); break;
        case 'g-estados': irEstados(); break;
        case 'g-estado': abrirPanelEstado(dato('codigo')); break;
        case 'g-estado-nuevo': abrirPanelEstado(''); break;
        case 'g-dia-nuevo': abrirPanelDia(); break;
        case 'g-guardar-estado': guardarEstado(dato('codigo')); break;
        case 'g-curso': irCurso(); break;
        case 'g-guardar-curso': guardarCurso(); break;
        case 'g-listas': irListas(); break;
        case 'g-monitoras': irMonitoras(); break;
        case 'g-monitora': abrirPanelMonitora(dato('email')); break;
        case 'g-monitora-nueva': abrirPanelMonitora(''); break;
        case 'g-guardar-monitora': guardarMonitora(dato('email')); break;
        case 'g-clave-monitora': pedirClaveMonitora(dato('email')); break;
        case 'clave-enviar': enviarEnlaceClave(); break;
        case 'clave-copiar': copiarEnlaceClave(); break;
        case 'clave-volver': mostrarClaveMonitora(); break;
        case 'g-conexion': if (window.PWA) window.PWA.abrirConexion(true); break;
        case 'g-guardar-lista': guardarLista(dato('lista'), dato('campo')); break;
      }
    }

    document.addEventListener('input', function (ev) {
      quitarError(ev.target);
      if (ev.target.id === 'textoBuscar') buscar();
      if (ev.target.id === 'gBuscarUsuario') programar(buscarUsuariosGestion);
      if (ev.target.id === 'notaSesion' && app.pase) { app.pase.nota = ev.target.value.trim(); guardarBorrador(); pintarNotaPase(); }
    });

    document.addEventListener('click', function (ev) {
      if (ev.target.id !== 'fechaInicio') return;
      try { if (ev.target.showPicker) ev.target.showPicker(); } catch (e) { /* ya abierto o sin calendario emergente */ }
    });

    document.addEventListener('change', function (ev) {
      quitarError(ev.target);
      if (ev.target.id === 'fechaInicio' && ev.target.value) {
        app.fecha = ev.target.value;
        irInicio();
      }
      if (ev.target.id === 'gTaller') {
        $('campoTallerNuevo').classList.toggle('oculto', ev.target.value !== '__nuevo__');
      }
    });

    $('fondoPanel').addEventListener('click', cerrarPanelComoFondo);

    // Aviso de abajo: tocarlo lo cierra (salvo su botón) y deslizarlo hacia un lado, también.
    let deslizar = null;
    $('aviso').addEventListener('pointerdown', function (ev) {
      if (ev.target.closest('.aviso-accion')) return;
      deslizar = { x: ev.clientX, dx: 0, id: ev.pointerId };
      try { $('aviso').setPointerCapture(ev.pointerId); } catch (e) { /* sin captura: sigue igual */ }
      clearTimeout(temporizadorAviso);   // mientras se toca, no se cierra solo
    });
    $('aviso').addEventListener('pointermove', function (ev) {
      if (!deslizar || ev.pointerId !== deslizar.id) return;
      deslizar.dx = ev.clientX - deslizar.x;
      $('aviso').style.transform = 'translateX(' + deslizar.dx + 'px)';
      $('aviso').style.opacity = String(Math.max(0.2, 1 - Math.abs(deslizar.dx) / 240));
    });
    function soltarAviso(ev) {
      if (!deslizar || ev.pointerId !== deslizar.id) return;
      const dx = deslizar.dx;
      deslizar = null;
      // Un toque (casi sin moverse) o un deslizamiento largo lo cierran; uno corto lo deja donde estaba.
      if (Math.abs(dx) > MIN_DESLIZAR || Math.abs(dx) < 10) { cerrarAviso(); return; }
      $('aviso').style.transform = '';
      $('aviso').style.opacity = '';
      temporizadorAviso = setTimeout(cerrarAviso, accionAviso ? MS_DESHACER : MS_AVISO);
    }
    $('aviso').addEventListener('pointerup', soltarAviso);
    $('aviso').addEventListener('pointercancel', function (ev) {
      if (!deslizar || ev.pointerId !== deslizar.id) return;
      deslizar.dx = 20;   // ni toque ni deslizamiento: se queda
      soltarAviso(ev);
    });
    window.addEventListener('resize', colocarAviso);

    // Arrastrar el asa del panel hacia abajo: lo sigue con el dedo y, pasados MIN_ARRASTRE px, lo cierra.
    // Un panel de dos alturas (5-nov-2026) también sube: a media pantalla, arrastrar hacia arriba lo hace crecer
    // con el dedo y, pasados MIN_SUBIR px, se queda a pantalla completa. A pantalla completa, arrastrar hacia abajo
    // lo devuelve a media pantalla, y si se baja más allá de esa altura (más MIN_ARRASTRE), se cierra.
    let arrastre = null;
    $('panel').addEventListener('pointerdown', function (ev) {
      if (!ev.target.closest('.panel-asa') || !panelAbierto()) return;
      const panel = $('panel');
      arrastre = { y: ev.clientY, dy: 0, id: ev.pointerId, alto: panel.offsetHeight,
        modo: panel.classList.contains('completa') ? 'completa' : panel.classList.contains('media') ? 'media' : '' };
      try { ev.target.setPointerCapture(ev.pointerId); } catch (e) { /* sin captura: sigue igual */ }
      panel.classList.add('arrastrando');
    });
    $('panel').addEventListener('pointermove', function (ev) {
      if (!arrastre || ev.pointerId !== arrastre.id) return;
      const panel = $('panel');
      const dy = ev.clientY - arrastre.y;
      arrastre.dy = arrastre.modo ? dy : Math.max(0, dy);
      if (arrastre.modo === 'media' && dy < 0) {
        // Crece con el dedo, como mucho hasta la pantalla entera.
        panel.style.transform = '';
        panel.style.height = Math.min(window.innerHeight, arrastre.alto - dy) + 'px';
      } else {
        panel.style.height = '';
        panel.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
      }
    });
    function soltarArrastre(ev) {
      if (!arrastre || ev.pointerId !== arrastre.id) return;
      const a = arrastre;
      arrastre = null;
      const panel = $('panel');
      panel.classList.remove('arrastrando');
      if (a.modo === 'media' && a.dy < 0) {
        panel.style.height = '';
        panel.classList.toggle('completa', -a.dy > MIN_SUBIR);
        panel.classList.toggle('media', -a.dy <= MIN_SUBIR);
        return;
      }
      if (a.modo === 'completa' && a.dy > MIN_ARRASTRE) {
        // Primero vuelve a media pantalla; si se ha bajado más allá de esa altura, se cierra.
        const media = window.innerHeight * FRACCION_MEDIA;
        if (a.dy > a.alto - media + MIN_ARRASTRE) { cerrarPanelComoFondo(); return; }
        panel.style.transform = '';
        panel.classList.remove('completa');
        panel.classList.add('media');
        return;
      }
      if (a.dy > MIN_ARRASTRE) cerrarPanelComoFondo();
      else panel.style.transform = '';
    }
    $('panel').addEventListener('pointerup', soltarArrastre);
    $('panel').addEventListener('pointercancel', soltarArrastre);
    $('btnVolver').addEventListener('click', function () {
      if (app.alVolver) app.alVolver();
    });

    // Si se intenta cerrar la app con una lista guardándose o sin guardar, el navegador pide confirmación.
    window.addEventListener('beforeunload', function (ev) {
      if (Object.keys(app.porGuardar).length) { ev.preventDefault(); ev.returnValue = ''; }
    });

    // Al volver a la app tras un rato sin usarla, se refrescan los datos en segundo plano;
    // y, al volver a la app o recuperar la conexión, se reenvían las listas que fallaron por la conexión.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden || !app.init) return;
      reintentarGuardados(false);
      if (Date.now() - memoriaDesde > REFRESCO_MS) refrescarTodo();
    });
    window.addEventListener('online', function () { if (app.init) reintentarGuardados(false); });

    // Barra superior de Material 3: al desplazar la pantalla toma el color del contenedor (sin línea ni sombra).
    window.addEventListener('scroll', actualizarBarra, { passive: true });

    // Onda de Material al pulsar: un círculo que crece desde el dedo y se desvanece. Si el sistema pide
    // reducir el movimiento, no se dibuja (queda el oscurecimiento suave de siempre).
    const CON_ONDA = '.boton, .tarjeta:not(.con-accion), .tarjeta-abrir, .fila-usuario, .pestana, .opcion-estado, .resultado.tocable, .fila-persona.tocable, .fab, .barra-volver, .atajo-fecha, .opcion-radio';
    const sinMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    document.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0 || (sinMovimiento && sinMovimiento.matches)) return;
      // El teléfono y «⋮» tienen su propio toque: no se dibuja la onda de la fila debajo.
      if (ev.target.closest('.mas-opciones, a.llamar')) return;
      const el = ev.target.closest(CON_ONDA);
      if (!el || el.disabled) return;
      const caja = el.getBoundingClientRect();
      const lado = 2 * Math.hypot(Math.max(ev.clientX - caja.left, caja.right - ev.clientX), Math.max(ev.clientY - caja.top, caja.bottom - ev.clientY));
      const onda = document.createElement('span');
      onda.className = 'onda';
      onda.style.width = onda.style.height = lado + 'px';
      onda.style.left = (ev.clientX - caja.left - lado / 2) + 'px';
      onda.style.top = (ev.clientY - caja.top - lado / 2) + 'px';
      el.appendChild(onda);
      onda.addEventListener('animationend', function () { onda.remove(); });
    }, { passive: true });

    // ---------- Arranque ----------

    // Si api_init falla (sin conexión, por ejemplo), la pantalla lo dice y ofrece «Reintentar».
    function arrancar() {
      llamar('api_init').then(function (d) {
        app.init = d;
        app.fecha = d.hoy;
        memoriaDesde = Date.now();
        recuperarPorGuardar();
        irInicio();
        precargar();
      }).catch(function (e) {
        barra('Asistencia', '', null);
        errorEnVista(e, function () { pintar(esqueleto('inicio'), true); arrancar(); });
      });
    }
    arrancar();
  })();
</script>

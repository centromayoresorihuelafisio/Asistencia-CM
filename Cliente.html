<script>
  (function () {
    'use strict';

    // ---------- Estado de la app ----------
    const app = {
      init: null,        // datos de api_init
      fecha: null,       // fecha elegida en Inicio (yyyy-MM-dd)
      vista: 'inicio',
      alVolver: null,    // qué hace el botón «Volver» de la barra
      pase: null,        // pase de lista abierto
      grupo: null,       // gestión de un grupo abierta
      pestana: 'lista',
      busqueda: 0,       // nº de la última búsqueda (para ignorar respuestas viejas)
      hist: { grupo_id: '', mes: '' },
      inf: { desde: '', hasta: '', taller_id: '', datos: null },
      gest: null,        // datos de api_gestion
      usuarios: { texto: '' },
      guardando: {},     // pases de lista guardándose en segundo plano: 'grupo|fecha' → 'guardando' o 'error'
      porGuardar: {},    // listas enviadas aún sin confirmar: 'grupo|fecha' → { payload, nombre, intentos, rechazo… } (enviarGuardado)
      hechos: {},        // pases guardados o cancelados en esta visita: 'grupo|fecha' → true
      ultimoInicio: null, // últimos datos de api_inicio recibidos (para el siguiente pase mientras se vuelven a pedir)
      pila: [],          // pantallas abiertas, de la principal a la actual (cambiarPantalla)
      scrolls: {},       // scroll de cada pantalla de la pila, para recuperarlo al volver
      pantallaNueva: null, // scroll y transición pendientes para el próximo pintar()
      nav: 0,            // sube con cada cambio de pantalla: una respuesta que llega tarde a otra pantalla se ignora
      reintentar: null,  // qué hace «Reintentar» en un error de carga (htmlError)
      tituloGrande: null, // { titulo, sub } de la pantalla principal abierta (barra grande, htmlTituloGrande)
      animDeslizar: null, // 'siguiente' o 'anterior': transición del próximo pintar() tras cambiar de día o de mes
      enTransicionVista: false, // hay una View Transition en curso (no se hace además la transición de siempre)
      alPintarTransicion: null  // termina la View Transition cuando se pinta la pantalla nueva (abrirPaseConTransicion)
    };

    const $ = function (id) { return document.getElementById(id); };

    // ---------- Utilidades ----------

    function esc(texto) {
      return String(texto == null ? '' : texto)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto',
      'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const LETRAS_DIAS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
    const ORDEN_DIAS = [['L', 'Lun'], ['M', 'Mar'], ['X', 'Mié'], ['J', 'Jue'], ['V', 'Vie'], ['S', 'Sáb'], ['D', 'Dom']];
    const TIPOS_ESTADO = [['presente', 'Cuenta como asistencia'], ['ausente', 'Cuenta como falta'], ['neutro', 'No cuenta (evento, excursión…)']];

    function aFecha(texto) {
      const p = String(texto).split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }
    function mayuscula(texto) { return texto ? texto.charAt(0).toUpperCase() + texto.slice(1) : ''; }
    /** «Miércoles, 28 de octubre». */
    function fechaLarga(texto) {
      const d = aFecha(texto);
      return mayuscula(DIAS[d.getDay()]) + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    }
    /** Subtítulo de un pase de lista: «Hoy · miércoles 4 nov.» si es hoy y, si no, la fecha larga. */
    function fechaTitulo(texto) {
      if (app.init && texto === app.init.hoy) {
        const d = aFecha(texto);
        return 'Hoy · ' + DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()].substring(0, 3) + '.';
      }
      return fechaLarga(texto);
    }
    /** Días de clase legibles: «X,V» → «Mié y vie» (en el orden de la semana). */
    function diasLegibles(dias) {
      const letras = String(dias || '').toUpperCase().split(/\s*,\s*/);
      const nombres = ORDEN_DIAS.filter(function (d) { return letras.indexOf(d[0]) >= 0; })
        .map(function (d, i) { return i ? d[1].toLowerCase() : d[1]; });
      if (nombres.length < 2) return nombres.join('');
      return nombres.slice(0, -1).join(', ') + ' y ' + nombres[nombres.length - 1];
    }
    /** Días y hora de un grupo: «Mié y vie · 18:30». */
    function horario(g) {
      return [diasLegibles(g.dias), g.hora || ''].filter(Boolean).join(' · ');
    }
    /** El taller, salvo que el nombre del grupo ya empiece por él («Costura» en «Costura», «Pilates» en «Pilates mañana»). */
    function tallerSiHaceFalta(taller, nombre) {
      const t = paraBuscar(taller);
      const n = paraBuscar(nombre);
      return t && (n === t || n.indexOf(t + ' ') === 0) ? '' : String(taller || '');
    }
    /** «Yoga · Yoga silla» → «Yoga silla»; «Gimnasia · Mañanas» se deja igual. */
    function tallerYGrupo(taller, nombre) {
      const t = tallerSiHaceFalta(taller, nombre);
      return (t ? t + ' · ' : '') + nombre;
    }
    function fechaCorta(texto) {
      const d = aFecha(texto);
      return DIAS[d.getDay()].substring(0, 3) + ' ' + d.getDate() + ' ' + MESES[d.getMonth()].substring(0, 3);
    }
    /** Aviso corto: «Lista guardada · Pilates», con la fecha solo si no es hoy («… · lun 2 nov»). */
    function textoConFecha(texto, fecha) {
      return fecha && app.init && fecha !== app.init.hoy ? texto + ' · ' + fechaCorta(fecha).toLowerCase() : texto;
    }
    function fechaNumerica(texto) {
      if (!texto) return '';
      const p = String(texto).substring(0, 10).split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }
    function fechaHora(texto) {
      if (!texto) return '';
      return fechaNumerica(texto) + ' ' + String(texto).substring(11, 16);
    }
    function nombreMes(mes) {
      const p = mes.split('-').map(Number);
      return MESES[p[1] - 1] + ' ' + p[0];
    }
    function nombreMesCorto(mes) {
      const p = mes.split('-').map(Number);
      return MESES[p[1] - 1].substring(0, 3) + ' ' + p[0];
    }
    function sumarMes(mes, n) {
      const p = mes.split('-').map(Number);
      const d = new Date(p[0], p[1] - 1 + n, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function sumarDias(texto, n) {
      const d = aFecha(texto);
      d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function porcentaje(valor) {
      return valor === null || valor === undefined ? '—' : String(valor).replace('.', ',') + ' %';
    }
    function esAdmin() { return app.init.monitora.rol === 'admin'; }

    /**
     * Nombre de un usuario para mostrar: «GARCIA DE LA FUENTE MARIA» → «Garcia de la Fuente Maria».
     * Solo cambia cómo se ve: en la hoja, en los campos para editar y en las búsquedas sigue en mayúsculas.
     */
    const PARTICULAS = { DE: 1, DEL: 1, LA: 1, LAS: 1, LOS: 1, Y: 1, I: 1, E: 1 };
    function nombreVisible(texto) {
      const t = String(texto || '');
      if (!t || t.charAt(0) === '(') return t;   // «(ID 12 sin ficha)» se deja tal cual
      return t.split(' ').map(function (palabra, i) {
        if (i > 0 && PARTICULAS[palabra.toUpperCase()]) return palabra.toLowerCase();
        return palabra.toLowerCase().replace(/(^|[-'])(\S)/g, function (m, antes, letra) { return antes + letra.toUpperCase(); });
      }).join(' ');
    }
    /**
     * Círculo con las iniciales (como en Contactos): primer apellido y nombre (tercera palabra, o la última si hay
     * menos), sin partículas. El color sale del propio nombre, así cada usuario tiene siempre el mismo.
     */
    function avatar(nombre) {
      const palabras = String(nombre || '').toUpperCase().split(' ').filter(function (p) { return p && !PARTICULAS[p] && /[A-ZÑ]/.test(p); });
      if (!palabras.length || String(nombre).charAt(0) === '(') return '<span class="avatar av-0" aria-hidden="true">?</span>';
      const segunda = palabras.length > 2 ? palabras[2] : palabras[palabras.length - 1];
      const iniciales = palabras[0].replace(/[^A-ZÑÁÉÍÓÚÜ]/g, '').charAt(0) +
        (palabras.length > 1 ? segunda.replace(/[^A-ZÑÁÉÍÓÚÜ]/g, '').charAt(0) : '');
      let suma = 0;
      for (let k = 0; k < nombre.length; k++) suma += nombre.charCodeAt(k);
      return '<span class="avatar av-' + (suma % 6) + '" aria-hidden="true">' + esc(iniciales) + '</span>';
    }

    /** Vibración muy corta al marcar un estado (solo en los móviles que la admiten, como Android). */
    function vibrar() {
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* sin vibración: se ignora */ }
    }

    /** Color de texto legible sobre un color de fondo (#rrggbb). */
    function colorTexto(fondo) {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(fondo || '').trim());
      if (!m) return '#000';
      const n = parseInt(m[1], 16);
      const luz = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      return luz > 0.6 ? '#000' : '#fff';
    }

    function estadoInfo(codigo, lista) {
      const e = (lista || app.init.estados || []).find(function (x) { return x.codigo === codigo; });
      return e || { codigo: codigo, etiqueta: codigo, color: '#9e9e9e', letra: String(codigo).charAt(0) };
    }
    /** Pasa el color del estado al CSS (--estado), que lo suaviza; --estado-texto sirve si el navegador no sabe mezclar colores. */
    function estiloColor(color) {
      return '--estado:' + esc(color) + ';--estado-texto:' + colorTexto(color);
    }
    function estiloEstado(codigo, lista) {
      return estiloColor(estadoInfo(codigo, lista).color);
    }

    /**
     * Icono de cada estado (SVG propios, relleno con currentColor). Se elige por el tipo de la hoja Estados,
     * así un estado nuevo tiene icono sin tocar código: presente = marca, la falta (el primer «ausente») = aspa,
     * otros «ausente» (Justificada…) = calendario tachado y «neutro» (Evento…) = estrella.
     */
    const ICONOS_ESTADO = {
      presente: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4 3.6 3.6 7.6-7.6L19 8z"/>',
      falta: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 13.6L15.6 17 12 13.4 8.4 17 7 15.6 10.6 12 7 8.4 8.4 7l3.6 3.6L15.6 7 17 8.4 13.4 12z"/>',
      justificada: '<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM9.5 18.6l2.5-2.5 2.5 2.5 1.1-1.1-2.5-2.5 2.5-2.5-1.1-1.1-2.5 2.5-2.5-2.5-1.1 1.1 2.5 2.5-2.5 2.5z"/>',
      neutro: '<path d="M12 17.3 18.2 21l-1.7-7 5.5-4.8-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/>',
      otro: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>'
    };
    function iconoEstado(e) {
      let clave = 'otro';
      if (e.tipo === 'presente') clave = 'presente';
      else if (e.tipo === 'neutro') clave = 'neutro';
      else if (e.tipo === 'ausente') {
        const par = estadosAlternar();
        clave = par && par.falta.codigo !== e.codigo ? 'justificada' : 'falta';
      }
      return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">' + ICONOS_ESTADO[clave] + '</svg>';
    }
    /** Chip de un estado: pastilla de color suave con su icono y el texto (por defecto, la etiqueta). */
    function chipEstado(codigo, html, clase) {
      const e = estadoInfo(codigo);
      return '<span class="chip' + (clase ? ' ' + clase : '') + '" style="' + estiloEstado(codigo) + '">' + iconoEstado(e) +
        (html === undefined ? esc(e.etiqueta) : html) + '</span>';
    }

    function opciones(lista, valor, valorDe, textoDe) {
      return lista.map(function (x) {
        const v = valorDe ? valorDe(x) : x;
        return '<option value="' + esc(v) + '"' + (String(v) === String(valor) ? ' selected' : '') + '>' +
          esc(textoDe ? textoDe(x) : x) + '</option>';
      }).join('');
    }

    function valor(id) { const el = $(id); return el ? el.value.trim() : ''; }
    function marcado(id) { const el = $(id); return !!(el && el.checked); }

    // ---------- Piezas de formulario (4-nov-2026, PLAN-PULIDO.md fase 7) ----------

    /**
     * Lista de opciones (radio) en filas de 52 px, en vez de un <select>: se ve todo y se elige con un toque.
     * lista: [{ valor, texto, sub }]. El grupo lleva id = nombre (para errorCampo) y se lee con elegido(nombre).
     */
    function opcionesRadio(nombre, etiqueta, lista, valorActual) {
      return '<div class="campo campo-radio"><span class="etiqueta-campo" id="et-' + nombre + '">' + esc(etiqueta) + '</span>' +
        '<div class="opciones-radio" role="radiogroup" id="' + nombre + '" aria-labelledby="et-' + nombre + '">' +
        lista.map(function (o) {
          return '<label class="opcion-radio"><input type="radio" name="' + nombre + '" value="' + esc(o.valor) + '"' +
            (String(o.valor) === String(valorActual) ? ' checked' : '') + '><span class="opcion-texto">' + esc(o.texto) +
            (o.sub ? '<small>' + esc(o.sub) + '</small>' : '') + '</span></label>';
        }).join('') + '</div></div>';
    }
    /** Valor elegido de un grupo de opciones (del panel abierto o, si no hay, de la pantalla). */
    function elegido(nombre) {
      const zona = panelAbierto() ? $('panel') : $('vista');
      const el = zona.querySelector('input[name="' + nombre + '"]:checked');
      return el ? el.value : '';
    }

    /**
     * Fecha con atajos «Hoy», «Ayer» y «Otra…» (esta abre el calendario). El valor está siempre en el
     * <input type="date"> con ese id, que solo se ve con «Otra…», así valor(id) sigue sirviendo.
     */
    function campoFecha(id, etiqueta, valorInicial) {
      const hoy = app.init.hoy;
      const ayer = sumarDias(hoy, -1);
      const v = valorInicial || hoy;
      const modo = v === hoy ? 'hoy' : v === ayer ? 'ayer' : 'otra';
      const atajo = function (m, texto) {
        return '<button type="button" class="atajo-fecha" data-accion="fecha-atajo" data-campo="' + id + '" data-modo="' + m + '" aria-pressed="' +
          (m === modo) + '">' + texto + '</button>';
      };
      return '<div class="campo campo-fecha"><span class="etiqueta-campo" id="et-' + id + '">' + esc(etiqueta) + '</span>' +
        '<div class="atajos-fecha" role="group" aria-labelledby="et-' + id + '">' + atajo('hoy', 'Hoy') + atajo('ayer', 'Ayer') + atajo('otra', 'Otra…') + '</div>' +
        '<input type="date" id="' + id + '" value="' + esc(v) + '" aria-labelledby="et-' + id + '"' + (modo === 'otra' ? '' : ' class="oculto"') + '></div>';
    }
    function elegirAtajoFecha(boton) {
      const caja = $(boton.getAttribute('data-campo'));
      if (!caja) return;
      const modo = boton.getAttribute('data-modo');
      boton.parentNode.querySelectorAll('.atajo-fecha').forEach(function (b) { b.setAttribute('aria-pressed', String(b === boton)); });
      quitarError(boton);
      if (modo === 'otra') {
        caja.classList.remove('oculto');
        caja.focus();
        try { if (caja.showPicker) caja.showPicker(); } catch (e) { /* sin calendario emergente: queda el campo */ }
        return;
      }
      caja.value = modo === 'ayer' ? sumarDias(app.init.hoy, -1) : app.init.hoy;
      caja.classList.add('oculto');
    }

    /**
     * Error de validación bajo su campo (en rojo, como en Android), en vez de un aviso: el campo se marca, la
     * pantalla (o el panel) se desplaza hasta él y recibe el foco. Se quita en cuanto se cambia el campo.
     * Devuelve undefined, para escribir «return errorCampo(…)».
     */
    function errorCampo(id, texto) {
      const el = $(id);
      if (!el) { aviso(texto, true); return; }
      const campo = el.closest('.campo') || el.parentNode;
      quitarErrores(campo.closest('.panel') || $('vista'));
      campo.classList.add('con-error');
      const p = document.createElement('p');
      p.className = 'error-campo';
      p.id = 'error-' + id;
      p.setAttribute('role', 'alert');
      p.textContent = texto;
      campo.appendChild(p);
      // El foco va al propio campo; en una lista de opciones o una fecha con atajos, a su primer botón.
      const foco = el.matches('input:not(.oculto), select, textarea') ? el
        : campo.querySelector('input[type="radio"], .atajo-fecha') || el;
      foco.setAttribute('aria-invalid', 'true');
      foco.setAttribute('aria-describedby', p.id);
      const sinMov = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      campo.scrollIntoView({ block: 'center', behavior: sinMov ? 'auto' : 'smooth' });
      foco.focus({ preventScroll: true });
    }
    function quitarError(el) {
      const campo = el && el.closest && el.closest('.campo.con-error');
      if (!campo) return;
      campo.classList.remove('con-error');
      campo.querySelectorAll('.error-campo').forEach(function (p) { p.remove(); });
      campo.querySelectorAll('[aria-invalid]').forEach(function (x) { x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); });
    }
    function quitarErrores(zona) {
      zona.querySelectorAll('.campo.con-error').forEach(function (c) { quitarError(c.firstElementChild || c); });
    }

    /**
     * Fila de una persona (4-nov-2026): iniciales de 40 px, nombre, detalle y la acción a la derecha. La misma en
     * la Lista del grupo, la búsqueda de Alta, Gestión › Usuarios y el aviso de posibles duplicados (el pase de
     * lista tiene la suya, sin iniciales, para que quepa el nombre).
     * o: { nombre, detalle (html), derecha (html), atributos (html), boton (es un <button>), tocable, clase }
     */
    function filaPersona(o) {
      const tag = o.boton ? 'button' : 'div';
      return '<' + tag + (o.boton ? ' type="button"' : '') + ' class="fila-persona' + (o.tocable || o.boton ? ' tocable' : '') +
        (o.clase ? ' ' + o.clase : '') + '"' + (o.atributos || '') + '>' + avatar(o.nombre) +
        '<div class="cuerpo"><div class="nombre-persona">' + esc(nombreVisible(o.nombre)) + '</div>' +
        (o.detalle ? '<div class="detalle">' + o.detalle + '</div>' : '') + '</div>' + (o.derecha || '') + '</' + tag + '>';
    }
    const FLECHA = '<span class="flecha" aria-hidden="true">›</span>';

    /** Botón flotante de Material 3 para crear algo en una lista (deja el hueco para no tapar la última fila). */
    function fab(accion, texto, extra) {
      return '<div class="hueco-fab"></div><button type="button" class="fab" data-accion="' + accion + '"' + (extra || '') + '>' + ICONO_MAS + esc(texto) + '</button>';
    }

    const ICONO_TELEFONO = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';

    const ICONO_MAS = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>';
    const ICONO_INFO = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>';
    const ICONO_PERIODO = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM7 12h5v5H7z"/></svg>';
    const ICONO_ELEGIDO = '<svg class="marca-elegida" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
    // Chevrones de las flechas de día y mes, y descarga (5-nov-2026)
    const ICONO_ANTERIOR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>';
    const ICONO_SIGUIENTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4 4.6-4.6z"/></svg>';
    const ICONO_DESCARGAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5zm14-11h-4V3H9v6H5l7 7z"/></svg>';
    const ICONO_COMPARTIR = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8a3 3 0 1 0-3-3c0 .2 0 .5.1.7L8 9.8A3 3 0 1 0 8 14.2l7.1 4.2c-.1.2-.1.4-.1.6a2.9 2.9 0 1 0 3-2.9z"/></svg>';
    const ICONO_GUARDAR ='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';

    function enlaceLlamar(telefono) {
      if (!telefono) return '';
      return '<a class="llamar" href="tel:' + esc(telefono) + '" aria-label="Llamar al ' + esc(telefono) + '">' + ICONO_TELEFONO + '</a>';
    }

    // ---------- Servidor ----------

    let llamadasEnCurso = 0;
    let temporizadorCarga = null;

    let esperaLarga = false;   // hay llamadas en curso desde hace más de 150 ms

    /** Barra fina de arriba mientras se espera al servidor (sin velo: la pantalla se puede seguir usando). */
    function cargando(sumar) {
      llamadasEnCurso += sumar;
      if (llamadasEnCurso > 0 && !temporizadorCarga) {
        temporizadorCarga = setTimeout(function () { esperaLarga = true; mostrarBarraCarga(); }, 150);
      }
      if (llamadasEnCurso <= 0) {
        llamadasEnCurso = 0;
        clearTimeout(temporizadorCarga);
        temporizadorCarga = null;
        esperaLarga = false;
        mostrarBarraCarga();
      }
    }
    /**
     * Mientras la pantalla enseña su esqueleto, la barra no sale: una sola señal de carga (4-nov-2026).
     * Sale si se espera al servidor sin esqueleto (al guardar, o al volver a pedir una pantalla ya pintada).
     */
    function mostrarBarraCarga() {
      $('barraCarga').classList.toggle('oculto', !esperaLarga || !!$('vista').querySelector('.esqueleto'));
    }

    // --- Botón esperando al servidor (4-nov-2026) ---
    // Una escritura (llamar) ocupa el botón que se acaba de pulsar: queda desactivado, con un círculo y el texto en
    // gerundio (data-en-curso, EN_CURSO o «Guardando…»), así no se puede pulsar dos veces. Si falla, vuelve a estar
    // como antes (soltarBotones); si va bien, desaparece al pintar la pantalla o cerrar el panel. Donde no se vuelve
    // a pintar nada, se suelta a mano.

    let botonPulsado = null;   // botón del toque en curso (lo pone el manejador de clics)
    const ocupados = [];       // { el, html } de los botones ocupados
    const EN_CURSO = {
      'inscribir': 'Inscribiendo…', 'crear-usuario': 'Inscribiendo…', 'g-inscribir-usuario': 'Inscribiendo…',
      'g-crear-usuario': 'Creando…', 'exportar-descargar': 'Preparando el archivo…', 'exportar-correo': 'Enviando…',
      'confirmar-no-hubo': 'Marcando sin clase…', 'confirmar-cancelar': 'Marcando sin clase…',
      'g-guardar-dia': 'Añadiendo…'
    };

    function ocuparBoton() {
      const b = botonPulsado;
      botonPulsado = null;
      if (!b || !b.isConnected || b.disabled) return;
      ocupados.push({ el: b, html: b.innerHTML });
      b.disabled = true;
      b.classList.add('ocupado');
      b.setAttribute('aria-busy', 'true');
      b.innerHTML = '<span class="girador-boton" aria-hidden="true"></span>' +
        esc(b.getAttribute('data-en-curso') || EN_CURSO[b.getAttribute('data-accion')] || 'Guardando…');
    }
    function soltarBotones() {
      ocupados.splice(0).forEach(function (o) {
        if (!o.el.isConnected) return;
        o.el.disabled = false;
        o.el.classList.remove('ocupado');
        o.el.removeAttribute('aria-busy');
        o.el.innerHTML = o.html;
      });
    }

    /** Llama a una función api_* y devuelve una promesa con sus datos. Ocupa el botón pulsado hasta que responde. */
    function llamar(funcion) {
      const args = Array.prototype.slice.call(arguments, 1);
      ocuparBoton();
      return llamarSinCarga(true, funcion, args).catch(function (e) { soltarBotones(); throw e; });
    }
    function llamarSinCarga(conCarga, funcion, args) {
      if (conCarga) cargando(1);
      return new Promise(function (resolver, rechazar) {
        transporte(funcion, args, function (r) {
          if (conCarga) cargando(-1);
          if (r && r.ok) resolver(r.data);
          else rechazar(new Error((r && r.error) || 'Respuesta no válida del servidor.'));
        }, function () {
          if (conCarga) cargando(-1);
          const e = new Error('No se ha podido conectar con el servidor. Comprueba la conexión e inténtalo de nuevo.');
          e.conexion = true;   // fallo de conexión (no un rechazo del servidor): se puede reintentar tal cual
          rechazar(e);
        });
      });
    }

    /**
     * Lleva la llamada al servidor: con google.script.run dentro de Apps Script o, en la app instalable (PWA,
     * 6-nov-2026), con el fetch de pwa/api.js (window.PWA). bien(r) recibe { ok, data | error }; mal(), un fallo de conexión.
     */
    function transporte(funcion, args, bien, mal) {
      if (window.PWA) { window.PWA.llamar(funcion, args).then(bien, mal); return; }
      const runner = google.script.run.withSuccessHandler(bien).withFailureHandler(mal);
      runner[funcion].apply(runner, args);
    }

    // ---------- Memoria de datos ----------
    // Las lecturas se recuerdan por función y argumentos: volver a una pantalla ya vista no espera al servidor.
    // Cada escritura olvida solo lo que deja anticuado (anticuar) y la precarga lo vuelve a pedir en segundo plano.

    const memoria = {};          // clave → { funcion, args, promesa, listo, datos }
    let memoriaDesde = Date.now();
    const REFRESCO_MS = 10 * 60 * 1000;

    function claveMemoria(funcion, args) { return funcion + '|' + JSON.stringify(args); }
    function copia(d) { return d === undefined ? d : JSON.parse(JSON.stringify(d)); }

    /** Como llamar(), pero si ya tiene la respuesta la devuelve al momento y sin barra de carga. Devuelve siempre una copia. */
    function pedir(funcion) {
      return pedirCon(true, funcion, Array.prototype.slice.call(arguments, 1));
    }
    function pedirCon(conCarga, funcion, args) {
      const clave = claveMemoria(funcion, args);
      let e = memoria[clave];
      if (!e) {
        e = memoria[clave] = { funcion: funcion, args: args, listo: false, datos: null };
        e.promesa = llamarSinCarga(false, funcion, args).then(function (d) {
          if (memoria[clave] === e) { e.datos = d; e.listo = true; }
          if (funcion === 'api_inicio') actualizarInsignia();
          return d;
        }, function (err) {
          if (memoria[clave] === e) delete memoria[clave];
          throw err;
        });
      }
      if (e.listo) return Promise.resolve(copia(e.datos));
      if (!conCarga) return e.promesa.then(copia);
      cargando(1);
      return e.promesa.then(function (d) { cargando(-1); return copia(d); },
        function (err) { cargando(-1); throw err; });
    }
    function tieneMemoria(funcion, args) { return !!memoria[claveMemoria(funcion, args)]; }
    /** Ya está la respuesta (no solo pedida): la pantalla se puede pintar sin esqueleto. */
    function estaEnMemoria(funcion, args) {
      const e = memoria[claveMemoria(funcion, args)];
      return !!(e && e.listo);
    }

    /** Olvida las respuestas de una función (todas, o las que cumplan el filtro sobre sus argumentos). */
    function olvidar(funcion, filtro) {
      Object.keys(memoria).forEach(function (k) {
        const e = memoria[k];
        if (e.funcion === funcion && (!filtro || filtro.apply(null, e.args))) delete memoria[k];
      });
    }
    function olvidarTodo() {
      Object.keys(memoria).forEach(function (k) { delete memoria[k]; });
    }

    /** Qué deja anticuado cada tipo de cambio. */
    function anticuar(cambio, grupoId, fecha) {
      const varias = function (lista) { lista.forEach(function (f) { olvidar(f); }); };
      if (cambio === 'sesion') {
        // Pase de lista guardado o cancelado
        olvidar('api_sesion', function (g, f) { return g === grupoId && f === fecha; });
        olvidar('api_historial', function (g, m) { return g === grupoId && m === fecha.substring(0, 7); });
        varias(['api_inicio', 'api_informe', 'api_usuario']);
      } else if (cambio === 'inscripciones') {
        // Altas, bajas y cambios de grupo
        varias(['api_grupo', 'api_sesion', 'api_inicio', 'api_historial', 'api_informe', 'api_usuario', 'api_gestion', 'api_usuariosGestion']);
      } else if (cambio === 'usuario-nuevo') {
        // Usuario nuevo, todavía sin grupo
        varias(['api_usuariosGestion', 'api_gestion', 'api_usuariosAlta']);
      } else if (cambio === 'usuario') {
        // Datos de un usuario (nombre, teléfono, activo)
        varias(['api_usuario', 'api_usuariosGestion', 'api_gestion', 'api_grupo', 'api_sesion', 'api_historial', 'api_usuariosAlta']);
      } else if (cambio === 'dias') {
        varias(['api_inicio', 'api_sesion', 'api_historial', 'api_gestion']);
      } else if (cambio === 'lista') {
        olvidar('api_gestion');
      } else {
        // Grupos, estados o curso: afecta a casi todo
        olvidarTodo();
      }
    }

    // --- Precarga en segundo plano: como mucho dos peticiones a la vez, para no saturar Apps Script ---

    const colaFondo = [];
    let enFondo = 0;
    const MAX_FONDO = 2;

    /** Pide algo en segundo plano si aún no está en memoria. alLlegar recibe los datos. */
    function enCola(funcion, args, primero, alLlegar) {
      const tarea = { funcion: funcion, args: args, alLlegar: alLlegar };
      if (primero) colaFondo.unshift(tarea); else colaFondo.push(tarea);
      siguienteFondo();
    }
    function siguienteFondo() {
      while (enFondo < MAX_FONDO && colaFondo.length) {
        const t = colaFondo.shift();
        if (tieneMemoria(t.funcion, t.args)) continue;
        enFondo++;
        const fin = function () { enFondo--; siguienteFondo(); };
        pedirCon(false, t.funcion, t.args).then(function (d) {
          fin();
          if (t.alLlegar) t.alLlegar(d);
        }, fin);
      }
    }

    function periodoInforme() {
      return {
        desde: app.init.inicioCurso || app.init.hoy.substring(0, 4) + '-01-01',
        hasta: app.init.hoy
      };
    }

    /** Pases de lista que se abrirán desde Inicio: pendientes y grupos del día. */
    function precargarSesiones(d) {
      d.grupos.slice().reverse().forEach(function (g) { enCola('api_sesion', [g.grupo_id, d.fecha], true); });
      d.pendientes.slice().reverse().forEach(function (p) { enCola('api_sesion', [p.grupo_id, p.fecha], true); });
    }

    /** Pide en segundo plano lo que necesitan las secciones y aún no está en memoria. Primero Inicio y sus pases de lista. */
    function precargar() {
      pedirCon(false, 'api_inicio', [app.fecha]).then(function (d) {
        app.ultimoInicio = d;
        precargarSesiones(d);
        precargarResto();
      }, precargarResto);
    }
    function precargarResto() {
      const grupos = app.init.grupos;
      const mes = app.init.hoy.substring(0, 7);
      if (app.hist.grupo_id && app.hist.mes) enCola('api_historial', [app.hist.grupo_id, app.hist.mes]);
      grupos.forEach(function (g) { enCola('api_historial', [g.grupo_id, mes]); });
      const p = periodoInforme();
      enCola('api_informe', [p.desde, p.hasta, '']);
      if (app.inf.desde && (app.inf.desde !== p.desde || app.inf.hasta !== p.hasta || app.inf.taller_id)) {
        enCola('api_informe', [app.inf.desde, app.inf.hasta, app.inf.taller_id]);
      }
      if (esAdmin()) {
        enCola('api_gestion', [], false, function (d) { app.gest = d; });
        enCola('api_usuariosGestion', ['']);
      }
      grupos.forEach(function (g) { enCola('api_grupo', [g.grupo_id]); });
      enCola('api_usuariosAlta', []);
    }

    /** Tras un rato sin usar la app, lo vuelve a pedir todo (por si se ha tocado la hoja a mano). */
    function refrescarTodo() {
      memoriaDesde = Date.now();
      llamarSinCarga(false, 'api_init', []).then(function (d) {
        if (app.fecha === app.init.hoy) app.fecha = d.hoy;
        app.init = d;
        olvidarTodo();
        precargar();
      }).catch(function () { /* sin conexión: se seguirá con lo que hay */ });
    }

    // ---------- Aviso de abajo (snackbar, 4-nov-2026) ----------
    // Una línea abajo, 16 px por encima de lo que esté fijo abajo (barra inferior, pie del pase, botón flotante o
    // panel abierto), y un botón de texto opcional: «Deshacer» durante MS_DESHACER. Se cierra solo, al tocarlo o
    // deslizándolo hacia un lado. Si con un panel alto no queda sitio, sale arriba.

    const MS_AVISO = 4000;
    const MS_AVISO_ERROR = 7000;
    const MS_DESHACER = 6000;
    const MIN_DESLIZAR = 60;
    const MIN_HUECO_AVISO = 200;   // si lo fijo de abajo empieza más arriba (panel alto), el aviso va arriba
    let temporizadorAviso = null;
    let accionAviso = null;   // { texto, fn } del botón del aviso abierto

    /** accion (opcional): { texto, fn }, por ejemplo { texto: 'Deshacer', fn: ... }. */
    function aviso(texto, esError, accion) {
      const a = $('aviso');
      accionAviso = accion || null;
      a.innerHTML = '<span class="aviso-texto">' + esc(texto) + '</span>' +
        (accion ? '<button type="button" class="aviso-accion" data-accion="aviso-accion">' + esc(accion.texto) + '</button>' : '');
      a.classList.toggle('error', !!esError);
      // Los errores se leen en cuanto salen (lector de pantalla); los demás avisos, sin interrumpir.
      a.setAttribute('role', esError ? 'alert' : 'status');
      a.style.transform = '';
      a.style.opacity = '';
      // Si ya se veía otro, el nuevo vuelve a entrar (como en Android).
      a.classList.add('oculto');
      void a.offsetWidth;
      a.classList.remove('oculto');
      colocarAviso();
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(cerrarAviso, accion ? MS_DESHACER : esError ? MS_AVISO_ERROR : MS_AVISO);
    }
    function cerrarAviso() {
      clearTimeout(temporizadorAviso);
      accionAviso = null;
      $('aviso').classList.add('oculto');
    }
    function avisoError(e) { soltarBotones(); aviso(e.message, true); }
    /** Aviso con «Deshacer»: fn se ejecuta si se pulsa antes de que se cierre. */
    function avisoDeshacer(texto, fn) { aviso(texto, false, { texto: 'Deshacer', fn: fn }); }

    /** Pone el aviso 16 px por encima de lo más alto que haya fijo abajo. */
    function colocarAviso() {
      const a = $('aviso');
      if (a.classList.contains('oculto')) return;
      let tope = window.innerHeight;
      // Pie, barra inferior y panel están pegados abajo: su borde de arriba sale de su alto, sin contar la
      // animación con la que entran (el panel sube 24 px al abrirse).
      const pegado = function (el) { tope = Math.min(tope, window.innerHeight - el.offsetHeight); };
      if (!$('pie').classList.contains('oculto')) pegado($('pie'));
      if (!$('navegacion').classList.contains('oculto')) pegado($('navegacion'));
      if (panelAbierto()) pegado($('panel'));
      const fab = document.querySelector('.vista .fab');
      if (fab) tope = Math.min(tope, fab.getBoundingClientRect().top);
      const arriba = tope < MIN_HUECO_AVISO;
      a.classList.toggle('arriba', arriba);
      if (arriba) a.style.removeProperty('--aviso-abajo');
      else a.style.setProperty('--aviso-abajo', (window.innerHeight - tope + 16) + 'px');
    }

    // ---------- Carga de pantallas: esqueletos y errores (4-nov-2026) ----------
    // Una pantalla cuyos datos no están en memoria se abre al momento con su esqueleto (la forma gris de lo que
    // va a salir) y se pinta al llegar los datos. Si están en memoria, se pinta directamente, sin esqueleto.
    // Si la carga falla, la propia pantalla dice qué pasa y ofrece «Reintentar» (htmlError).

    /** Esqueleto de una pantalla: 'inicio', 'pase', 'historial', 'informe', 'gestion', 'grupo' o bloques. */
    function esqueleto(tipo) {
      const varias = function (n, clase) {
        let h = '';
        for (let k = 0; k < n; k++) h += '<div class="esq ' + clase + '"></div>';
        return h;
      };
      let h;
      if (tipo === 'inicio') {
        h = '<div class="esq esq-titulo"></div><div class="lista">' + varias(3, 'esq-tarjeta') + '</div>';
      } else if (tipo === 'pase') {
        h = '<div class="esq esq-campo"></div><div class="esq esq-texto"></div><div class="lista">' + varias(8, 'esq-fila') + '</div>';
      } else if (tipo === 'historial') {
        let lineas = '';
        for (let k = 0; k < 8; k++) lineas += '<div class="esq-linea"><div class="esq esq-nombre"></div>' + varias(6, 'esq-celda') + '</div>';
        h = '<div class="esq esq-texto"></div><div class="esq-cuadricula">' + lineas + '</div>';
      } else if (tipo === 'informe') {
        h = '<div class="esq esq-titulo"></div><div class="kpis">' + varias(6, 'esq-kpi') + '</div><div class="hueco-esq"></div>' + varias(2, 'esq-bloque');
      } else if (tipo === 'gestion') {
        h = '<div class="lista">' + varias(6, 'esq-tarjeta') + '</div>';
      } else if (tipo === 'grupo') {
        h = '<div class="esq esq-campo"></div><div class="esq esq-texto"></div><div class="lista">' + varias(6, 'esq-fila') + '</div>';
      } else {
        h = varias(3, 'esq-bloque');
      }
      return '<div class="esqueleto" aria-hidden="true">' + h + '</div>';
    }

    const ICONO_SIN_CONEXION = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46A5.5 5.5 0 0 1 17.5 11.5v.5H19a3 3 0 0 1 3 3c0 1.13-.64 2.11-1.56 2.62l1.45 1.45A4.98 4.98 0 0 0 24 15c0-2.64-2.05-4.78-4.65-4.96zM3 5.27l2.75 2.74C2.56 8.15 0 10.77 0 14a6 6 0 0 0 6 6h11.73l2 2L21 20.73 4.27 4 3 5.27zM7.73 10l8 8H6a4 4 0 0 1 0-8h1.73z"/></svg>';
    const ICONO_FALLO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>';

    /** Error de carga: sin conexión o fallo del servidor, con una línea de qué hacer y «Reintentar» (app.reintentar). */
    function htmlError(e) {
      const sinConexion = !!(e && e.conexion);
      return '<div class="estado-error" role="alert">' + (sinConexion ? ICONO_SIN_CONEXION : ICONO_FALLO) +
        '<h2>' + (sinConexion ? 'Sin conexión' : 'Algo ha fallado') + '</h2>' +
        '<p>' + esc(sinConexion ? 'Comprueba que tienes internet y vuelve a intentarlo.'
          : ((e && e.message) || 'No se han podido cargar los datos.')) + '</p>' +
        '<button type="button" class="boton primario" data-accion="reintentar-carga">Reintentar</button></div>';
    }
    function errorEnVista(e, reintentar) {
      app.reintentar = reintentar;
      pintar(htmlError(e));
    }

    /**
     * Carga los datos de una pantalla. Si ya están en memoria, llama a alPintar(d, false) al momento. Si no,
     * llama a alPreparar (abre la pantalla y pinta su esqueleto) y, cuando llegan, a alPintar(d, true); si falla,
     * pinta el error con «Reintentar» (reintentar). Si mientras tanto se ha ido a otra pantalla, se ignora.
     * refresco: vuelve a cargar la pantalla abierta tras guardar algo; sin esqueleto, y un fallo sale en un aviso.
     */
    function cargarPantalla(funcion, args, alPreparar, alPintar, reintentar, refresco) {
      const lista = estaEnMemoria(funcion, args);
      if (!lista && !refresco) alPreparar();
      const n = app.nav;
      return pedirCon(true, funcion, args).then(function (d) {
        if (n !== app.nav) return;
        alPintar(d, !lista && !refresco);
      }, function (e) {
        if (n !== app.nav) return;
        if (lista || refresco) avisoError(e);
        else errorEnVista(e, reintentar);
      });
    }

    /** Envuelve lo que se hace tras una escritura: solo se hace si se sigue en la misma pantalla. */
    function siSigue(fn) {
      const n = app.nav;
      return function () { if (n === app.nav) return fn.apply(null, arguments); };
    }
    /** Lo mismo, para decidirlo más tarde: const sigue = siSiguePara(); … sigue(fn)(). */
    function siSiguePara() {
      const n = app.nav;
      return function (fn) { return function () { if (n === app.nav) return fn.apply(null, arguments); }; };
    }

    /** Nombre y taller de un grupo que ya conoce el cliente (para el título de su pantalla antes de cargarla). */
    function grupoConocido(grupoId) {
      const buscarEn = function (lista) { return (lista || []).find(function (g) { return g.grupo_id === grupoId; }); };
      return buscarEn(app.init && app.init.grupos) || buscarEn(app.gest && app.gest.grupos) || null;
    }

    // ---------- Panel inferior ----------
    // Sube desde abajo al abrirse y baja al cerrarse (MS_PANEL). Si se abre otro mientras está abierto o bajando
    // (por ejemplo, una confirmación dentro de un panel), solo cambia el contenido: no parpadea.
    // El foco va al título al abrir y vuelve al botón que lo abrió al cerrar. Lo cierran Escape, el botón atrás
    // del móvil (sección «Atrás del móvil») y arrastrar el asa hacia abajo más de MIN_ARRASTRE px.

    const MS_PANEL = 200;
    const MIN_ARRASTRE = 80;
    const FRACCION_MEDIA = 0.5;   // alto de un panel de dos alturas al abrirse (.panel.media en Estilos.html)
    const MIN_SUBIR = 40;         // arrastre hacia arriba que lo pasa a pantalla completa
    let panelCierre = null;   // temporizador que oculta el panel al terminar de bajar
    let panelOrigen = null;   // { el, id, accion }: lo que tenía el foco al abrir

    function panelAbierto() {
      const p = $('panel');
      return !p.classList.contains('oculto') && !p.classList.contains('cerrando');
    }

    /**
     * dosAlturas (5-nov-2026): panel largo (estados del pase, grupo del Historial, periodo y taller del Informe). Si
     * no cabe en media pantalla, se abre a media pantalla y se sube arrastrando el asa hasta ocuparla entera.
     */
    function abrirPanel(html, dosAlturas) {
      const panel = $('panel');
      const fondo = $('fondoPanel');
      if (panelCierre) { clearTimeout(panelCierre); panelCierre = null; }
      if (panel.classList.contains('oculto')) {
        const el = document.activeElement;
        if (el && el !== document.body && !panel.contains(el)) {
          // Si al cerrar el botón ya no está (la fila se vuelve a pintar), se busca por el id de su fila.
          const conId = el.closest('[id]');
          panelOrigen = { el: el, id: conId && conId.id !== 'vista' && conId.id !== 'listaUsuarios' ? conId.id : '', accion: el.getAttribute('data-accion') };
        } else {
          panelOrigen = null;
        }
      }
      panel.innerHTML = '<div class="panel-asa" aria-hidden="true"></div>' + html;
      panel.classList.remove('oculto', 'cerrando', 'arrastrando', 'media', 'completa');
      panel.style.height = '';
      // Se mide ya abierto: solo va a media pantalla si su contenido no cabe en ella.
      if (dosAlturas && panel.scrollHeight > window.innerHeight * FRACCION_MEDIA) panel.classList.add('media');
      fondo.classList.remove('oculto', 'cerrando');
      panel.removeAttribute('inert');
      panel.style.transform = '';
      panel.scrollTop = 0;
      const titulo = panel.querySelector('h3');
      if (titulo) {
        titulo.id = 'tituloPanel';
        titulo.setAttribute('tabindex', '-1');
        panel.setAttribute('aria-labelledby', 'tituloPanel');
        titulo.focus({ preventScroll: true });
      } else {
        panel.removeAttribute('aria-labelledby');
      }
      sincronizarHistorial();
      colocarAviso();
    }

    function cerrarPanel() {
      const panel = $('panel');
      const fondo = $('fondoPanel');
      if (panel.classList.contains('oculto') || panel.classList.contains('cerrando')) return;
      // Mientras baja se sigue viendo, pero sin ids (para que nadie lea sus campos) y sin poder tocarlo.
      panel.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
      panel.setAttribute('inert', '');
      panel.classList.remove('arrastrando');
      panel.style.transform = '';
      panel.style.height = '';
      panel.classList.add('cerrando');
      fondo.classList.add('cerrando');
      colocarAviso();
      panelCierre = setTimeout(function () {
        panelCierre = null;
        panel.classList.add('oculto');
        fondo.classList.add('oculto');
        panel.classList.remove('cerrando');
        fondo.classList.remove('cerrando');
        panel.removeAttribute('inert');
        panel.innerHTML = '';
      }, MS_PANEL);
      const origen = panelOrigen;
      panelOrigen = null;
      if (origen) {
        // Después de que quien cerró el panel vuelva a pintar lo que haga falta (cerrarPanelUsuario repinta la fila).
        setTimeout(function () {
          if (panelAbierto()) return;
          let el = origen.el.isConnected ? origen.el : null;
          if (!el && origen.id && $(origen.id)) {
            const fila = $(origen.id);
            el = (origen.accion && fila.querySelector('[data-accion="' + origen.accion + '"]')) || fila;
          }
          if (el && ($('vista').contains(el) || $('pie').contains(el))) el.focus({ preventScroll: true });
        }, 0);
      }
    }

    /** Cerrar como al tocar fuera: el panel de un usuario del pase guarda antes sus observaciones. */
    function cerrarPanelComoFondo() {
      if (app.vista === 'pase' && app.pase && $('obsUsuario')) cerrarPanelUsuario(null);
      else cerrarPanel();
    }

    /** Panel de confirmación: al aceptar se ejecuta alAceptar. */
    let confirmacionPendiente = null;
    /** enCurso: texto del botón «Sí» mientras espera al servidor («Dando de baja…»). */
    function confirmar(titulo, texto, botonSi, peligro, alAceptar, enCurso) {
      confirmacionPendiente = alAceptar;
      abrirPanel('<div><h3>' + esc(titulo) + '</h3>' + (texto ? '<p>' + texto + '</p>' : '') +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">No</button>' +
        '<button type="button" class="boton ' + (peligro ? 'peligro-lleno' : 'primario') + '" data-accion="confirmar-si"' +
        (enCurso ? ' data-en-curso="' + esc(enCurso) + '"' : '') + '>' + esc(botonSi) + '</button></div></div>');
    }

    /**
     * Panel de posibles duplicados: al crear un usuario, el servidor devuelve { parecidos } en vez de crearlo.
     * alUsar(usuario_id): se elige uno de los que ya existen. alCrear(): es otra persona, se crea igualmente.
     */
    let parecidosPendiente = null;
    function avisarParecidos(nombre, parecidos, textoUsar, alUsar, alCrear) {
      soltarBotones();
      parecidosPendiente = { usar: alUsar, crear: alCrear };
      abrirPanel('<div><h3>¿Es la misma persona?</h3>' +
        '<p>Ya hay ' + (parecidos.length === 1 ? 'un usuario' : 'usuarios') + ' con un nombre parecido a <strong>' + esc(nombreVisible(nombre)) + '</strong>:</p>' +
        '<div class="lista">' + parecidos.map(function (u) {
          return filaPersona({ nombre: u.nombre, detalle: 'ID ' + esc(u.usuario_id) + (u.activo ? '' : ' · inactivo'),
            derecha: '<button type="button" class="boton primario compacto" data-accion="parecido-usar" data-usuario="' + esc(u.usuario_id) + '">' + esc(textoUsar) + '</button>' });
        }).join('') + '</div>' +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton" data-accion="parecido-crear">Es otra persona: crear</button></div></div>');
    }

    // ---------- Barra, pie y navegación ----------

    /** alVolver: función del botón «Volver», o null para ocultarlo. */
    function barra(titulo, sub, alVolver) {
      $('barraTitulo').textContent = titulo;
      $('barraSub').textContent = sub || '';
      app.alVolver = alVolver || null;
      $('btnVolver').classList.toggle('oculto', !alVolver);
      // El menú «⋮» de la barra solo lo usa el pase de lista (pintarPase lo vuelve a mostrar).
      $('btnMenuBarra').classList.add('oculto');
      // En las pantallas secundarias el título puede ocupar dos líneas (nombres de grupo largos).
      $('barra').classList.toggle('secundaria', !!alVolver);
    }

    /** Saludo de Inicio: el nombre de la monitora, la parte del correo antes de «@» o solo «Hola». */
    function saludo() {
      const m = app.init.monitora || {};
      // Sin nombre en la hoja Monitoras, el servidor manda el correo como nombre: se queda la parte antes de «@».
      const nombre = (String(m.nombre || '').trim() || String(m.email || '')).split('@')[0].trim();
      return nombre ? 'Hola, ' + nombre : 'Hola';
    }
    function pie(html) {
      $('pie').innerHTML = html || '';
      $('pie').classList.toggle('oculto', !html);
      $('vista').classList.toggle('con-pie', !!html);
      colocarAviso();
    }

    // Cada sección: [id, nombre, icono relleno (la activa), icono de contorno (las demás)], como en Android 14 (5-nov-2026).
    const ENGRANAJE = 'M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.2 5l1.6 1.3-1.8 3.1-2-.7a7 7 0 0 1-1.9 1.1l-.3 2.1h-3.6l-.3-2.1a7 7 0 0 1-1.9-1.1l-2 .7-1.8-3.1 1.6-1.3a7 7 0 0 1 0-2.2L2.2 10l1.8-3.1 2 .7A7 7 0 0 1 7.9 6.5l.3-2.1h3.6l.3 2.1a7 7 0 0 1 1.9 1.1l2-.7L17.8 10l-1.6 1.3a7 7 0 0 1 0 2.2z';
    const SECCIONES = [
      ['inicio', 'Inicio', 'M4 11l8-7 8 7v9h-5v-6H9v6H4z', 'M4.5 11.2 12 4.6l7.5 6.6V19.5h-4.5v-6h-6v6H4.5z'],
      ['historial', 'Historial', 'M4 5h16v3H4zM4 10.5h16v3H4zM4 16h16v3H4z', 'M4.5 6.5h15M4.5 12h15M4.5 17.5h15'],
      ['informe', 'Informe', 'M5 20V10h3v10zM10.5 20V4h3v16zM16 20v-7h3v7z', 'M6.5 19.5V10.5M12 19.5V4.5M17.5 19.5v-6'],
      ['gestion', 'Gestión', ENGRANAJE, ENGRANAJE]
    ];
    function iconoSeccion(s, activa) {
      return activa
        ? '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor" fill-rule="evenodd"><path d="' + s[2] + '"/></svg>'
        : '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"' +
          ' stroke-linejoin="round" stroke-linecap="round"><path d="' + s[3] + '"/></svg>';
    }

    /** Muestra la barra inferior con la sección activa, o la oculta (activa = null). */
    function navegacion(activa) {
      const nav = $('navegacion');
      if (!activa) {
        nav.classList.add('oculto');
        $('vista').classList.remove('con-nav');
        colocarAviso();
        return;
      }
      nav.innerHTML = SECCIONES.filter(function (s) { return s[0] !== 'gestion' || esAdmin(); }).map(function (s) {
        return '<button type="button" class="nav-boton' + (s[0] === activa ? ' activa' : '') + '" data-accion="nav" data-destino="' + s[0] + '">' +
          '<span class="nav-icono">' + iconoSeccion(s, s[0] === activa) + '</span>' +
          '<span class="nav-texto">' + s[1] + '</span></button>';
      }).join('');
      nav.classList.remove('oculto');
      $('vista').classList.add('con-nav');
      actualizarInsignia();
      colocarAviso();
    }

    /**
     * Número de la pestaña Inicio (5-nov-2026): un circulito rojo con los pendientes de hoy (api_inicio de hoy, ya en
     * memoria), sin contar los que se están guardando o ya se han guardado en esta visita. Sin número si es 0.
     */
    function pendientesSinHacer() {
      if (!app.init) return 0;
      const e = memoria[claveMemoria('api_inicio', [app.init.hoy])];
      const d = e && e.listo ? e.datos : (app.ultimoInicio && app.ultimoInicio.hoy === app.init.hoy ? app.ultimoInicio : null);
      return d ? pendientesDe(d).length : 0;
    }
    function actualizarInsignia() {
      const boton = $('navegacion').querySelector('[data-destino="inicio"]');
      if (!boton) return;
      const n = pendientesSinHacer();
      const icono = boton.querySelector('.nav-icono');
      const vieja = icono.querySelector('.insignia');
      if (vieja) vieja.remove();
      if (n) icono.insertAdjacentHTML('beforeend', '<span class="insignia" aria-hidden="true">' + (n > 99 ? '99+' : n) + '</span>');
      if (n) boton.setAttribute('aria-label', 'Inicio, ' + (n === 1 ? '1 lista pendiente' : n + ' listas pendientes'));
      else boton.removeAttribute('aria-label');
    }

    /** Prepara una pantalla principal (con barra inferior). */
    function pantallaPrincipal(seccion, titulo, sub) {
      cambiarPantalla(true, seccion, seccion);
      app.vista = seccion;
      app.pase = null;
      cerrarPanel();
      pie('');
      barra(titulo, sub, null);
      // Barra grande (5-nov-2026): el título va a 28 px al principio de la pantalla y pasa a la barra al desplazar.
      app.tituloGrande = { titulo: titulo, sub: sub || '' };
      $('barra').classList.add('grande');
      navegacion(seccion);
      sincronizarHistorial();
    }

    /**
     * Prepara una pantalla secundaria (con «Volver» y sin barra inferior).
     * clave: lo que la distingue en la pila de pantallas (por defecto, su título).
     */
    function pantallaSecundaria(vista, titulo, sub, alVolver, clave) {
      cambiarPantalla(false, vista, vista + '|' + (clave || titulo));
      app.vista = vista;
      app.tituloGrande = null;
      $('barra').classList.remove('grande');
      cerrarPanel();
      pie('');
      barra(titulo, sub, alVolver);
      navegacion(null);
      sincronizarHistorial();
    }

    // ---------- Pila de pantallas: scroll y transiciones (4-nov-2026) ----------
    // app.pila guarda las pantallas abiertas, de la principal a la actual (clave: vista y título). Al abrir una
    // pantalla se mira si ya está en la pila: entonces se está volviendo (con «Volver», con el atrás del móvil o
    // tras guardar) y se recupera su scroll; si no, es nueva y empieza arriba. Una pantalla principal (barra
    // inferior) vacía la pila. Un pase de lista que sigue a otro («Guardar y seguir») ocupa su sitio.
    // pintar() aplica el scroll y la transición la primera vez que se pinta la pantalla.

    const MS_TRANSICION = 250;   // algo más que --dur-pantalla, para quitar la clase al terminar
    let temporizadorTransicion = null;

    function cambiarPantalla(principal, vista, clave) {
      app.nav++;
      const pila = app.pila;
      const actual = pila.length ? pila[pila.length - 1] : null;
      if (actual) app.scrolls[actual] = window.scrollY;
      let anim = null;
      let y = 0;
      const i = pila.indexOf(clave);
      if (clave === actual) {
        y = window.scrollY;                       // la misma pantalla con datos nuevos: no se mueve
      } else if (i >= 0) {
        pila.length = i + 1;                      // se vuelve a una pantalla anterior
        anim = 'atras';
        y = app.scrolls[clave] || 0;
      } else if (principal) {
        app.pila = [clave];                       // desde la barra inferior (o al arrancar)
        anim = actual ? 'fundido' : null;
      } else {
        if (actual && actual.split('|')[0] === vista) pila.pop();
        pila.push(clave);
        anim = 'adelante';
      }
      app.pantallaNueva = { anim: anim, y: y };
    }

    function animarVista(anim) {
      const v = $('vista');
      clearTimeout(temporizadorTransicion);
      v.classList.remove('anim-adelante', 'anim-atras', 'anim-fundido');
      void v.offsetWidth;   // para que la animación vuelva a empezar
      v.classList.add('anim-' + anim);
      temporizadorTransicion = setTimeout(function () { v.classList.remove('anim-' + anim); }, MS_TRANSICION);
    }

    // ---------- Atrás del móvil (4-nov-2026) ----------
    // google.script.history funciona dentro del marco de Apps Script. Se añade una entrada al historial cuando
    // hay algo a lo que volver: una pantalla que no es Inicio y, aparte, un panel abierto. El botón o el gesto
    // atrás quita una entrada y llama a atras(), que hace lo mismo que «Volver» (o cierra el panel, o va a Inicio).
    // Al volver con los botones de la app, la entrada que sobra se aprovecha en la siguiente pulsación de atrás.
    // En la app instalable (PWA, 6-nov-2026), pwa/api.js da lo mismo con el historial normal del navegador (PWA.historia).
    // Sin ninguno de los dos no se hace nada.

    const historia = window.google && google.script && google.script.history ? google.script.history
      : (window.PWA && window.PWA.historia) || null;
    let entradas = 0;   // entradas añadidas por la app por encima de la de partida

    function entradasNecesarias() {
      return (app.vista !== 'inicio' ? 1 : 0) + (panelAbierto() ? 1 : 0);
    }
    function sincronizarHistorial() {
      if (!historia) return;
      try {
        while (entradas < entradasNecesarias()) {
          entradas++;
          historia.push({ n: entradas });
        }
      } catch (e) { /* sin historial: el botón atrás saldrá de la app */ }
    }
    function atras() {
      if (!app.init) return;
      if (panelAbierto()) cerrarPanelComoFondo();
      else if (app.alVolver) app.alVolver();
      else if (app.vista !== 'inicio') irInicio();
      else if (!entradas) aviso('Pulsa atrás otra vez para salir.');
    }
    if (historia) {
      try {
        historia.setChangeHandler(function (e) {
          const n = e && e.state && typeof e.state.n === 'number' ? e.state.n : 0;
          if (n >= entradas) { entradas = n; return; }   // adelante: no se hace nada
          entradas = n;
          atras();
        });
      } catch (e) { /* sin historial */ }
    }

    function irSeccion(destino) {
      if (destino === 'historial') irHistorial();
      else if (destino === 'informe') irInforme();
      else if (destino === 'gestion') irGestion();
      else irInicio();
    }

    /**
     * Pinta la vista. La primera vez tras cambiar de pantalla, con su scroll y su transición (cambiarPantalla).
     * esEsqueleto: es el esqueleto de carga; la transición se hace ya y el scroll recordado se guarda para
     * cuando lleguen los datos.
     */
    function pintar(html, esEsqueleto) {
      const v = $('vista');
      v.innerHTML = htmlTituloGrande() + html;
      v.setAttribute('aria-busy', esEsqueleto ? 'true' : 'false');
      const n = app.pantallaNueva;
      app.pantallaNueva = esEsqueleto && n ? { anim: null, y: n.y } : null;
      window.scrollTo(0, n && !esEsqueleto ? n.y : 0);
      // Deslizar entre días o meses (o sus flechas): la pantalla entra desde el lado hacia el que se va.
      const anim = app.animDeslizar || (n && n.anim);
      app.animDeslizar = null;
      if (anim && !app.enTransicionVista) animarVista(anim);
      actualizarBarra();
      mostrarBarraCarga();   // con esqueleto, sin barra arriba
      colocarAviso();   // la pantalla nueva puede tener botón flotante
      if (app.alPintarTransicion) { const fin = app.alPintarTransicion; app.alPintarTransicion = null; fin(); }
    }

    /** Título grande de las pantallas principales (Inicio, Historial, Informe y Gestión), al principio de la vista. */
    function htmlTituloGrande() {
      const t = app.tituloGrande;
      if (!t) return '';
      return '<div class="titulo-grande"><h1>' + esc(t.titulo) + '</h1>' + (t.sub ? '<p>' + esc(t.sub) + '</p>' : '') + '</div>';
    }

    /**
     * Barra de arriba según el scroll: toma color al desplazar y, en las pantallas con título grande, enseña el
     * título pequeño cuando el grande se ha ido por debajo de ella.
     */
    function actualizarBarra() {
      const b = $('barra');
      const grande = app.tituloGrande ? $('vista').querySelector('.titulo-grande h1') : null;
      const pasado = grande ? grande.getBoundingClientRect().bottom <= b.getBoundingClientRect().bottom : window.scrollY > 4;
      b.classList.toggle('elevada', grande ? pasado : window.scrollY > 4);
      b.classList.toggle('titulo-visible', !grande || pasado);
    }

    // ---------- Inicio ----------

    function irInicio() {
      pantallaPrincipal('inicio', saludo(),app.init.curso ? 'Curso ' + app.init.curso : '');
      cargarPantalla('api_inicio', [app.fecha], function () {
        // El selector de fecha ya funciona mientras llegan los grupos (se puede seguir pulsando ‹).
        pintar(htmlSelectorFecha(app.init.hoy) + htmlPorGuardar() + esqueleto('inicio'), true);
      }, function (d) {
        pintarInicio(d);
        precargarSesiones(d);
        // La flecha ‹ suele ser lo siguiente: el día anterior se pide ya en segundo plano.
        enCola('api_inicio', [sumarDias(app.fecha, -1)]);
      }, irInicio);
    }

    /** Flechas y deslizar de Inicio: un día antes o después, sin pasar de hoy. Devuelve si ha cambiado. */
    function saltarDia(n) {
      const f = sumarDias(app.fecha, n);
      if (f > app.init.hoy) return false;
      app.fecha = f;
      app.animDeslizar = n > 0 ? 'siguiente' : 'anterior';
      irInicio();
      return true;
    }

    /**
     * Fecha de Inicio (5-nov-2026): una pastilla con las flechas a los lados (› no pasa de hoy) y la fecha escrita
     * en medio («Hoy, jue 5 nov»). Encima de la fecha está el campo de fecha real, transparente: tocarlo abre el calendario.
     */
    function htmlSelectorFecha(hoy) {
      return '<div class="selector-fecha">' +
        '<button type="button" class="flecha-redonda" data-accion="dia" data-salto="-1" aria-label="Día anterior">' + ICONO_ANTERIOR + '</button>' +
        '<label class="fecha-pastilla">' + ICONO_PERIODO + '<span class="texto-fecha">' + esc(textoFechaInicio(app.fecha, hoy)) + '</span>' +
        '<input type="date" id="fechaInicio" aria-label="Fecha" value="' + esc(app.fecha) + '" max="' + esc(hoy) + '"></label>' +
        '<button type="button" class="flecha-redonda" data-accion="dia" data-salto="1" aria-label="Día siguiente"' +
        (app.fecha >= hoy ? ' disabled' : '') + '>' + ICONO_SIGUIENTE + '</button></div>';
    }
    /** «Hoy, jue 5 nov», «Ayer, mié 4 nov» o «Lun 2 nov» (con el año si no es el de hoy). */
    function textoFechaInicio(fecha, hoy) {
      const corta = fechaCorta(fecha) + (fecha.substring(0, 4) !== hoy.substring(0, 4) ? ' ' + fecha.substring(0, 4) : '');
      if (fecha === hoy) return 'Hoy, ' + corta;
      if (fecha === sumarDias(hoy, -1)) return 'Ayer, ' + corta;
      return mayuscula(corta);
    }

    /** Etiqueta de un pase de lista que se está guardando en segundo plano o cuyo guardado ha fallado. */
    function etiquetaGuardado(grupoId, fecha) {
      const estado = app.guardando[claveBorrador(grupoId, fecha)];
      if (estado === 'guardando') return '<span class="etiqueta guardando">Guardando…</span>';
      // Sin conexión, en tono neutro («Por enviar»: se enviará sola); en rojo solo si el servidor la rechazó.
      if (estado === 'error') {
        const t = app.porGuardar[claveBorrador(grupoId, fecha)];
        return t && t.rechazo ? '<span class="etiqueta sin-guardar">Sin guardar</span>' : '<span class="etiqueta por-enviar">Por enviar</span>';
      }
      return '';
    }

    function etiquetaSesion(g, fecha) {
      const guardado = etiquetaGuardado(g.grupo_id, fecha);
      if (guardado) return guardado;
      // Mismos nombres en toda la app: «Hecha» (realizada) y «Sin clase» (cancelada, «No hubo clase»).
      if (g.estadoSesion === 'realizada') return '<span class="etiqueta realizada">Hecha</span>';
      if (g.estadoSesion === 'cancelada') return '<span class="etiqueta cancelada">Sin clase</span>';
      if (g.diaEspecial) return '<span class="etiqueta especial">' + esc(g.diaEspecial.tipo || 'Día libre') + '</span>';
      // Sin nadie inscrito no hay lista que pasar (4-nov-2026): no se marca como pendiente.
      if (g.inscritos === 0) return '';
      return '<span class="etiqueta pendiente">Pendiente</span>';
    }

    function pintarInicio(d) {
      app.ultimoInicio = d;
      if (app.vista !== 'inicio') return;
      let html = htmlSelectorFecha(d.hoy);

      html += htmlPorGuardar();

      if (d.pendientes.length) {
        html += '<h2 class="seccion peligro">Pendientes (' + d.pendientes.length + ')</h2>';
        // Agrupados por día («Lun 2 nov») y, dentro, por hora (4-nov-2026). La tarjeta entera abre el pase;
        // «⋮» abre un menú con «No hubo clase» (abrirMenuPendiente).
        let diaActual = null;
        d.pendientes.forEach(function (p) {
          if (p.fecha !== diaActual) {
            html += (diaActual === null ? '' : '</div>') + '<h3 class="subtitulo-lista">' + esc(mayuscula(fechaCorta(p.fecha))) + '</h3><div class="lista">';
            diaActual = p.fecha;
          }
          const guardado = etiquetaGuardado(p.grupo_id, p.fecha);
          const detalle = [p.hora || '', tallerSiHaceFalta(p.taller, p.nombre)].filter(Boolean).join(' · ');
          html += '<div class="tarjeta pendiente con-accion"><button type="button" class="tarjeta-abrir" data-accion="pase" data-grupo="' +
            esc(p.grupo_id) + '" data-fecha="' + esc(p.fecha) + '"><div class="tarjeta-cuerpo"><div class="tarjeta-titulo">' + esc(p.nombre) +
            '</div>' + (detalle ? '<div class="tarjeta-detalle">' + esc(detalle) + '</div>' : '') + '</div>' + guardado + '</button>' +
            (guardado ? '' : '<button type="button" class="mas-opciones" data-accion="menu-pendiente" data-grupo="' + esc(p.grupo_id) +
              '" data-fecha="' + esc(p.fecha) + '" aria-label="Más opciones de ' + esc(p.nombre) + ', ' + esc(fechaLarga(p.fecha)) + '">' +
              ICONO_MAS_OPCIONES + '</button>') + '</div>';
        });
        html += '</div>';
      }

      // Progreso del día y «Todo al día» (5-nov-2026): solo cuentan los grupos con alguien inscrito y sin día libre.
      const prog = progresoDia(d);
      if (prog.total && prog.hechas === prog.total && !pendientesDe(d).length && d.fecha === d.hoy) {
        html += '<div class="estado-vacio todo-al-dia">' + DIBUJO_TODO_AL_DIA +
          '<h2>Todo al día</h2><p>Todas las listas de hoy están pasadas.</p></div>';
      }
      html += '<div class="titulo-hoy"><h2 class="seccion">' + (d.fecha === d.hoy ? 'Hoy' : esc(fechaLarga(d.fecha))) + '</h2>' +
        (prog.total ? htmlProgreso(prog, d.fecha) : '') + '</div>';
      if (!d.grupos.length) {
        html += '<p class="vacio">No hay clases este día.</p>';
      } else {
        // Una sola lista por hora, como la agenda del día (4-nov-2026; el servidor la manda ordenada).
        // El taller va en el detalle solo si no está ya en el nombre del grupo.
        html += '<div class="lista">';
        d.grupos.forEach(function (g) {
          const detalle = [tallerSiHaceFalta(g.taller, g.nombre), g.inscritos ? g.inscritos + (g.inscritos === 1 ? ' usuario' : ' usuarios') : 'Sin usuarios']
            .filter(Boolean).join(' · ');
          html += '<button type="button" class="tarjeta" data-accion="pase" data-grupo="' + esc(g.grupo_id) +
            '" data-fecha="' + esc(d.fecha) + '"><span class="lead">' + (g.hora ? esc(g.hora) : '—') + '</span>' +
            '<div class="tarjeta-cuerpo"><div class="tarjeta-titulo">' + esc(g.nombre) +
            '</div><div class="tarjeta-detalle">' + esc(detalle) + '</div></div>' +
            etiquetaSesion(g, d.fecha) + '</button>';
        });
        html += '</div>';
      }

      html += '<details class="plegable"><summary>Mis grupos (' + app.init.grupos.length + ')</summary>';
      if (!app.init.grupos.length) {
        html += '<p class="vacio">No tienes grupos asignados.' + (esAdmin() ? ' Créalos en Gestión › Grupos.' : '') + '</p>';
      }
      app.init.grupos.forEach(function (g) {
        html += '<div class="grupo-fila"><div class="tarjeta-titulo">' + esc(g.nombre) + '</div>' +
          '<div class="tarjeta-detalle">' + esc([tallerSiHaceFalta(g.taller, g.nombre), horario(g)].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="botones"><button type="button" class="boton" data-accion="pase" data-grupo="' + esc(g.grupo_id) +
          '" data-fecha="' + esc(d.fecha) + '">Pasar lista</button>' +
          '<button type="button" class="boton" data-accion="grupo" data-grupo="' + esc(g.grupo_id) + '">Altas y bajas</button></div></div>';
      });
      html += '</details>';
      pintar(html);
      animarProgreso();
      actualizarInsignia();
    }

    /** Pendientes de Inicio sin los que se están guardando o ya se han guardado en esta visita. */
    function pendientesDe(d) {
      return d.pendientes.filter(function (p) {
        const clave = claveBorrador(p.grupo_id, p.fecha);
        return !app.hechos[clave] && app.guardando[clave] !== 'guardando';
      });
    }

    /**
     * Listas del día hechas de las que hay que pasar: grupos con alguien inscrito y sin día libre (salvo que se
     * pasara lista igualmente). Cuenta como hecha la que está Hecha o Sin clase, o se está guardando ahora.
     */
    function progresoDia(d) {
      let total = 0;
      let hechas = 0;
      d.grupos.forEach(function (g) {
        const clave = claveBorrador(g.grupo_id, d.fecha);
        const hecha = g.estadoSesion === 'realizada' || g.estadoSesion === 'cancelada' ||
          !!app.hechos[clave] || app.guardando[clave] === 'guardando';
        if (!g.inscritos || (g.diaEspecial && !hecha)) return;
        total++;
        if (hecha) hechas++;
      });
      return { total: total, hechas: hechas };
    }

    // Anillo del progreso: se pinta con lo que había la vez anterior y se rellena hasta lo de ahora (animarProgreso).
    const RADIO_ANILLO = 9;
    const VUELTA_ANILLO = 2 * Math.PI * RADIO_ANILLO;
    const progresoVisto = {};   // fecha → fracción que se enseñó la última vez
    let progresoNuevo = null;   // { fecha, fraccion } por animar tras pintar
    function htmlProgreso(prog, fecha) {
      const fraccion = prog.hechas / prog.total;
      const antes = progresoVisto[fecha] === undefined ? fraccion : progresoVisto[fecha];
      progresoNuevo = { fecha: fecha, fraccion: fraccion };
      const texto = prog.hechas + ' de ' + prog.total + (prog.total === 1 ? ' lista hecha' : ' listas hechas');
      return '<div class="progreso-dia' + (fraccion === 1 ? ' completo' : '') + '" role="img" aria-label="' + esc(texto) + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="anillo-fondo" cx="12" cy="12" r="' + RADIO_ANILLO + '"/>' +
        '<circle class="anillo" cx="12" cy="12" r="' + RADIO_ANILLO + '" stroke-dasharray="' + VUELTA_ANILLO.toFixed(2) +
        '" stroke-dashoffset="' + (VUELTA_ANILLO * (1 - antes)).toFixed(2) + '"/></svg>' +
        '<span aria-hidden="true">' + esc(texto) + '</span></div>';
    }
    function animarProgreso() {
      const p = progresoNuevo;
      progresoNuevo = null;
      if (!p) return;
      progresoVisto[p.fecha] = p.fraccion;
      const anillo = $('vista').querySelector('.progreso-dia .anillo');
      if (!anillo) return;
      // Dos fotogramas: el primero pinta el valor anterior y el segundo arranca la transición hasta el nuevo.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { anillo.setAttribute('stroke-dashoffset', (VUELTA_ANILLO * (1 - p.fraccion)).toFixed(2)); });
      });
    }

    // Dibujo de «Todo al día»: una marca grande dentro de un círculo, con dos destellos.
    const DIBUJO_TODO_AL_DIA = '<svg class="dibujo" viewBox="0 0 96 96" aria-hidden="true">' +
      '<circle class="dibujo-halo" cx="48" cy="48" r="44"/><circle class="dibujo-circulo" cx="48" cy="48" r="32"/>' +
      '<path class="dibujo-marca" d="M33 49l10 10 20-22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path class="dibujo-destello" d="M80 14v8M76 18h8M15 70v6M12 73h6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>';

    // ---------- Pase de lista ----------

    function claveBorrador(grupoId, fecha) { return grupoId + '|' + fecha; }

    function leerBorrador(clave) {
      try { return JSON.parse(window.localStorage.getItem(clave) || 'null'); } catch (e) { return null; }
    }
    function leerBorradorTexto(clave) {
      try { return window.localStorage.getItem(clave); } catch (e) { return null; }
    }
    function guardarBorrador() {
      const p = app.pase;
      if (!p) return;
      const usuarios = {};
      p.usuarios.forEach(function (u) { usuarios[u.usuario_id] = { estado: u.estado, observaciones: u.observaciones }; });
      try {
        window.localStorage.setItem(claveBorrador(p.grupo.grupo_id, p.fecha), JSON.stringify({ usuarios: usuarios, nota: p.nota }));
      } catch (e) { /* sin localStorage: se ignora */ }
    }
    function borrarBorrador(grupoId, fecha) {
      try { window.localStorage.removeItem(claveBorrador(grupoId, fecha)); } catch (e) { /* se ignora */ }
    }

    /**
     * volver: función para regresar a la pantalla de origen (Inicio por defecto).
     * sinAvisoBorrador: al reabrirlo tras una baja hecha desde el propio pase no se avisa de las marcas recuperadas.
     */
    function abrirPase(grupoId, fecha, volver, sinAvisoBorrador) {
      const vuelta = volver || irInicio;
      const conocido = grupoConocido(grupoId);
      const titulo = conocido ? conocido.nombre : 'Pase de lista';
      cargarPantalla('api_sesion', [grupoId, fecha], function () {
        pantallaSecundaria('pase', titulo, fechaTitulo(fecha), vuelta);
        pintar(esqueleto('pase'), true);
      }, function (d, conEsqueleto) {
        d.nota = d.sesion ? (d.sesion.nota || '') : '';
        d.borradorRecuperado = false;
        d.volver = vuelta;
        // Observaciones tal como están guardadas, para saber al guardar si se han escrito nuevas (motivosResumen).
        d.usuarios.forEach(function (u) { u.obsGuardada = u.observaciones || ''; });
        const b = leerBorrador(claveBorrador(grupoId, fecha));
        if (b && b.usuarios) {
          d.usuarios.forEach(function (u) {
            const g = b.usuarios[u.usuario_id];
            if (g) { u.estado = g.estado; u.observaciones = g.observaciones || ''; }
          });
          if (typeof b.nota === 'string') d.nota = b.nota;
          d.borradorRecuperado = !sinAvisoBorrador;
        }
        // Con esqueleto, la pantalla ya está abierta: solo se pone el nombre que manda el servidor.
        if (conEsqueleto) barra(d.grupo.nombre, fechaTitulo(fecha), vuelta);
        else pantallaSecundaria('pase', titulo, fechaTitulo(fecha), vuelta);
        d.mostrarAyuda = d.usuarios.length > 0 && ayudaPaseVista();
        app.pase = d;
        pintarPase();
      }, function () { abrirPase(grupoId, fecha, vuelta, sinAvisoBorrador); });
    }

    /**
     * Abrir un pase desde una tarjeta de Inicio con la View Transitions API (5-nov-2026): la tarjeta crece hasta ser
     * la pantalla del pase. Donde no existe, o si el sistema pide reducir el movimiento, queda la transición de siempre.
     * La transición acaba cuando se pinta la pantalla nueva (el esqueleto o el pase, pintar()), o a los
     * MS_ESPERA_TRANSICION como mucho, para no dejar la pantalla congelada si el servidor tarda.
     */
    const MS_ESPERA_TRANSICION = 400;
    function abrirPaseConTransicion(el, grupoId, fecha) {
      const tarjeta = el.closest('.tarjeta') || el;
      if (!document.startViewTransition || (sinMovimiento && sinMovimiento.matches) || app.enTransicionVista) {
        abrirPase(grupoId, fecha, irInicio);
        return;
      }
      tarjeta.style.viewTransitionName = 'pase-abierto';
      app.enTransicionVista = true;
      let vt;
      try {
        vt = document.startViewTransition(function () {
          tarjeta.style.viewTransitionName = '';
          $('vista').style.viewTransitionName = 'pase-abierto';
          return new Promise(function (listo) {
            const t = setTimeout(function () { app.alPintarTransicion = null; listo(); }, MS_ESPERA_TRANSICION);
            app.alPintarTransicion = function () { clearTimeout(t); listo(); };
            abrirPase(grupoId, fecha, irInicio);
          });
        });
      } catch (e) {
        app.enTransicionVista = false;
        tarjeta.style.viewTransitionName = '';
        abrirPase(grupoId, fecha, irInicio);
        return;
      }
      const fin = function () {
        app.enTransicionVista = false;
        $('vista').style.viewTransitionName = '';
      };
      vt.finished.then(fin, fin);
    }

    /**
     * La ayuda del pase («Toca para marcar falta…») sale solo las 2 primeras veces que se abre un pase (4-nov-2026).
     * Cuenta en localStorage; si no está disponible, sale siempre.
     */
    const CLAVE_AYUDA_PASE = 'asistencia|ayudaPase';
    const VECES_AYUDA_PASE = 2;
    function ayudaPaseVista() {
      try {
        const n = Number(window.localStorage.getItem(CLAVE_AYUDA_PASE)) || 0;
        if (n >= VECES_AYUDA_PASE) return false;
        window.localStorage.setItem(CLAVE_AYUDA_PASE, String(n + 1));
      } catch (e) { /* sin localStorage: se enseña */ }
      return true;
    }

    function pintarPase() {
      const p = app.pase;
      let html = '<div class="avisos-sesion">';
      const guardado = app.guardando[claveBorrador(p.grupo.grupo_id, p.fecha)];
      if (guardado === 'guardando') html += '<div class="banda info">Se está guardando esta lista. Espera a que termine antes de cambiarla.</div>';
      else if (guardado === 'error') {
        const t = app.porGuardar[claveBorrador(p.grupo.grupo_id, p.fecha)];
        // En rojo solo si el servidor la rechazó; sin conexión, en tono neutro.
        html += t && t.rechazo
          ? '<div class="banda error">No se pudo guardar esta lista: ' + esc(t.rechazo) + ' Tus marcas se conservan: revísalas y pulsa Guardar otra vez.</div>'
          : '<div class="banda neutra">' + (t && !t.recuperada
            ? 'Lista pendiente de enviar · se enviará sola. Tus marcas se conservan.'
            : 'Esta lista se quedó sin enviar. Tus marcas se conservan: revísalas y pulsa Guardar otra vez.') + '</div>';
      }
      else if (p.borradorRecuperado) html += '<div class="banda info">Se han recuperado cambios sin guardar de la última vez.</div>';
      if (p.diaEspecial) {
        html += '<div class="banda especial">Día libre: ' + esc(p.diaEspecial.tipo || '') +
          (p.diaEspecial.descripcion ? ' – ' + esc(p.diaEspecial.descripcion) : '') +
          '. Si hubo clase, puedes pasar lista.</div>';
      }
      if (p.sesion && p.sesion.estado === 'realizada') {
        html += '<div class="banda realizada">Hecha el ' + esc(fechaHora(p.sesion.timestamp)) + '. Puedes corregirla y volver a guardar.</div>';
      }
      if (p.sesion && p.sesion.estado === 'cancelada') {
        html += '<div class="banda cancelada">No hubo clase' + (p.sesion.nota ? ': ' + esc(p.sesion.nota) : '') +
          '. Si guardas la lista, contará como clase hecha.</div>';
      }
      // La nota de la sesión se escribe desde el menú «⋮» de la barra; si hay, se ve aquí y se edita con un toque.
      html += htmlNotaPase(p.nota) + '</div>';

      if (!p.usuarios.length) {
        // Grupo sin nadie inscrito ese día (4-nov-2026): no hay lista que pasar; se ofrece inscribir.
        html += '<div class="estado-vacio">' + ICONO_SIN_USUARIOS +
          '<h2>Sin usuarios</h2><p>Este grupo no tiene a nadie inscrito ' + esc(diaParaFrase(p.fecha)) + '.</p>' +
          '<button type="button" class="boton primario" data-accion="pase-inscribir">Inscribir usuarios</button></div>';
      } else {
        // Primero los nombres: «Aplicar a todos» y la nota están en el menú «⋮»; la ayuda, solo las primeras veces.
        const par = estadosAlternar();
        if (par && p.mostrarAyuda) {
          html += '<p class="ayuda una-linea">Toca para marcar ' + esc(par.falta.etiqueta.toLowerCase()) + ' · Mantén pulsado para más</p>';
        }

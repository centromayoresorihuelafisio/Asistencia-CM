        html += '<div id="listaUsuarios" class="lista">' + p.usuarios.map(function (u, i) { return filaUsuario(u, i); }).join('') + '</div>';
      }
      pintar(html);
      $('btnMenuBarra').classList.remove('oculto');
      pintarPiePase();
    }

    /** «hoy» o «el 21 oct.», para una frase. */
    function diaParaFrase(fecha) {
      if (fecha === app.init.hoy) return 'hoy';
      const d = aFecha(fecha);
      return 'el ' + d.getDate() + ' ' + MESES[d.getMonth()].substring(0, 3) + '.';
    }

    const ICONO_SIN_USUARIOS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05A4.2 4.2 0 0 1 17 16.5V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>';
    const ICONO_TODOS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>';
    const ICONO_NOTA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
    const ICONO_SIN_CLASE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM8.5 11.5l1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1z"/></svg>';
    const ICONO_ABRIR_PASE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3h-4.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>';

    function htmlNotaPase(nota) {
      return nota ? '<button type="button" class="nota-pase" data-accion="nota-sesion"><span class="etiqueta-nota">Nota</span>' + esc(nota) + '</button>' : '';
    }

    /** Menú «⋮» de la barra del pase: aplicar un estado a todos, nota de la sesión y «No hubo clase». */
    function abrirMenuPase() {
      const p = app.pase;
      if (!p || app.vista !== 'pase') return;
      const hay = p.usuarios.length > 0;
      abrirPanel('<div><h3>' + esc(p.grupo.nombre) + '</h3><div class="menu-opciones">' +
        (hay ? '<button type="button" class="opcion-menu" data-accion="aplicar-todos">' + ICONO_TODOS + '<span>Aplicar un estado a todos…</span></button>' +
          '<button type="button" class="opcion-menu" data-accion="nota-sesion">' + ICONO_NOTA + '<span>' +
          (p.nota ? 'Cambiar la nota de la sesión' : 'Nota de la sesión') + '</span></button>' : '') +
        '<button type="button" class="opcion-menu peligro" data-accion="cancelar-sesion">' + ICONO_SIN_CLASE + '<span>No hubo clase…</span></button>' +
        '</div></div>');
    }

    /** Nota de la sesión, en un panel (antes, un campo al final del pase). Se guarda en el borrador al escribir. */
    function abrirNotaSesion() {
      abrirPanel('<div><h3>Nota de la sesión</h3>' +
        '<div class="campo"><label for="notaSesion">Nota (opcional)</label><textarea id="notaSesion" rows="3">' + esc(app.pase.nota) + '</textarea></div>' +
        '<button type="button" class="boton primario ancho" data-accion="nota-hecho">Hecho</button></div>');
    }
    function cerrarNotaSesion() {
      const caja = $('notaSesion');
      if (caja) { app.pase.nota = caja.value.trim(); guardarBorrador(); }
      cerrarPanel();
      pintarNotaPase();
    }
    /** Vuelve a pintar solo la línea de la nota, sin tocar las marcas ni el scroll. */
    function pintarNotaPase() {
      const zona = $('vista').querySelector('.avisos-sesion');
      if (!zona || !app.pase || app.vista !== 'pase') return;
      const vieja = zona.querySelector('.nota-pase');
      if (vieja) vieja.remove();
      zona.insertAdjacentHTML('beforeend', htmlNotaPase(app.pase.nota));
    }

    const ICONO_MAS_OPCIONES = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>';

    /**
     * Fila de un usuario en el pase de lista (4-nov-2026): un toque en cualquier punto alterna Asistido/Falta;
     * el botón «⋮» del final (o mantener pulsada la fila) abre el panel con los demás estados y las observaciones.
     * Sin círculo de iniciales, para que el nombre tenga sitio. recien: el estado acaba de cambiar (animación corta del icono).
     */
    function filaUsuario(u, i, recien) {
      const e = estadoInfo(u.estado);
      // Si no está en el estado por defecto, la fila toma un tinte de su color y el chip va relleno (Estilos.html).
      const tinte = u.estado !== app.init.estadoPorDefecto ? ' style="--tinte:' + esc(e.color) + '"' : '';
      const nombre = nombreVisible(u.nombre);
      return '<div class="fila-usuario" role="button" tabindex="0" data-accion="alternar" data-indice="' + i + '" id="fila' + i + '"' + tinte +
        ' aria-label="' + esc(nombre) + ': ' + esc(e.etiqueta) + '. Tocar para cambiar">' +
        '<div class="nombre">' + esc(nombre) +
        (u.faltasSeguidas ? '<span class="faltas-seguidas">' + u.faltasSeguidas + ' faltas seguidas</span>' : '') +
        (u.observaciones ? '<span class="obs">' + esc(u.observaciones) + '</span>' : '') + '</div>' +
        // El estado por defecto (Asistido) va solo con su icono, para dejar sitio al nombre; el resto, con chip y texto.
        // El lector de pantalla lee el estado en el aria-label de la fila.
        '<span class="estado-fila">' + (u.estado === app.init.estadoPorDefecto
          ? '<span class="chip solo-icono' + (recien ? ' recien' : '') + '" style="' + estiloEstado(u.estado) + '" title="' + esc(e.etiqueta) + '">' + iconoEstado(e) + '</span>'
          : chipEstado(u.estado, undefined, recien ? 'recien' : '')) + '</span>' +
        // La llamada está en el panel de «⋮» (abrirPanelUsuario), para dejar sitio al nombre.
        '<button type="button" class="mas-opciones" data-accion="usuario" data-indice="' + i + '" aria-label="Más opciones de ' + esc(nombre) + '">' +
        ICONO_MAS_OPCIONES + '</button></div>';
    }

    /**
     * Estados entre los que alterna el chip de cada fila con un toque: el estado por defecto (Asistido)
     * y el primero de tipo «ausente» de la hoja Estados (Falta). null si falta alguno.
     */
    function estadosAlternar() {
      const presente = app.init.estados.find(function (e) { return e.codigo === app.init.estadoPorDefecto; });
      const falta = app.init.estados.find(function (e) { return e.tipo === 'ausente'; });
      return presente && falta ? { presente: presente, falta: falta } : null;
    }

    /** Un toque en la fila: presente → falta; cualquier otro estado → presente. Sin pareja, abre el panel. */
    function alternarEstado(i) {
      const par = estadosAlternar();
      if (!par) { abrirPanelUsuario(i); return; }
      const u = app.pase.usuarios[i];
      u.estado = u.estado === par.presente.codigo ? par.falta.codigo : par.presente.codigo;
      vibrar();
      $('fila' + i).outerHTML = filaUsuario(u, i, true);
      pintarPiePase();
      guardarBorrador();
    }

    /** «Aplicar a todos»: el mismo estado a todo el grupo, con «Deshacer» en el aviso (vuelven los estados de antes). */
    function aplicarATodos(codigo) {
      const p = app.pase;
      const antes = p.usuarios.map(function (u) { return u.estado; });
      const pintarTodos = function () {
        $('listaUsuarios').innerHTML = p.usuarios.map(function (u, i) { return filaUsuario(u, i, true); }).join('');
        pintarPiePase();
        guardarBorrador();
      };
      p.usuarios.forEach(function (u) { u.estado = codigo; });
      cerrarPanel();
      pintarTodos();
      avisoDeshacer('Todos como ' + estadoInfo(codigo).etiqueta, function () {
        if (app.pase !== p || app.vista !== 'pase' || !$('listaUsuarios')) return;
        p.usuarios.forEach(function (u, i) { if (antes[i] !== undefined) u.estado = antes[i]; });
        pintarTodos();
      });
    }

    function contadores() {
      const cuenta = {};
      app.pase.usuarios.forEach(function (u) { cuenta[u.estado] = (cuenta[u.estado] || 0) + 1; });
      return cuenta;
    }

    function pintarPiePase() {
      const cuenta = contadores();
      let html = '<div class="pie-fila"><div class="contadores">';
      app.init.estados.concat(Object.keys(cuenta).filter(function (c) {
        return !app.init.estados.some(function (e) { return e.codigo === c; });
      }).map(function (c) { return estadoInfo(c); })).forEach(function (e) {
        if (!cuenta[e.codigo]) return;
        // Solo el icono y el número, para que quepan junto a Guardar; el nombre lo lee el lector de pantalla.
        html += chipEstado(e.codigo, '<span class="numero">' + cuenta[e.codigo] + '</span><span class="solo-lector"> ' + esc(e.etiqueta) + '</span>');
      });
      // Sin nadie inscrito no hay pie: la pantalla ofrece «Inscribir usuarios» (pintarPase).
      if (!app.pase.usuarios.length) { pie(''); return; }
      // Un solo botón a todo el ancho (4-nov-2026); «No hubo clase» está en el menú «⋮» de la barra.
      // Si queda otro pase por hacer (abierto desde Inicio), Guardar abre ese a continuación (guardarPase).
      const haySiguiente = siguientePase(app.pase);
      html += '</div><button type="button" class="boton lleno" data-accion="guardar">' + ICONO_GUARDAR +
        (haySiguiente ? 'Guardar y seguir' : 'Guardar') + '</button></div>';
      pie(html);
    }

    /**
     * Motivos para enseñar el resumen antes de guardar (4-nov-2026). Normalmente se guarda con un toque; el resumen
     * solo sale si algo se sale de lo normal: sesión cancelada o día sin clase, muchas faltas, todo el grupo en el
     * mismo estado distinto del habitual u observaciones nuevas. Devuelve los textos (vacío = guardar directamente).
     */
    function motivosResumen() {
      const p = app.pase;
      const n = p.usuarios.length;
      const motivos = [];
      if (p.sesion && p.sesion.estado === 'cancelada') motivos.push('Estaba marcada sin clase: al guardar contará como clase hecha.');
      if (p.diaEspecial) motivos.push('Es un día libre (' + (p.diaEspecial.tipo || 'sin clase') + '). Guarda solo si hubo clase.');
      const faltas = p.usuarios.filter(function (u) { return estadoInfo(u.estado).tipo === 'ausente'; }).length;
      const primero = n ? p.usuarios[0].estado : '';
      if (n >= 2 && faltas >= Math.max(2, Math.ceil(n / 2))) {
        motivos.push('Faltan ' + faltas + ' de ' + n + ' usuarios.');
      } else if (n >= 2 && primero !== app.init.estadoPorDefecto && p.usuarios.every(function (u) { return u.estado === primero; })) {
        motivos.push('Todo el grupo está como «' + estadoInfo(primero).etiqueta + '».');
      }
      const conObs = p.usuarios.filter(function (u) { return (u.observaciones || '') !== (u.obsGuardada || ''); }).length;
      if (conObs) motivos.push('Hay observaciones nuevas en ' + (conObs === 1 ? '1 usuario.' : conObs + ' usuarios.'));
      return motivos;
    }

    /** Botón Guardar del pie: guarda con un toque (y sigue con el siguiente pase, si lo hay) o, si hay motivos, enseña el resumen. */
    function pedirGuardar() {
      const motivos = motivosResumen();
      if (motivos.length) abrirResumenGuardar(motivos);
      else guardarPase(true);
    }

    function botonesEstados(accion) {
      return '<div class="opciones-estado">' + app.init.estados.map(function (e) {
        return '<button type="button" class="opcion-estado" data-accion="' + accion + '" data-estado="' + esc(e.codigo) +
          '" style="' + estiloEstado(e.codigo) + '">' + iconoEstado(e) + esc(e.etiqueta) + '</button>';
      }).join('') + '</div>';
    }

    /** Añade un texto rápido a las observaciones (separado por coma), si no está ya. */
    function anadirObsRapida(texto) {
      const caja = $('obsUsuario');
      if (!caja) return;
      const actual = caja.value.trim();
      if (actual.split(/\s*,\s*/).indexOf(texto) >= 0) return;
      caja.value = actual ? actual + ', ' + texto : texto;
    }

    function abrirPanelUsuario(i) {
      const u = app.pase.usuarios[i];
      app.pase.indice = i;
      abrirPanel('<div><h3>' + esc(nombreVisible(u.nombre)) + '</h3>' +
        botonesEstados('elegir-estado').replace('data-estado="' + esc(u.estado) + '"', 'data-estado="' + esc(u.estado) + '" data-elegido="1"') +
        '<div class="campo"><label for="obsUsuario">Observaciones</label><textarea id="obsUsuario" rows="2">' + esc(u.observaciones) + '</textarea>' +
        // Textos rápidos: lista obs_rapida de la hoja Listas (Gestión › Listas).
        ((app.init.obsRapidas || []).length ? '<div class="obs-rapidas">' + app.init.obsRapidas.map(function (t) {
          return '<button type="button" class="boton compacto" data-accion="obs-rapida" data-texto="' + esc(t) + '">' + esc(t) + '</button>';
        }).join('') + '</div>' : '') + '</div>' +
        '<button type="button" class="boton ancho" data-accion="cerrar-usuario">Hecho</button>' +
        (u.telefono ? '<a class="boton ancho separado" href="tel:' + esc(u.telefono) + '">' + ICONO_TELEFONO + ' Llamar al ' + esc(u.telefono) + '</a>' : '') +
        (u.inscripcion_id && !u.fecha_baja ? '<button type="button" class="boton peligro ancho separado" data-accion="pase-baja">Dar de baja de este grupo…</button>' : '') +
        '</div>', true);
      const elegido = $('panel').querySelector('[data-elegido]');
      if (elegido) elegido.classList.add('elegido');
    }

    function cerrarPanelUsuario(nuevoEstado) {
      const p = app.pase;
      const u = p.usuarios[p.indice];
      if (nuevoEstado) { u.estado = nuevoEstado; vibrar(); }
      const obs = $('obsUsuario');
      if (obs) u.observaciones = obs.value.trim();
      cerrarPanel();
      $('fila' + p.indice).outerHTML = filaUsuario(u, p.indice, !!nuevoEstado);
      pintarPiePase();
      guardarBorrador();
    }

    /**
     * Siguiente pase de lista por hacer, para encadenarlos sin pasar por Inicio: el primer pendiente y, si no hay,
     * el primer grupo del día sin lista. Solo desde Inicio (desde el Historial se corrige un día suelto). null si no hay.
     */
    function siguientePase(p) {
      if (p.volver !== irInicio) return null;
      // Justo después de guardar, Inicio está olvidado y se está volviendo a pedir: se usan los últimos datos recibidos.
      const e = memoria[claveMemoria('api_inicio', [app.fecha])];
      const d = e && e.listo ? e.datos : app.ultimoInicio;
      if (!d || d.fecha !== app.fecha) return null;
      const libre = function (grupoId, fecha) {
        const clave = claveBorrador(grupoId, fecha);
        return !(grupoId === p.grupo.grupo_id && fecha === p.fecha) && !app.guardando[clave] && !app.hechos[clave];
      };
      const pendiente = d.pendientes.find(function (x) { return libre(x.grupo_id, x.fecha); });
      if (pendiente) return { grupo_id: pendiente.grupo_id, fecha: pendiente.fecha, nombre: pendiente.nombre };
      // Un grupo sin nadie inscrito no tiene lista que pasar (4-nov-2026); los pendientes ya vienen sin ellos.
      const delDia = d.grupos.find(function (g) {
        return g.estadoSesion === 'pendiente' && !g.diaEspecial && g.inscritos > 0 && libre(g.grupo_id, d.fecha);
      });
      return delDia ? { grupo_id: delDia.grupo_id, fecha: d.fecha, nombre: delDia.nombre } : null;
    }

    function botonSiguiente(accion, texto) {
      const s = siguientePase(app.pase);
      if (!s) return '';
      return '<button type="button" class="boton ancho siguiente" data-accion="' + accion + '" data-siguiente="1">' + esc(texto) +
        '<span class="sub">' + esc(s.nombre) + ' · ' + esc(fechaCorta(s.fecha)) + '</span></button>';
    }

    /** Tras guardar o cancelar: abre el siguiente pase s (si lo hay) o vuelve a la pantalla de origen. */
    function seguirTrasPase(p, s) {
      if (s) abrirPase(s.grupo_id, s.fecha, p.volver);
      else p.volver();
    }

    function abrirResumenGuardar(motivos) {
      const cuenta = contadores();
      let lista = '<ul class="resumen-lista">';
      Object.keys(cuenta).forEach(function (c) {
        lista += '<li>' + chipEstado(c) + '<strong>' + cuenta[c] + '</strong></li>';
      });
      lista += '<li><span>Total</span><strong>' + app.pase.usuarios.length + '</strong></li></ul>';
      abrirPanel('<div><h3>¿Guardar la lista?</h3><p>' + esc(app.pase.grupo.nombre) + ' · ' + esc(fechaLarga(app.pase.fecha)) + '</p>' +
        ((motivos || []).length ? '<div class="banda especial">' + motivos.map(esc).join('<br>') + '</div>' : '') +
        lista + '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton lleno" data-accion="confirmar-guardar">' + ICONO_GUARDAR + 'Sí, guardar</button></div>' +
        botonSiguiente('confirmar-guardar', 'Guardar y pasar a la siguiente') + '</div>');
    }

    /**
     * Guarda en segundo plano: vuelve (o abre el siguiente pase) sin esperar al servidor. Las marcas quedan en el
     * borrador hasta que el servidor confirma; si falla, la tarjeta sale como «Sin guardar» y al reabrir se recuperan.
     */
    function guardarPase(conSiguiente) {
      const p = app.pase;
      const grupoId = p.grupo.grupo_id;
      const clave = claveBorrador(grupoId, p.fecha);
      const payload = {
        grupo_id: grupoId,
        fecha: p.fecha,
        nota: p.nota,
        registros: p.usuarios.map(function (u) {
          return { usuario_id: u.usuario_id, estado: u.estado, observaciones: u.observaciones };
        })
      };
      guardarBorrador();
      const siguiente = conSiguiente ? siguientePase(p) : null;
      app.guardando[clave] = 'guardando';
      seguirTrasPase(p, siguiente);
      actualizarInsignia();
      enviarGuardado({ clave: clave, payload: payload, nombre: p.grupo.nombre, borrador: leerBorradorTexto(clave) });
    }

    // ---------- Listas por guardar (4-nov-2026) ----------
    // Cada lista enviada queda en app.porGuardar hasta que el servidor la confirma. Si falla la conexión, se
    // reintenta sola (cada vez más espaciado, al recuperar la conexión y al volver a la app); si el servidor la
    // rechaza (por ejemplo, porque ha cambiado la lista de inscritos), espera a que se abra y se revise.
    // Se apunta también en localStorage: si se cierra la app, al volver a abrirla sale en Inicio para reintentarla
    // a mano (no se envía sola, por si mientras tanto se ha corregido desde otro aparato).

    const CLAVE_POR_GUARDAR = 'asistencia|porGuardar';
    const ESPERAS_REINTENTO = [5000, 15000, 30000, 60000, 120000];

    function recordarPorGuardar() {
      const o = {};
      Object.keys(app.porGuardar).forEach(function (k) { o[k] = { payload: app.porGuardar[k].payload, nombre: app.porGuardar[k].nombre }; });
      try {
        if (Object.keys(o).length) window.localStorage.setItem(CLAVE_POR_GUARDAR, JSON.stringify(o));
        else window.localStorage.removeItem(CLAVE_POR_GUARDAR);
      } catch (e) { /* sin localStorage: solo queda en memoria */ }
    }

    /** Al abrir la app: las listas que quedaron sin guardar la última vez salen como «Sin guardar», sin enviarse solas. */
    function recuperarPorGuardar() {
      let o = null;
      try { o = JSON.parse(window.localStorage.getItem(CLAVE_POR_GUARDAR) || 'null'); } catch (e) { o = null; }
      if (!o) return;
      Object.keys(o).forEach(function (k) {
        if (!o[k] || !o[k].payload || app.porGuardar[k]) return;
        app.porGuardar[k] = { clave: k, payload: o[k].payload, nombre: o[k].nombre || o[k].payload.grupo_id,
          borrador: leerBorradorTexto(k), intentos: 0, rechazo: '', recuperada: true };
        app.guardando[k] = 'error';
      });
    }

    /** Envía (o reenvía) una lista: t = { clave, payload, nombre, borrador }. */
    function enviarGuardado(t) {
      const anterior = app.porGuardar[t.clave];
      if (anterior) clearTimeout(anterior.temporizador);
      t.intentos = t.intentos || 0;
      t.rechazo = '';
      t.recuperada = false;
      app.porGuardar[t.clave] = t;
      app.guardando[t.clave] = 'guardando';
      recordarPorGuardar();
      const grupoId = t.payload.grupo_id;
      const fecha = t.payload.fecha;

      llamarSinCarga(false, 'api_guardarSesion', [t.payload]).then(function () {
        if (app.porGuardar[t.clave] !== t) return;   // se ha vuelto a guardar después: manda la última
        delete app.porGuardar[t.clave];
        recordarPorGuardar();
        delete app.guardando[t.clave];
        app.hechos[t.clave] = true;
        // Si se ha vuelto a abrir y cambiar mientras se guardaba, se conserva el borrador nuevo.
        if (leerBorradorTexto(t.clave) === t.borrador) borrarBorrador(grupoId, fecha);
        anticuar('sesion', grupoId, fecha);
        aviso(textoConFecha('Lista guardada · ' + t.nombre, fecha));
        trasGuardarEnFondo(t.clave);
        precargar();
      }).catch(function (e) {
        if (app.porGuardar[t.clave] !== t) return;
        app.guardando[t.clave] = 'error';
        t.intentos++;
        if (e.conexion) {
          const espera = ESPERAS_REINTENTO[Math.min(t.intentos, ESPERAS_REINTENTO.length) - 1];
          t.temporizador = setTimeout(function () { if (app.porGuardar[t.clave] === t) enviarGuardado(t); }, espera);
          // Un solo mensaje: en Inicio ya lo dice la banda de arriba; en otra pantalla, un aviso neutro la primera vez.
          if (t.intentos === 1 && app.vista !== 'inicio') aviso('Sin conexión · la lista se enviará sola');
        } else {
          t.rechazo = e.message;
          // Lo más probable es que haya cambiado la lista de inscritos: al reabrir el pase se pide de nuevo.
          olvidar('api_sesion', function (g, f) { return g === grupoId && f === fecha; });
          // En Inicio lo dice la banda (en rojo, con el motivo); en otra pantalla, el aviso.
          if (app.vista !== 'inicio') aviso('No se ha guardado ' + textoConFecha(t.nombre, fecha) + '. ' + e.message, true);
        }
        trasGuardarEnFondo(t.clave);
      });
    }

    /** Reenvía las listas que fallaron por la conexión. todas: también las rechazadas y las de la visita anterior (botón «Reintentar»). */
    function reintentarGuardados(todas) {
      Object.keys(app.porGuardar).forEach(function (k) {
        const t = app.porGuardar[k];
        if (app.guardando[k] !== 'error') return;
        if (!todas && (t.rechazo || t.recuperada)) return;
        enviarGuardado(t);
      });
      if (todas) refrescarVista();
    }

    /** Al cancelar una sesión, lo que quedara por guardar de ella ya no se envía. */
    function olvidarPorGuardar(clave) {
      const t = app.porGuardar[clave];
      if (!t) return;
      clearTimeout(t.temporizador);
      delete app.porGuardar[clave];
      delete app.guardando[clave];
      recordarPorGuardar();
    }

    /** Aviso fijo de Inicio mientras quede alguna lista sin guardar, con cada una para abrirla y «Reintentar». */
    function htmlPorGuardar() {
      const lista = Object.keys(app.porGuardar).map(function (k) { return app.porGuardar[k]; })
        .filter(function (t) { return app.guardando[t.clave] === 'error'; });
      if (!lista.length) return '';
      const n = lista.length;
      // Un solo mensaje sin conexión (4-nov-2026): en tono neutro mientras se reintenta sola; en rojo solo si el
      // servidor ha rechazado alguna.
      const rechazadas = lista.some(function (t) { return t.rechazo; });
      const solas = lista.every(function (t) { return !t.rechazo && !t.recuperada; });
      const titulo = rechazadas ? (n === 1 ? 'Hay 1 lista sin guardar' : 'Hay ' + n + ' listas sin guardar')
        : (n === 1 ? '1 lista pendiente de enviar' : n + ' listas pendientes de enviar') +
          (solas ? (n === 1 ? ' · se enviará sola' : ' · se enviarán solas') : '');
      return '<div class="banda ' + (rechazadas ? 'error' : 'neutra') + ' por-guardar"><div class="por-guardar-cuerpo"><strong>' +
        esc(titulo) + '</strong>' +
        lista.map(function (t) {
          return '<button type="button" class="por-guardar-item" data-accion="pase" data-grupo="' + esc(t.payload.grupo_id) +
            '" data-fecha="' + esc(t.payload.fecha) + '"><span>' + esc(t.nombre) + ' · ' + esc(fechaCorta(t.payload.fecha)) +
            (t.rechazo ? '<small>' + esc(t.rechazo) + '</small>' : '') + '</span><span class="flecha" aria-hidden="true">›</span></button>';
        }).join('') +
        '<button type="button" class="boton compacto" data-accion="reintentar-guardados">Reintentar ahora</button></div></div>';
    }

    function trasGuardarEnFondo(clave) {
      refrescarVista();
      actualizarInsignia();
      // Si se ha vuelto a abrir ese mismo pase mientras se guardaba, se quita o cambia su aviso.
      if (app.vista === 'pase' && app.pase && claveBorrador(app.pase.grupo.grupo_id, app.pase.fecha) === clave) pintarPase();
    }

    /** Vuelve a pintar Inicio o el Historial, si son la pantalla abierta, sin mover la página. */
    function refrescarVista() {
      const y = window.scrollY;
      const recolocar = function () { window.scrollTo(0, y); };
      if (app.vista === 'inicio') {
        pedirCon(false, 'api_inicio', [app.fecha]).then(function (d) { pintarInicio(d); recolocar(); }).catch(function () { /* se queda como está */ });
      } else if (app.vista === 'historial') {
        const grupoId = app.hist.grupo_id;
        const mes = app.hist.mes;
        pedirCon(false, 'api_historial', [grupoId, mes]).then(function (d) {
          if (app.vista === 'historial' && app.hist.grupo_id === grupoId && app.hist.mes === mes) { pintarHistorial(d); recolocar(); }
        }).catch(function () { /* se queda como está */ });
      }
    }

    function abrirCancelarSesion() {
      abrirPanel('<div><h3>¿No hubo clase?</h3>' +
        '<p>Las marcas que haya no se borran.</p>' +
        '<div class="campo"><label for="motivoCancelar">Motivo (opcional)</label><textarea id="motivoCancelar" rows="2"></textarea></div>' +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton peligro-lleno" data-accion="confirmar-cancelar">Sin clase</button></div>' +
        botonSiguiente('confirmar-cancelar', 'Sin clase y pasar a la siguiente') + '</div>');
    }

    function cancelarPase(conSiguiente) {
      const p = app.pase;
      // Se busca antes de anticuar, que olvida los datos de Inicio de donde sale.
      const siguiente = conSiguiente ? siguientePase(p) : null;
      // Si ya estaba sin clase, no hay nada que deshacer (deshacer la dejaría como hecha o pendiente).
      const yaCancelada = !!(p.sesion && p.sesion.estado === 'cancelada');
      const c = { grupo_id: p.grupo.grupo_id, fecha: p.fecha, nombre: p.grupo.nombre };
      llamar('api_cancelarSesion', p.grupo.grupo_id, p.fecha, $('motivoCancelar').value.trim()).then(function () {
        const clave = claveBorrador(p.grupo.grupo_id, p.fecha);
        app.hechos[clave] = true;
        olvidarPorGuardar(clave);
        // El borrador (las marcas sin guardar) se guarda aparte por si se deshace.
        const borrador = leerBorradorTexto(clave);
        borrarBorrador(p.grupo.grupo_id, p.fecha);
        anticuar('sesion', p.grupo.grupo_id, p.fecha);
        if (yaCancelada) aviso(textoConFecha('Sin clase · ' + c.nombre, c.fecha));
        else avisoDeshacer(textoConFecha('Sin clase · ' + c.nombre, c.fecha), function () { deshacerNoHubo(c, borrador, true); });
        // Si mientras tanto se ha ido a otra pantalla, no se la cambia.
        if (app.pase === p && app.vista === 'pase') seguirTrasPase(p, siguiente);
        actualizarInsignia();
        precargar();
      }).catch(avisoError);
    }

    /** Menú «⋮» de un pendiente de Inicio (4-nov-2026): pasar lista o «No hubo clase». */
    function abrirMenuPendiente(grupoId, fecha) {
      const d = app.ultimoInicio;
      const p = d && d.pendientes.find(function (x) { return x.grupo_id === grupoId && x.fecha === fecha; });
      abrirPanel('<div><h3>' + esc(p ? p.nombre : grupoId) + '</h3><p class="sub-panel">' + esc(fechaLarga(fecha)) + '</p><div class="menu-opciones">' +
        '<button type="button" class="opcion-menu" data-accion="pase-desde-menu" data-grupo="' + esc(grupoId) + '" data-fecha="' + esc(fecha) + '">' +
        ICONO_ABRIR_PASE + '<span>Pasar lista</span></button>' +
        '<button type="button" class="opcion-menu peligro" data-accion="no-hubo-clase" data-grupo="' + esc(grupoId) + '" data-fecha="' + esc(fecha) + '">' +
        ICONO_SIN_CLASE + '<span>No hubo clase…</span></button></div></div>');
    }

    /** «No hubo clase» en un pendiente de Inicio: cancela la sesión sin abrir el pase de lista. */
    let cancelarPendiente = null;
    function abrirNoHuboClase(grupoId, fecha) {
      const d = app.ultimoInicio;
      const p = d && d.pendientes.find(function (x) { return x.grupo_id === grupoId && x.fecha === fecha; });
      cancelarPendiente = { grupo_id: grupoId, fecha: fecha, nombre: p ? p.nombre : grupoId };
      abrirPanel('<div><h3>¿No hubo clase?</h3>' +
        '<p><strong>' + esc(cancelarPendiente.nombre) + '</strong> · ' + esc(fechaLarga(fecha)) + '</p>' +
        '<p>Dejará de salir en Pendientes. Las marcas que haya no se borran.</p>' +
        '<div class="campo"><label for="motivoCancelar">Motivo (opcional)</label><textarea id="motivoCancelar" rows="2"></textarea></div>' +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton peligro-lleno" data-accion="confirmar-no-hubo">Sin clase</button></div></div>');
    }

    function cancelarDesdeInicio() {
      const c = cancelarPendiente;
      if (!c) return;
      const clave = claveBorrador(c.grupo_id, c.fecha);
      llamar('api_cancelarSesion', c.grupo_id, c.fecha, $('motivoCancelar').value.trim()).then(function () {
        cancelarPendiente = null;
        app.hechos[clave] = true;
        olvidarPorGuardar(clave);
        // El borrador se guarda aparte por si se deshace.
        const borrador = leerBorradorTexto(clave);
        borrarBorrador(c.grupo_id, c.fecha);
        anticuar('sesion', c.grupo_id, c.fecha);
        cerrarPanel();
        avisoDeshacer(textoConFecha('Sin clase · ' + c.nombre, c.fecha), function () { deshacerNoHubo(c, borrador); });
        // Se quita al momento de la lista y después se repinta con los datos del servidor.
        if (app.vista === 'inicio' && app.ultimoInicio) {
          const d = copia(app.ultimoInicio);
          d.pendientes = d.pendientes.filter(function (x) { return claveBorrador(x.grupo_id, x.fecha) !== clave; });
          const y = window.scrollY;
          pintarInicio(d);
          window.scrollTo(0, y);
        }
        refrescarVista();
        precargar();
      }).catch(avisoError);
    }

    /**
     * «Deshacer» tras «No hubo clase» (en Inicio o en el pase): la clase vuelve a como estaba (hecha si tenía marcas
     * guardadas; si no, pendiente), con su borrador si lo tenía. desdePase: el aviso no habla de Pendientes.
     */
    function deshacerNoHubo(c, borrador, desdePase) {
      const clave = claveBorrador(c.grupo_id, c.fecha);
      llamar('api_deshacerCancelar', c.grupo_id, c.fecha).then(function () {
        delete app.hechos[clave];
        if (borrador) { try { window.localStorage.setItem(clave, borrador); } catch (e) { /* se ignora */ } }
        anticuar('sesion', c.grupo_id, c.fecha);
        aviso(textoConFecha((desdePase ? 'Clase recuperada · ' : 'Vuelve a Pendientes · ') + c.nombre, c.fecha));
        refrescarVista();
        actualizarInsignia();
        precargar();
      }).catch(avisoError);
    }

    // ---------- Altas y bajas de un grupo ----------

    function abrirGrupo(grupoId, pestana, volver) {
      const vuelta = volver || (app.grupo && app.grupo.grupo.grupo_id === grupoId ? app.grupo.volver : irInicio);
      const conocido = grupoConocido(grupoId);
      const titulo = conocido ? conocido.nombre : 'Altas y bajas';
      cargarPantalla('api_grupo', [grupoId], function () {
        pantallaSecundaria('grupo', titulo, conocido ? tallerSiHaceFalta(conocido.taller, conocido.nombre) : '', vuelta);
        pintar(esqueleto('grupo'), true);
      }, function (d, conEsqueleto) {
        d.volver = vuelta;
        app.grupo = d;
        app.pestana = pestana || 'lista';
        if (conEsqueleto) barra(d.grupo.nombre, subGrupo(d), vuelta);
        else pantallaSecundaria('grupo', titulo, subGrupo(d), vuelta);
        pintarGrupo();
      }, function () { abrirGrupo(grupoId, pestana, vuelta); });
    }

    /** Subtítulo de Altas y bajas: el taller (si no está ya en el nombre) y cuántos inscritos hay. */
    function subGrupo(d) {
      return [tallerSiHaceFalta(d.grupo.taller, d.grupo.nombre), d.inscritos.length + ' inscritos'].filter(Boolean).join(' · ');
    }

    /**
     * Vuelve a pedir el grupo en segundo plano tras un alta o una baja (ya se ha cambiado en el sitio) y,
     * si sigue abierto, actualiza el subtítulo y la Lista; las filas nuevas aparecen con una animación corta.
     */
    let cambiosGrupo = 0;   // cambios hechos en el sitio: una respuesta pedida antes de otro cambio llega vieja
    function refrescarGrupo(grupoId) {
      const version = ++cambiosGrupo;
      pedirCon(false, 'api_grupo', [grupoId]).then(function (d) {
        if (version !== cambiosGrupo) return;
        const actual = app.grupo;
        if (!actual || actual.grupo.grupo_id !== grupoId) return;
        const antes = {};
        actual.inscritos.forEach(function (u) { antes[u.inscripcion_id] = true; });
        const igual = JSON.stringify(actual.inscritos) === JSON.stringify(d.inscritos);
        d.volver = actual.volver;
        app.grupo = d;
        if (app.vista !== 'grupo' || igual) return;
        $('barraSub').textContent = subGrupo(d);
        if (app.pestana === 'lista' && $('zonaLista')) {
          const nuevos = {};
          d.inscritos.forEach(function (u) { if (!antes[u.inscripcion_id]) nuevos[u.inscripcion_id] = true; });
          $('zonaLista').outerHTML = htmlLista(d, nuevos);
        }
      }).catch(function () { /* se queda como está; al volver a abrir el grupo se pedirá de nuevo */ });
    }

    const MS_SALIDA = 180;   // animación de una fila que se va (--dur-2, md-sale)

    /** La fila se va con una animación corta y después se llama a despues (que vuelve a pintar la lista). */
    function sacarFila(fila, despues) {
      if (!fila) { despues(); return; }
      fila.style.height = fila.offsetHeight + 'px';   // alto de partida para que el hueco se cierre poco a poco
      void fila.offsetHeight;
      fila.classList.add('sale');
      setTimeout(despues, MS_SALIDA);
    }

    /** Tras una baja o un cambio de grupo en Altas y bajas: la fila se va (o se marca la baja) sin esperar a recargar. */
    function quitarDelGrupo(grupoId, insc, ultimoDia) {
      // app.grupo puede ser ya otro objeto (refrescarGrupo lo cambia al llegar): se busca por el id.
      const grupo = app.grupo;
      if (!grupo || grupo.grupo.grupo_id !== grupoId) { refrescarGrupo(grupoId); return; }
      const u = grupo.inscritos.find(function (x) { return x.inscripcion_id === insc; });
      if (u) {
        // El servidor solo manda las inscripciones que siguen hoy o después (datosGrupo_).
        if (ultimoDia < app.init.hoy) grupo.inscritos = grupo.inscritos.filter(function (x) { return x !== u; });
        else u.fecha_baja = ultimoDia;
      }
      if (app.vista === 'grupo') {
        $('barraSub').textContent = subGrupo(grupo);
        if (app.pestana === 'lista' && $('zonaLista')) {
          const sale = !grupo.inscritos.some(function (x) { return x.inscripcion_id === insc; });
          const fila = sale ? $('zonaLista').querySelector('[data-inscripcion="' + insc + '"]') : null;
          sacarFila(fila, function () {
            if (app.grupo && app.vista === 'grupo' && app.pestana === 'lista' && $('zonaLista')) $('zonaLista').outerHTML = htmlLista(app.grupo);
          });
        } else {
          // Pestaña Baja: el formulario vuelve a empezar, sin ese usuario.
          const y = window.scrollY;
          pintarGrupo();
          window.scrollTo(0, y);
        }
      }
      refrescarGrupo(grupoId);
    }

    /** Tras dar de baja desde el pase de lista: si su último día es anterior al del pase, su fila se va. */
    function quitarDelPase(pase, insc, ultimoDia) {
      const i = pase.usuarios.findIndex(function (u) { return u.inscripcion_id === insc; });
      if (i < 0) return;
      if (ultimoDia >= pase.fecha) { pase.usuarios[i].fecha_baja = ultimoDia; return; }
      pase.usuarios.splice(i, 1);
      if (app.pase !== pase || app.vista !== 'pase') return;
      guardarBorrador();
      sacarFila($('fila' + i), function () {
        if (app.pase !== pase || app.vista !== 'pase') return;
        if (!pase.usuarios.length || !$('listaUsuarios')) { pintarPase(); return; }
        $('listaUsuarios').innerHTML = pase.usuarios.map(function (u, k) { return filaUsuario(u, k); }).join('');
        pintarPiePase();
      });
    }

    function pintarGrupo() {
      const d = app.grupo;
      const pestanas = [['lista', 'Lista'], ['alta', 'Alta'], ['baja', 'Baja']];
      let html = '<div class="pestanas">' + pestanas.map(function (p) {
        return '<button type="button" class="pestana' + (app.pestana === p[0] ? ' activa' : '') + '" data-accion="pestana" data-pestana="' +
          p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div>';

      if (app.pestana === 'lista') html += htmlLista(d);
      if (app.pestana === 'alta') html += htmlAlta();
      if (app.pestana === 'baja') html += htmlBaja(d);
      // Botón flotante de Material 3 en la Lista: lleva a Alta con el buscador listo para escribir.
      if (app.pestana === 'lista') html += fab('pestana', 'Inscribir', ' data-pestana="alta" data-enfocar="1"');
      pintar(html);
      if (app.pestana === 'alta' && app.enfocarBuscador) { app.enfocarBuscador = false; $('textoBuscar').focus(); }
    }

    /** Pestaña Lista (en #zonaLista, que se cambia en el sitio tras un alta o una baja). nuevos: ids que llegan (animación). */
    function htmlLista(d, nuevos) {
      if (!d.inscritos.length) return '<div id="zonaLista"><p class="vacio">Todavía no hay usuarios inscritos.</p></div>';
      return '<div id="zonaLista"><p class="ayuda">Toca a un usuario para darle de baja o cambiarle de grupo.</p><div class="lista">' + d.inscritos.map(function (u) {
        return filaPersona({ nombre: u.nombre, tocable: true, clase: nuevos && nuevos[u.inscripcion_id] ? 'entra' : '',
          atributos: ' role="button" tabindex="0" data-accion="inscrito" data-inscripcion="' + esc(u.inscripcion_id) + '"',
          detalle: 'ID ' + esc(u.usuario_id) + ' · alta ' + esc(fechaNumerica(u.fecha_alta)) + (u.fecha_baja ? ' · baja ' + esc(fechaNumerica(u.fecha_baja)) : ''),
          derecha: enlaceLlamar(u.telefono) });
      }).join('') + '</div></div>';
    }

    /** Panel de un usuario de la pestaña Lista: baja, cambio de grupo y llamada, con el usuario ya elegido. */
    function abrirPanelInscrito(inscripcionId) {
      // Recién inscrito: hasta que llega la lista del servidor no se sabe su inscripción (inscribir).
      if (!inscripcionId) { aviso('Un momento: se está actualizando la lista.'); return; }
      const u = app.grupo.inscritos.find(function (x) { return x.inscripcion_id === inscripcionId; });
      if (!u) return;
      let html = '<div><h3>' + esc(nombreVisible(u.nombre)) + '</h3><p>ID ' + esc(u.usuario_id) + ' · alta ' + esc(fechaNumerica(u.fecha_alta)) +
        (u.fecha_baja ? '<br>Ya tiene la baja: su último día es el ' + esc(fechaNumerica(u.fecha_baja)) + '.' : '') + '</p><div class="pila">';
      if (!u.fecha_baja) {
        html += '<button type="button" class="boton peligro ancho" data-accion="panel-baja" data-inscripcion="' + esc(u.inscripcion_id) + '">Dar de baja</button>' +
          '<button type="button" class="boton ancho" data-accion="panel-cambio" data-inscripcion="' + esc(u.inscripcion_id) + '">Cambiar de grupo</button>';
      }
      if (u.telefono) {
        html += '<a class="boton ancho" href="tel:' + esc(u.telefono) + '">' + ICONO_TELEFONO + ' Llamar al ' + esc(u.telefono) + '</a>';
      }
      html += '<button type="button" class="boton ancho" data-accion="cerrar-panel">Cerrar</button></div></div>';
      abrirPanel(html);
    }

    /** Fecha (Hoy, Ayer u Otra…) y motivo de la baja, como opciones (4-nov-2026; antes, un desplegable). */
    function camposBaja() {
      return campoFecha('fechaBaja', 'Último día en el grupo') +
        opcionesRadio('motivoBaja', 'Motivo', app.init.motivosBaja.map(function (m) { return { valor: m, texto: m }; }), '');
    }

    /** Grupo nuevo como opciones (con sus días y hora debajo) y primer día en él. */
    function camposCambio(destinos) {
      if (!destinos.length) return '<p class="vacio">No hay otros grupos activos en este curso.</p>';
      return opcionesRadio('grupoDestino', 'Grupo nuevo', destinos.map(function (g) {
        return { valor: g.grupo_id, texto: tallerYGrupo(g.taller, g.nombre), sub: horario(g) };
      }), '') + campoFecha('fechaCambio', 'Primer día en el grupo nuevo');
    }

    /** Baja o cambio de grupo de un usuario ya elegido, en el panel: el campo oculto bajaUsuario hace de selector para pedirBaja/pedirCambio. */
    function abrirPanelBaja(inscripcionId) {
      abrirPanel('<div><h3>Dar de baja</h3><p><strong>' + esc(nombreVisible(nombreInscripcion(inscripcionId))) + '</strong></p>' +
        '<input type="hidden" id="bajaUsuario" value="' + esc(inscripcionId) + '">' + camposBaja() +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        '<button type="button" class="boton peligro" data-accion="dar-baja" data-en-curso="Dando de baja…">Dar de baja</button></div></div>');
    }

    function abrirPanelCambio(inscripcionId) {
      abrirPanel('<div><h3>Cambiar de grupo</h3><p><strong>' + esc(nombreVisible(nombreInscripcion(inscripcionId))) + '</strong></p>' +
        '<input type="hidden" id="bajaUsuario" value="' + esc(inscripcionId) + '">' + camposCambio(app.grupo.destinos) +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Volver</button>' +
        (app.grupo.destinos.length ? '<button type="button" class="boton primario" data-accion="cambiar-grupo">Cambiar de grupo</button>' : '') + '</div></div>');
    }

    /** Pestaña Alta: primero el buscador, después la fecha de alta (Hoy, Ayer u Otra…) y los resultados. */
    function htmlAlta() {
      return '<div class="campo buscador"><label for="textoBuscar">Buscar por ID o por nombre</label>' +
        '<input type="search" id="textoBuscar" autocomplete="off" enterkeyhint="search" placeholder="Ej.: 1498 o GARCIA"></div>' +
        campoFecha('fechaAlta', 'Fecha de alta') +
        '<div id="resultadosBusqueda"></div>' +
        '<div class="bloque"><h3>¿No aparece?</h3>' +
        '<div class="campo"><label for="nuevoId">ID del centro</label><input type="text" id="nuevoId" autocomplete="off" inputmode="numeric" enterkeyhint="next"></div>' +
        '<div class="campo"><label for="nuevoNombre">Apellidos y nombre</label><input type="text" id="nuevoNombre" autocomplete="off" autocapitalize="characters" enterkeyhint="next" placeholder="APELLIDO APELLIDO NOMBRE"></div>' +
        '<div class="campo"><label for="nuevoTelefono">Teléfono (opcional)</label><input type="tel" id="nuevoTelefono" autocomplete="off" inputmode="tel" enterkeyhint="done"></div>' +
        '<button type="button" class="boton primario ancho" data-accion="crear-usuario">Crear usuario nuevo e inscribir</button></div>';
    }

    function htmlBaja(d) {
      const activos = d.inscritos.filter(function (u) { return !u.fecha_baja; });
      if (!activos.length) return '<p class="vacio">No hay usuarios para dar de baja.</p>';
      const opcionesUsuario = '<option value="">— Elige un usuario —</option>' + activos.map(function (u) {
        return '<option value="' + esc(u.inscripcion_id) + '">' + esc(nombreVisible(u.nombre)) + ' (' + esc(u.usuario_id) + ')</option>';
      }).join('');

      return '<div class="campo"><label for="bajaUsuario">Usuario</label><select id="bajaUsuario">' + opcionesUsuario + '</select></div>' +
        '<div class="bloque"><h3>Dar de baja</h3>' + camposBaja() +
        '<button type="button" class="boton peligro ancho" data-accion="dar-baja" data-en-curso="Dando de baja…">Dar de baja</button></div>' +
        '<div class="bloque"><h3>Cambiar de grupo</h3>' + camposCambio(d.destinos) +
        (d.destinos.length ? '<button type="button" class="boton primario ancho" data-accion="cambiar-grupo">Cambiar de grupo</button>' : '') + '</div>';
    }

    let temporizadorBusqueda = null;
    function programar(fn) {
      clearTimeout(temporizadorBusqueda);
      temporizadorBusqueda = setTimeout(fn, 450);
    }

    /** Para buscar: mayúsculas, sin tildes y sin espacios sobrantes (como sinTildes_ del servidor). */
    function paraBuscar(texto) {
      return String(texto || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
    }

    /**
     * Busca en la lista de todos los usuarios (api_usuariosAlta, precargada y sin teléfonos), sin esperar al servidor:
     * por el principio del ID o por cualquier parte del nombre. Como mucho 25, por orden alfabético.
     */
    function filtrarUsuarios(lista, texto, grupo) {
      const t = paraBuscar(texto);
      const tId = t.replace(/\s+/g, '');
      const enGrupo = {};
      grupo.inscritos.forEach(function (u) { enGrupo[u.usuario_id] = true; });
      const encontrados = [];
      for (let k = 0; k < lista.length && encontrados.length < 25; k++) {
        const u = lista[k];
        if (u.usuario_id.indexOf(tId) === 0 || paraBuscar(u.nombre).indexOf(t) >= 0) {
          encontrados.push({ usuario_id: u.usuario_id, nombre: u.nombre, enGrupo: !!enGrupo[u.usuario_id] });
        }
      }
      return encontrados;
    }

    function buscar() {
      const caja = $('textoBuscar');
      if (!caja) return;
      const texto = caja.value.trim();
      const destino = $('resultadosBusqueda');
      if (texto.length < 2) { destino.innerHTML = ''; return; }
      const numero = ++app.busqueda;
      if (!tieneMemoria('api_usuariosAlta', [])) destino.innerHTML = '<p class="vacio">Cargando la lista de usuarios…</p>';
      const grupo = app.grupo;
      pedirCon(false, 'api_usuariosAlta', []).then(function (todos) {
        if (numero !== app.busqueda || !$('resultadosBusqueda')) return;
        const lista = filtrarUsuarios(todos, texto, grupo);
        if (!lista.length) {
          $('resultadosBusqueda').innerHTML = '<p class="vacio">No se ha encontrado a nadie. Puedes crearlo abajo, en «¿No aparece?».</p>';
          if (/^\S+$/.test(texto) && /\d/.test(texto)) $('nuevoId').value = texto.toUpperCase();
          return;
        }
        $('resultadosBusqueda').innerHTML = '<div class="lista">' + lista.map(function (u) {
          // Quien ya está en el grupo lo dice debajo del nombre (a la derecha le quitaría sitio al nombre).
          return filaPersona({ nombre: u.nombre,
            detalle: 'ID ' + esc(u.usuario_id) + (u.enGrupo ? ' · <span class="ya-en-grupo">Ya está en el grupo</span>' : ''),
            derecha: u.enGrupo ? '' : '<button type="button" class="boton primario compacto" data-accion="inscribir" data-usuario="' + esc(u.usuario_id) + '">Inscribir</button>' });
        }).join('') + '</div>';
      }).catch(function (e) {
        if (numero === app.busqueda && $('resultadosBusqueda')) $('resultadosBusqueda').innerHTML = '<p class="vacio">' + esc(e.message) + '</p>';
      });
    }

    /**
     * Inscribe (y crea, si hace falta) desde la pestaña Alta. Al responder, el resultado pasa a «Ya está en el grupo»
     * en el sitio, sin perder la búsqueda, y el subtítulo cuenta uno más; la lista se vuelve a pedir en segundo plano.
     */
    function inscribir(datos) {
      const grupoId = app.grupo.grupo.grupo_id;
      datos.fecha_alta = datos.fecha_alta || valor('fechaAlta');
      llamar('api_altaUsuario', grupoId, datos).then(function (r) {
        if (r.parecidos) {
          avisarParecidos(String(datos.nombre).toUpperCase(), r.parecidos, 'Inscribir a este',
            function (id) { inscribir({ usuario_id: id, fecha_alta: datos.fecha_alta }); },
            function () { datos.crear_aunque_parecido = true; inscribir(datos); });
          return;
        }
        anticuar('inscripciones');
        if (r.creado) anticuar('usuario-nuevo');
        avisoDeshacer((r.creado ? 'Usuario creado e inscrito: ' : 'Inscripción hecha: ') + nombreVisible(r.nombre),
          function () { deshacerInscripcion(grupoId, r.inscripcion_id, String(datos.usuario_id).trim(), r.nombre); });
        soltarBotones();
        // app.grupo puede ser ya otro objeto (refrescarGrupo lo cambia al llegar): se busca por el id.
        const grupo = app.grupo;
        if (grupo && grupo.grupo.grupo_id === grupoId && app.vista === 'grupo') {
          // Hasta que llegue la lista del servidor, sin inscripcion_id (abrirPanelInscrito lo tiene en cuenta).
          grupo.inscritos.push({ inscripcion_id: '', usuario_id: String(datos.usuario_id).trim(), nombre: r.nombre,
            telefono: datos.telefono || '', fecha_alta: datos.fecha_alta, fecha_baja: '' });
          grupo.inscritos.sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });
          $('barraSub').textContent = subGrupo(grupo);
          $('vista').querySelectorAll('[data-accion="inscribir"]').forEach(function (b) {
            if (b.getAttribute('data-usuario') === String(datos.usuario_id)) {
              // La respuesta, en el sitio del botón: «Inscrito» (al volver a buscar, «Ya está en el grupo» bajo el nombre).
              b.outerHTML = '<span class="etiqueta realizada inscrito entra">Inscrito</span>';
            }
          });
          if (datos.nombre) {
            ['nuevoId', 'nuevoNombre', 'nuevoTelefono'].forEach(function (id) { if ($(id)) $(id).value = ''; });
            hechoEnBoton($('vista').querySelector('[data-accion="crear-usuario"]'), 'Inscripción hecha');
          }
          if (app.pestana === 'lista' && $('zonaLista')) $('zonaLista').outerHTML = htmlLista(grupo);
        }
        refrescarGrupo(grupoId);
        precargar();
      }).catch(avisoError);
    }

    /** La respuesta en el propio botón: durante 2,5 s dice lo que se ha hecho, con una marca, y después vuelve a estar como antes. */
    function hechoEnBoton(b, texto) {
      if (!b) return;
      const html = b.innerHTML;
      b.classList.add('hecho');
      b.innerHTML = ICONO_GUARDAR + esc(texto);
      setTimeout(function () {
        if (!b.isConnected || !b.classList.contains('hecho')) return;
        b.classList.remove('hecho');
        b.innerHTML = html;
      }, 2500);
    }

    /**
     * «Deshacer» tras inscribir: el servidor borra la inscripción (si nada depende de ella todavía) y el usuario
     * sale de la lista en el sitio; en Alta, su resultado vuelve a ofrecer «Inscribir». Un usuario creado al
     * inscribirlo se queda creado.
     */
    function deshacerInscripcion(grupoId, inscripcionId, usuarioId, nombre) {
      llamar('api_deshacerAlta', inscripcionId).then(function () {
        anticuar('inscripciones');
        aviso('Inscripción deshecha: ' + nombreVisible(nombre));
        const grupo = app.grupo;
        if (grupo && grupo.grupo.grupo_id === grupoId) {
          // Recién inscrito, puede ir aún sin inscripcion_id (inscribir): se quita también por su ID.
          grupo.inscritos = grupo.inscritos.filter(function (u) {
            return u.inscripcion_id !== inscripcionId && !(u.usuario_id === usuarioId && !u.inscripcion_id);
          });
          if (app.vista === 'grupo') {
            $('barraSub').textContent = subGrupo(grupo);
            if (app.pestana === 'lista' && $('zonaLista')) {
              const fila = $('zonaLista').querySelector('[data-inscripcion="' + inscripcionId + '"]');
              sacarFila(fila, function () {
                if (app.grupo && app.vista === 'grupo' && app.pestana === 'lista' && $('zonaLista')) $('zonaLista').outerHTML = htmlLista(app.grupo);
              });
            } else if (app.pestana === 'alta') {
              buscar();
            }
          }
        }
        refrescarGrupo(grupoId);
        precargar();
      }).catch(avisoError);
    }

    /** Nombre de una inscripción: del pase de lista abierto o de Altas y bajas. */
    function nombreInscripcion(inscripcionId) {
      const lista = app.vista === 'pase' && app.pase ? app.pase.usuarios : (app.grupo ? app.grupo.inscritos : []);
      const u = lista.find(function (x) { return x.inscripcion_id === inscripcionId; });
      return u ? u.nombre : '';
    }

    function pedirBaja() {
      const insc = valor('bajaUsuario');
      const fecha = valor('fechaBaja');
      const motivo = elegido('motivoBaja');
      if (!insc) return errorCampo('bajaUsuario', 'Elige primero el usuario.');
      if (!fecha) return errorCampo('fechaBaja', 'Indica el último día en el grupo.');
      if (!motivo) return errorCampo('motivoBaja', 'Elige el motivo de la baja.');
      // Sin segunda confirmación (4-nov-2026): el aviso ofrece «Deshacer».
      const nombre = nombreInscripcion(insc);
      const pase = app.vista === 'pase' ? app.pase : null;
      const grupoId = pase || !app.grupo ? '' : app.grupo.grupo.grupo_id;
      // El usuario del pase, para devolverlo a su fila con sus marcas si se deshace.
      const delPase = pase ? pase.usuarios.find(function (u) { return u.inscripcion_id === insc; }) : null;
      accionGrupo(llamar('api_baja', insc, fecha, motivo), 'Baja hecha: ' + nombreVisible(nombre), insc, fecha, function () {
        deshacerBaja(insc, nombre, pase, delPase, grupoId);
      });
    }

    /** «Deshacer» tras una baja: el servidor quita la fecha de baja y el usuario vuelve a la lista (o al pase). */
    function deshacerBaja(insc, nombre, pase, delPase, grupoId) {
      llamar('api_deshacerBaja', insc).then(function () {
        anticuar('inscripciones');
        aviso('Baja deshecha: ' + nombreVisible(nombre));
        if (pase && delPase) devolverAlPase(pase, delPase);
        if (grupoId) {
          const grupo = app.grupo;
          const u = grupo && grupo.grupo.grupo_id === grupoId ? grupo.inscritos.find(function (x) { return x.inscripcion_id === insc; }) : null;
          if (u) u.fecha_baja = '';
          if (app.vista === 'grupo' && grupo && grupo.grupo.grupo_id === grupoId) {
            if (app.pestana === 'lista' && $('zonaLista')) {
              if (u) $('zonaLista').outerHTML = htmlLista(grupo);
            } else {
              const y = window.scrollY;
              pintarGrupo();
              window.scrollTo(0, y);
            }
          }
          // Si salió de la lista, vuelve con la lista del servidor (con su animación de llegada).
          refrescarGrupo(grupoId);
        }
        precargar();
      }).catch(avisoError);
    }

    /** Devuelve al pase de lista a un usuario que se había quitado al darle de baja, con las marcas que tenía. */
    function devolverAlPase(pase, u) {
      const ya = pase.usuarios.find(function (x) { return x.inscripcion_id === u.inscripcion_id; });
      if (ya) { ya.fecha_baja = ''; return; }
      u.fecha_baja = '';
      pase.usuarios.push(u);
      pase.usuarios.sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });
      if (app.pase !== pase || app.vista !== 'pase') return;
      guardarBorrador();
      if (!$('listaUsuarios')) { pintarPase(); return; }
      const i = pase.usuarios.indexOf(u);
      $('listaUsuarios').innerHTML = pase.usuarios.map(function (x, k) { return filaUsuario(x, k); }).join('');
      const fila = $('fila' + i);
      if (fila) fila.classList.add('entra');
      pintarPiePase();
    }

    function pedirCambio() {
      const insc = valor('bajaUsuario');
      const destino = elegido('grupoDestino');
      const fecha = valor('fechaCambio');
      if (!insc) return errorCampo('bajaUsuario', 'Elige primero el usuario.');
      if (!destino) return errorCampo('grupoDestino', 'Elige el grupo nuevo.');
      if (!fecha) return errorCampo('fechaCambio', 'Indica el primer día en el grupo nuevo.');
      const g = app.grupo.destinos.find(function (x) { return x.grupo_id === destino; });
      confirmar('¿Cambiar de grupo?', '<strong>' + esc(nombreVisible(nombreInscripcion(insc))) + '</strong><br>Pasa a: ' +
        esc(g ? tallerYGrupo(g.taller, g.nombre) : destino) + '<br>Desde el ' + esc(fechaNumerica(fecha)), 'Sí, cambiar', false, function () {
        // El último día en el grupo de origen es el anterior al cambio (regla 8).
        accionGrupo(llamar('api_cambiarGrupo', insc, destino, fecha), 'Cambio de grupo hecho: ' + nombreVisible(nombreInscripcion(insc)), insc, sumarDias(fecha, -1));
      }, 'Cambiando de grupo…');
    }

    /**
     * Tras una baja o un cambio de grupo (insc, con ultimoDia como último día en el grupo): el panel se cierra en
     * cuanto responde el servidor y la lista se cambia en el sitio, en el pase de lista (conservando sus marcas)
     * o en Altas y bajas. alDeshacer (opcional): el aviso ofrece «Deshacer».
     */
    function accionGrupo(promesa, mensaje, insc, ultimoDia, alDeshacer) {
      const pase = app.vista === 'pase' ? app.pase : null;
      const grupoId = pase || !app.grupo ? '' : app.grupo.grupo.grupo_id;
      promesa.then(function () {
        anticuar('inscripciones');
        cerrarPanel();
        if (alDeshacer) avisoDeshacer(mensaje, alDeshacer);
        else aviso(mensaje);
        if (pase) quitarDelPase(pase, insc, ultimoDia);
        else if (grupoId) quitarDelGrupo(grupoId, insc, ultimoDia);
        precargar();
      }).catch(function (e) { cerrarPanel(); avisoError(e); });
    }

    // ---------- Historial ----------

    function irHistorial() {
      pantallaPrincipal('historial', 'Historial', 'Asistencia por grupo y mes');
      const grupos = app.init.grupos;
      if (!grupos.length) { pintar('<p class="vacio">No tienes grupos todavía.</p>'); return; }
      if (!app.hist.mes) app.hist.mes = app.init.hoy.substring(0, 7);
      if (!grupos.some(function (g) { return g.grupo_id === app.hist.grupo_id; })) app.hist.grupo_id = grupoInicialHistorial(app.hist.mes);
      cargarHistorial();
    }

    /**
     * Grupo que abre el Historial la primera vez: el primero con usuarios en el mes (si su cuadrícula ya está en
     * memoria) y, si no se sabe, el primero de Inicio con alguien inscrito (Hoy, por hora; luego los pendientes).
     * Así no se abre un grupo vacío (Costura) por ir primero por orden alfabético.
     */
    function grupoInicialHistorial(mes) {
      const grupos = app.init.grupos;
      const existe = function (id) { return grupos.some(function (g) { return g.grupo_id === id; }); };
      for (let k = 0; k < grupos.length; k++) {
        const e = memoria[claveMemoria('api_historial', [grupos[k].grupo_id, mes])];
        if (e && e.listo && e.datos.filas.length && e.datos.columnas.length) return grupos[k].grupo_id;
      }
      const d = app.ultimoInicio;
      if (d) {
        const hoy = d.grupos.filter(function (g) { return g.inscritos > 0 && existe(g.grupo_id); });
        if (hoy.length) return hoy[0].grupo_id;
        const pend = d.pendientes.filter(function (p) { return existe(p.grupo_id); });
        if (pend.length) return pend[0].grupo_id;
      }
      return grupos[0].grupo_id;
    }

    /**
     * Pide la cuadrícula del grupo y mes elegidos. Si no está en memoria, se pinta al momento la cabecera nueva
     * (grupo y mes) con la cuadrícula vacía, para no enseñar los datos del grupo o mes anterior mientras llega.
     */
    function cargarHistorial() {
      const grupoId = app.hist.grupo_id;
      const mes = app.hist.mes;
      const sigue = function () { return app.vista === 'historial' && app.hist.grupo_id === grupoId && app.hist.mes === mes; };
      if (!estaEnMemoria('api_historial', [grupoId, mes])) pintarHistorial(null);
      pedir('api_historial', grupoId, mes).then(function (d) {
        if (sigue()) pintarHistorial(d);
      }).catch(function (e) { if (sigue()) pintarHistorial(null, e); });
    }

    /** Nombre del grupo elegido en el Historial. */
    function nombreGrupoHistorial() {
      const g = app.init.grupos.find(function (x) { return x.grupo_id === app.hist.grupo_id; });
      return g ? tallerYGrupo(g.taller, g.nombre) : 'Sin grupos';
    }

    /** Panel del botón del grupo del Historial: los grupos de la monitora, con sus días y hora. */
    function abrirPanelGrupoHistorial() {
      abrirPanel('<div><h3>Grupo</h3><div class="menu-opciones">' + app.init.grupos.map(function (g) {
        const elegido = g.grupo_id === app.hist.grupo_id;
        return '<button type="button" class="opcion-menu' + (elegido ? ' elegida' : '') + '" data-accion="grupo-hist" data-grupo="' + esc(g.grupo_id) + '"' +
          (elegido ? ' aria-current="true"' : '') + '>' + ICONO_TALLER + '<span class="opcion-texto">' + esc(tallerYGrupo(g.taller, g.nombre)) +
          (horario(g) ? '<small>' + esc(horario(g)) + '</small>' : '') + '</span>' + (elegido ? ICONO_ELEGIDO : '') + '</button>';
      }).join('') + '</div></div>', true);
    }

    /** Flechas y deslizar del Historial: un mes antes o después, sin pasar del mes actual. Devuelve si ha cambiado. */
    function saltarMes(n) {
      const mes = sumarMes(app.hist.mes, n);
      if (mes > app.init.hoy.substring(0, 7)) return false;
      app.hist.mes = mes;
      app.animDeslizar = n > 0 ? 'siguiente' : 'anterior';
      cargarHistorial();
      return true;
    }

    function elegirGrupoHistorial(grupoId) {
      cerrarPanel();
      if (grupoId === app.hist.grupo_id) return;
      app.hist.grupo_id = grupoId;
      cargarHistorial();
    }

    /** Nivel de un % de asistencia: 'alto' desde el 75 %, 'medio' desde el 50 % y 'bajo' por debajo. */
    function nivelPorcentaje(p) {
      const n = Math.round(p);
      return n >= 75 ? 'alto' : n >= 50 ? 'medio' : 'bajo';
    }

    /** % de asistencia con una barrita debajo: verde desde el 75 %, ámbar desde el 50 % y roja por debajo. */
    function barraPorcentaje(p) {
      if (p === null || p === undefined) return '—';
      const n = Math.round(p);
      const nivel = nivelPorcentaje(p);
      return n + '<span class="pct-barra ' + nivel + '"><span style="width:' + Math.max(0, Math.min(100, n)) + '%"></span></span>';
    }

    /** d: datos de api_historial; sin datos, la cabecera con la cuadrícula vacía (cargando) o el error de carga. */
    function pintarHistorial(d, error) {
      const mesActual = app.init.hoy.substring(0, 7);
      // El grupo, como el periodo y el taller del Informe: una pastilla que abre un panel (5-nov-2026; antes, un desplegable).
      const nombreGrupo = nombreGrupoHistorial();
      let html = '<div class="filtros-informe"><button type="button" class="boton boton-periodo" data-accion="abrir-grupo-hist"' +
        ' aria-label="Grupo: ' + esc(nombreGrupo) + '. Cambiar el grupo">' + ICONO_TALLER +
        '<span class="texto-filtro">' + esc(nombreGrupo) + '</span><span class="flecha-abajo" aria-hidden="true"></span></button></div>' +
        '<div class="selector-mes"><button type="button" class="flecha-redonda" data-accion="mes" data-salto="-1" aria-label="Mes anterior">' + ICONO_ANTERIOR + '</button>' +
        '<strong>' + esc(nombreMes(app.hist.mes)) + '</strong>' +
        '<button type="button" class="flecha-redonda" data-accion="mes" data-salto="1" aria-label="Mes siguiente"' +
        (app.hist.mes >= mesActual ? ' disabled' : '') + '>' + ICONO_SIGUIENTE + '</button></div>';
      if (!d) {
        if (error) { app.reintentar = cargarHistorial; pintar(html + htmlError(error)); }
        else pintar(html + esqueleto('historial'), true);
        return;
      }

      const r = d.resumen;
      const cuantas = function (n, una, varias) { return n + ' ' + (n === 1 ? una : varias); };
      html += '<div class="resumen-mes"><div class="cifra-mes"><strong>' + cifraQueSube(r.porcentaje, true) + '</strong>' +
        '<span>de asistencia en el mes</span></div>';
      html += '<div class="resumen-chips">' +
        '<span class="etiqueta realizada">' + cuantas(r.realizadas, 'hecha', 'hechas') + '</span>' +
        (r.canceladas ? '<span class="etiqueta cancelada">' + r.canceladas + ' sin clase</span>' : '') +
        (r.pendientes ? '<span class="etiqueta pendiente">' + r.pendientes + ' sin pasar lista</span>' : '') +
        (r.especiales ? '<span class="etiqueta especial">' + cuantas(r.especiales, 'día libre', 'días libres') + '</span>' : '') +
        '</div></div>';
      const claveCifras = 'hist|' + app.hist.grupo_id + '|' + app.hist.mes;

      if (!d.columnas.length) {
        html += '<p class="vacio">No hay clases en este mes.</p>';
        pintar(html);
        animarCifras(claveCifras);
        return;
      }
      if (!d.filas.length) {
        // Grupo sin nadie inscrito en el mes: el mismo estado vacío que el pase de lista, con «Inscribir usuarios».
        html += '<div class="estado-vacio">' + ICONO_SIN_USUARIOS +
          '<h2>Sin usuarios</h2><p>Este grupo no tuvo a nadie inscrito en ' + esc(nombreMes(app.hist.mes)) + '.</p>' +
          '<button type="button" class="boton primario" data-accion="hist-inscribir">Inscribir usuarios</button></div>';
        pintar(html);
        animarCifras(claveCifras);
        return;
      }

      const claseColumna = function (c) {
        return c.estado === 'realizada' ? '' : ' col-' + c.estado;
      };
      html += '<p class="ayuda">Toca un día para abrir o corregir su pase de lista.</p>';
      html += '<div class="tabla-scroll marco-historial"><table class="historial"><thead><tr><th class="fija">Usuario</th>';
      d.columnas.forEach(function (c) {
        const dia = aFecha(c.fecha);
        const titulo = c.estado === 'cancelada' ? 'Sin clase' + (c.nota ? ': ' + c.nota : '')
          : c.estado === 'especial' ? (c.especial.tipo || 'Día libre') + (c.especial.descripcion ? ': ' + c.especial.descripcion : '')
            : c.estado === 'pendiente' ? 'Sin pasar lista' : 'Hecha';
        html += '<th class="dia' + claseColumna(c) + '" data-accion="pase-historial" data-fecha="' + esc(c.fecha) + '" title="' + esc(titulo) + '">' +
          LETRAS_DIAS[dia.getDay()] + '<br>' + dia.getDate() + '</th>';
      });
      html += '<th class="pct">%</th></tr></thead><tbody>';
      d.filas.forEach(function (f) {
        html += '<tr><th class="fija nombre-hist"' + (esAdmin() ? ' data-accion="ficha" data-usuario="' + esc(f.usuario_id) + '" data-nombre="' + esc(f.nombre) + '"' : '') + '>' +
          esc(nombreVisible(f.nombre)) + (esAdmin() ? '<span class="abre-ficha" aria-hidden="true">›</span>' : '') + '</th>';
        f.celdas.forEach(function (codigo, i) {
          const c = d.columnas[i];
          if (codigo === '-') { html += '<td class="no-inscrito" title="No estaba en el grupo">·</td>'; return; }
          if (!codigo) {
            // Sin clase: una raya (antes «C», de «Cancelada»), como en la leyenda.
            html += '<td class="' + claseColumna(c).trim() + '"' + (c.estado === 'cancelada' ? ' title="Sin clase">–' : '>') + '</td>';
            return;
          }
          const e = estadoInfo(codigo, d.estados);
          html += '<td><span class="celda" style="' + estiloColor(e.color) + '" title="' + esc(e.etiqueta) + '">' + esc(e.letra) + '</span></td>';
        });
        html += '<td class="pct">' + barraPorcentaje(f.porcentaje) + '</td></tr>';
      });
      html += '</tbody><tfoot><tr><th class="fija">Asistieron</th>';
      d.columnas.forEach(function (c) {
        html += '<td>' + (c.estado === 'realizada' ? c.presentes : '') + '</td>';
      });
      html += '<td></td></tr></tfoot></table></div>';

      html += '<div class="leyenda">' + d.estados.filter(function (e) { return e.activo; }).map(function (e) {
        return '<span><span class="celda" style="' + estiloColor(e.color) + '">' + esc(e.letra) + '</span> ' + esc(e.etiqueta) + '</span>';
      }).join('') +
        '<span><span class="celda muestra col-cancelada">–</span> Sin clase</span>' +
        '<span><span class="celda muestra col-pendiente"></span> Sin pasar lista</span>' +
        '<span><span class="celda muestra col-especial"></span> Día libre</span>' +
        '<span><span class="celda muestra no-inscrito">·</span> No estaba en el grupo</span></div>';
      pintar(html);
      animarCifras(claveCifras);
    }

    // ---------- Informe ----------

    function talleresDeMisGrupos() {
      const vistos = {};
      return app.init.grupos.filter(function (g) {
        if (vistos[g.taller_id]) return false;
        vistos[g.taller_id] = true;
        return true;
      }).map(function (g) { return { taller_id: g.taller_id, taller: g.taller }; });
    }

    const ICONO_TALLER = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>';

    /** Nombre del taller elegido en el Informe, o «Todos los talleres». */
    function nombreTallerInforme() {
      const t = talleresDeMisGrupos().find(function (x) { return x.taller_id === app.inf.taller_id; });
      return t ? t.taller : 'Todos los talleres';
    }

    /** Panel del botón del taller: «Todos los talleres» y cada taller de los grupos de la monitora. */
    function abrirPanelTaller() {
      const lista = [{ taller_id: '', taller: 'Todos los talleres' }].concat(talleresDeMisGrupos());
      abrirPanel('<div><h3>Taller del informe</h3><div class="menu-opciones">' + lista.map(function (t) {
        const elegido = t.taller_id === app.inf.taller_id;
        return '<button type="button" class="opcion-menu' + (elegido ? ' elegida' : '') + '" data-accion="taller-informe" data-taller="' + esc(t.taller_id) + '"' +
          (elegido ? ' aria-current="true"' : '') + '>' + ICONO_TALLER + '<span class="opcion-texto">' + esc(t.taller) + '</span>' + (elegido ? ICONO_ELEGIDO : '') + '</button>';
      }).join('') + '</div></div>', true);
    }

    function elegirTallerInforme(tallerId) {
      cerrarPanel();
      if (tallerId === app.inf.taller_id) return;
      app.inf.taller_id = tallerId;
      cargarInforme();

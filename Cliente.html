    function irInforme() {
      pantallaPrincipal('informe', 'Informe', 'Datos para la memoria');
      const inf = app.inf;
      const p = periodoInforme();
      if (!inf.desde) inf.desde = p.desde;
      if (!inf.hasta) inf.hasta = p.hasta;
      inf.datos = null;
      cargarInforme();
    }

    /** «1 sep – 4 nov» (con el año si las dos fechas son de años distintos). */
    function textoPeriodo(desde, hasta) {
      const corto = function (t, conAnio) {
        const d = aFecha(t);
        return d.getDate() + ' ' + MESES[d.getMonth()].substring(0, 3) + (conAnio ? ' ' + d.getFullYear() : '');
      };
      const anios = desde.substring(0, 4) !== hasta.substring(0, 4);
      return desde === hasta ? corto(desde, false) : corto(desde, anios) + ' – ' + corto(hasta, anios);
    }

    /**
     * Periodos rápidos del Informe, hasta hoy y sin empezar antes del curso: el curso, el trimestre del curso
     * (sep–dic, ene–mar y abr–ago) y el mes.
     */
    function periodosInforme() {
      const hoy = app.init.hoy;
      const curso = periodoInforme();
      const desdeCurso = function (t) { return t < curso.desde ? curso.desde : t; };
      const anio = hoy.substring(0, 4);
      const mes = Number(hoy.substring(5, 7));
      const inicioTrimestre = mes >= 9 ? anio + '-09-01' : mes >= 4 ? anio + '-04-01' : anio + '-01-01';
      return [
        { texto: 'Este curso', desde: curso.desde, hasta: hoy },
        { texto: 'Este trimestre', desde: desdeCurso(inicioTrimestre), hasta: hoy },
        { texto: 'Este mes', desde: desdeCurso(hoy.substring(0, 8) + '01'), hasta: hoy }
      ];
    }

    /** Panel del botón del periodo: los periodos rápidos y, debajo, las fechas a mano. */
    function abrirPanelPeriodo() {
      const inf = app.inf;
      let marcado = false;   // si dos periodos coinciden (en el primer trimestre, curso y trimestre), se marca el primero
      const html = '<div><h3>Periodo del informe</h3><div class="menu-opciones">' +
        periodosInforme().map(function (p) {
          const elegido = !marcado && p.desde === inf.desde && p.hasta === inf.hasta;
          if (elegido) marcado = true;
          return '<button type="button" class="opcion-menu' + (elegido ? ' elegida' : '') + '" data-accion="periodo" data-desde="' + esc(p.desde) +
            '" data-hasta="' + esc(p.hasta) + '"' + (elegido ? ' aria-current="true"' : '') + '>' + ICONO_PERIODO +
            '<span class="opcion-texto">' + esc(p.texto) + '<small>' + esc(textoPeriodo(p.desde, p.hasta)) + '</small></span>' +
            (elegido ? ICONO_ELEGIDO : '') + '</button>';
        }).join('') + '</div>' +
        '<h4 class="subtitulo-panel">Otras fechas</h4><div class="fila-campos">' +
        '<div class="campo"><label for="infDesde">Desde</label><input type="date" id="infDesde" value="' + esc(inf.desde) + '" max="' + esc(app.init.hoy) + '"></div>' +
        '<div class="campo"><label for="infHasta">Hasta</label><input type="date" id="infHasta" value="' + esc(inf.hasta) + '" max="' + esc(app.init.hoy) + '"></div></div>' +
        '<button type="button" class="boton primario ancho" data-accion="ver-informe">Ver estas fechas</button></div>';
      abrirPanel(html, true);
    }

    /** Cambia el periodo del informe y lo carga (al momento si ya está en memoria). */
    function elegirPeriodo(desde, hasta) {
      const inf = app.inf;
      cerrarPanel();
      if (desde === inf.desde && hasta === inf.hasta) return;
      inf.desde = desde;
      inf.hasta = hasta;
      cargarInforme();
    }

    function pintarInforme() {
      const inf = app.inf;
      const periodo = textoPeriodo(inf.desde, inf.hasta);
      let html = '<div class="filtros-informe">' +
        '<button type="button" class="boton boton-periodo" data-accion="abrir-periodo" aria-label="Periodo: ' + esc(periodo) + '. Cambiar el periodo">' +
        ICONO_PERIODO + '<span>' + esc(periodo) + '</span><span class="flecha-abajo" aria-hidden="true"></span></button>' +
        // El taller, como el periodo: un botón que abre un panel con las opciones (4-nov-2026; antes, un desplegable).
        '<button type="button" class="boton boton-periodo" data-accion="abrir-taller" aria-label="Taller: ' + esc(nombreTallerInforme()) + '. Cambiar el taller">' +
        ICONO_TALLER + '<span class="texto-filtro">' + esc(nombreTallerInforme()) + '</span><span class="flecha-abajo" aria-hidden="true"></span></button></div>';

      const d = inf.datos;
      if (d) {
        const t = d.total;
        const altas = d.altasBajas.reduce(function (s, m) { return s + m.altas; }, 0);
        const bajas = d.altasBajas.reduce(function (s, m) { return s + m.bajas; }, 0);
        // El % primero y más grande, en verde, ámbar o rojo según el nivel (5-nov-2026); el resto, en el color del texto.
        const hayPct = t.porcentaje !== null && t.porcentaje !== undefined;
        html += '<div class="kpis">' +
          '<div class="kpi kpi-destacado' + (hayPct ? ' nivel-' + nivelPorcentaje(t.porcentaje) : '') + '"><div class="kpi-valor">' + cifraQueSube(t.porcentaje, true) +
          '<button type="button" class="info-kpi" data-accion="info-porcentaje" aria-label="Cómo se calcula el % de asistencia">' + ICONO_INFO + '</button></div>' +
          '<div class="kpi-texto">de asistencia</div>' +
          (hayPct ? '<span class="pct-barra ' + nivelPorcentaje(t.porcentaje) + '"><span style="width:' + Math.max(0, Math.min(100, Math.round(t.porcentaje))) + '%"></span></span>' : '') +
          '</div>' +
          kpi(cifraQueSube(t.usuarios), 'usuarios distintos atendidos') + kpi(cifraQueSube(t.realizadas), 'clases hechas') +
          kpi(cifraQueSube(t.canceladas), 'sin clase') + kpi(cifraQueSube(altas) + ' / ' + cifraQueSube(bajas), 'altas / bajas') + '</div>';

        {   // también las monitoras, con sus grupos (6-nov-2026)
          html += '<div class="bloque exportar"><div class="exportar-texto"><h3>Exportar datos</h3>' +
            '<p>Descargar en PDF y hoja de cálculo</p></div>' +
            '<button type="button" class="boton primario" data-accion="abrir-exportar">' + ICONO_DESCARGAR + 'Exportar</button></div>';
        }

        html += tarjetasInforme('Por taller', d.porTaller, function (r) { return [r.taller, '']; }, 'taller');
        html += tarjetasInforme('Por grupo', d.porGrupo, function (r) { return [r.grupo, tallerSiHaceFalta(r.taller, r.grupo)]; }, 'grupo');
        html += tabla('Por mes', ['Mes'], d.porMes, function (r) { return [nombreMesCorto(r.mes)]; }, 'mes');

        html += tituloInforme('Registros por estado', 'estado');
        html += d.porEstado.length ? '<div class="tabla-scroll"><table class="datos"><thead><tr><th class="texto">Estado</th><th>Registros</th></tr></thead><tbody>' +
          d.porEstado.map(function (e) {
            return '<tr><td class="texto"><span class="celda" style="' + estiloColor(e.color) + '"></span> ' + esc(e.etiqueta) + '</td><td>' + e.registros + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<p class="vacio">Sin registros.</p>';

        html += tituloInforme('Altas y bajas por mes', 'altas');
        html += d.altasBajas.length ? '<div class="tabla-scroll"><table class="datos"><thead><tr><th class="texto">Mes</th><th>Altas</th><th>Bajas</th></tr></thead><tbody>' +
          d.altasBajas.map(function (m) { return '<tr><td class="texto">' + esc(nombreMesCorto(m.mes)) + '</td><td>' + m.altas + '</td><td>' + m.bajas + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<p class="vacio">No hay altas ni bajas en este periodo.</p>';

        if (d.motivosBaja.length) {
          html += tituloInforme('Motivos de baja', 'motivos') + '<div class="tabla-scroll"><table class="datos"><thead><tr><th class="texto">Motivo</th><th>Bajas</th></tr></thead><tbody>' +
            d.motivosBaja.map(function (m) { return '<tr><td class="texto">' + esc(m.motivo) + '</td><td>' + m.bajas + '</td></tr>'; }).join('') +
            '</tbody></table></div>';
        }
      } else if (inf.error) {
        app.reintentar = cargarInforme;
        html += htmlError(inf.error);
      } else {
        html += esqueleto('informe');
      }
      pintar(html, !d && !inf.error);
      if (d) animarCifras('inf|' + inf.desde + '|' + inf.hasta + '|' + inf.taller_id);
    }

    /** Cifra del informe. valorHtml: ya escapado (cifraQueSube). extra: HTML que va junto a la cifra. */
    function kpi(valorHtml, texto, extra) {
      return '<div class="kpi"><div class="kpi-valor"><span>' + valorHtml + '</span>' + (extra || '') + '</div><div class="kpi-texto">' + esc(texto) + '</div></div>';
    }

    // ---------- Cifras que suben (5-nov-2026) ----------
    // Las cifras del Informe y la del Historial suben de 0 a su valor en MS_CIFRAS y la barra del % se llena, solo
    // la primera vez que se pinta cada dato (clave: pantalla, periodo o mes, grupo o taller). Sin animación si el
    // sistema pide reducir el movimiento. Siempre en formato español («80,7 %»).

    const MS_CIFRAS = 400;
    const cifrasVistas = {};

    /** Número (o % con pct) con lo necesario para animarlo; sin valor, «—». */
    function cifraQueSube(v, pct) {
      if (v === null || v === undefined || v === '' || isNaN(Number(v))) return esc(pct ? porcentaje(v) : v);
      const decimales = (String(v).split('.')[1] || '').length;
      return '<span class="cifra-sube" data-valor="' + Number(v) + '" data-decimales="' + decimales + '"' + (pct ? ' data-pct="1"' : '') + '>' +
        esc(pct ? porcentaje(v) : String(v)) + '</span>';
    }
    function textoCifra(n, decimales, pct) {
      const t = n.toFixed(decimales).replace('.', ',');
      return pct ? t + ' %' : t;
    }

    function animarCifras(clave) {
      if (cifrasVistas[clave]) return;
      cifrasVistas[clave] = true;
      if (sinMovimiento && sinMovimiento.matches) return;
      const cifras = Array.prototype.slice.call($('vista').querySelectorAll('.cifra-sube'));
      const barras = Array.prototype.slice.call($('vista').querySelectorAll('.kpi-destacado .pct-barra > span'));
      if (!cifras.length && !barras.length) return;
      const datos = cifras.map(function (el) {
        return { el: el, valor: Number(el.getAttribute('data-valor')), dec: Number(el.getAttribute('data-decimales')) || 0,
          pct: el.hasAttribute('data-pct'), final: el.textContent };
      });
      // Mientras sube, el ancho no baila (tabular-nums en Estilos.html) y el lector de pantalla lee el valor final.
      datos.forEach(function (d) { d.el.setAttribute('aria-label', d.final); d.el.textContent = textoCifra(0, d.dec, d.pct); });
      barras.forEach(function (b) { b.setAttribute('data-ancho', b.style.width); b.style.width = '0%'; });
      const inicio = performance.now();
      const paso = function (ahora) {
        const t = Math.min(1, Math.max(0, (ahora - inicio) / MS_CIFRAS));
        const f = 1 - Math.pow(1 - t, 3);   // sale rápido y frena al final
        datos.forEach(function (d) {
          if (!d.el.isConnected) return;
          d.el.textContent = t < 1 ? textoCifra(d.valor * f, d.dec, d.pct) : d.final;
        });
        if (t < 1) requestAnimationFrame(paso);
      };
      requestAnimationFrame(function (ahora) {
        barras.forEach(function (b) { b.classList.add('llenando'); b.style.width = b.getAttribute('data-ancho'); });
        paso(ahora);
      });
      // Por si el navegador no da fotogramas (app en segundo plano): las cifras acaban siempre en su valor.
      setTimeout(function () {
        datos.forEach(function (d) { if (d.el.isConnected) d.el.textContent = d.final; });
        barras.forEach(function (b) { b.style.width = b.getAttribute('data-ancho'); });
      }, MS_CIFRAS + 200);
    }

    /** Panel del botón ⓘ del %: cómo se calcula. */
    function abrirInfoPorcentaje() {
      abrirPanel('<div><h3>% de asistencia</h3>' +
        '<p>Asistencias ÷ (asistencias + faltas).</p>' +
        '<p>Los estados que no cuentan (eventos, excursiones…) y los días sin clase no entran en el cálculo.</p>' +
        '<button type="button" class="boton ancho" data-accion="cerrar-panel">Entendido</button></div>');
    }

    /** Iconos de los títulos de sección del Informe (5-nov-2026). */
    const ICONOS_INFORME = {
      taller: '<path fill="currentColor" d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/>',
      grupo: '<path fill="currentColor" d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/>',
      mes: '<path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM7 12h5v5H7z"/>',
      estado: '<path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4 3.6 3.6 7.6-7.6L19 8z"/>',
      altas: '<path fill="currentColor" d="M6.99 11 3 15l3.99 4v-3H14v-2H6.99zM21 9l-3.99-4v3H10v2h7.01v3z"/>',
      motivos: '<path fill="currentColor" d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/>'
    };
    function tituloInforme(titulo, icono) {
      return '<h3 class="titulo-informe"><span class="icono-titulo"><svg viewBox="0 0 24 24" aria-hidden="true">' +
        (ICONOS_INFORME[icono] || '') + '</svg></span>' + esc(titulo) + '</h3>';
    }

    function tabla(titulo, primeras, filas, celdasIniciales, icono) {
      if (!filas.length) return tituloInforme(titulo, icono) + '<p class="vacio">Sin datos en este periodo.</p>';
      return tituloInforme(titulo, icono) + '<div class="tabla-scroll"><table class="datos"><thead><tr>' +
        primeras.map(function (p) { return '<th class="texto">' + esc(p) + '</th>'; }).join('') +
        '<th>Sesiones</th><th>Sin clase</th><th>Asistencias</th><th>Faltas</th><th>Otros</th><th>% asist.</th><th>Usuarios</th></tr></thead><tbody>' +
        filas.map(function (r) {
          return '<tr>' + celdasIniciales(r).map(function (c) { return '<td class="texto">' + esc(c) + '</td>'; }).join('') +
            '<td>' + r.realizadas + '</td><td>' + r.canceladas + '</td><td>' + r.presentes + '</td><td>' + r.ausentes + '</td><td>' +
            r.neutros + '</td><td>' + porcentaje(r.porcentaje) + '</td><td>' + r.usuarios + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    /**
     * «Por taller» y «Por grupo» como tarjetas: el nombre arriba y tres cifras grandes (sesiones, % y usuarios).
     * Al tocar una, se despliega el desglose (sin clase, asistencias, faltas y otros). nombres(r): [nombre, detalle].
     */
    function tarjetasInforme(titulo, filas, nombres, icono) {
      if (!filas.length) return tituloInforme(titulo, icono) + '<p class="vacio">Sin datos en este periodo.</p>';
      const cifra = function (v, texto, clase) { return '<span class="cifra' + (clase ? ' ' + clase : '') + '"><strong>' + esc(v) + '</strong><span>' + esc(texto) + '</span></span>'; };
      const linea = function (texto, v) { return '<div><dt>' + esc(texto) + '</dt><dd>' + esc(v) + '</dd></div>'; };
      return tituloInforme(titulo, icono) + '<div class="lista">' + filas.map(function (r) {
        const n = nombres(r);
        return '<details class="tarjeta-informe"><summary>' +
          '<span class="ti-nombre">' + esc(n[0]) + (n[1] ? '<small>' + esc(n[1]) + '</small>' : '') + '</span>' +
          '<span class="ti-cifras">' + cifra(r.realizadas, r.realizadas === 1 ? 'sesión' : 'sesiones') +
          cifra(porcentaje(r.porcentaje), 'asistencia', r.porcentaje === null || r.porcentaje === undefined ? '' : 'nivel-' + nivelPorcentaje(r.porcentaje)) + cifra(r.usuarios, r.usuarios === 1 ? 'usuario' : 'usuarios') + '</span>' +
          '</summary><dl class="ti-desglose">' +
          linea('Sin clase', r.canceladas) + linea('Asistencias', r.presentes) + linea('Faltas', r.ausentes) + linea('Otros (no cuentan)', r.neutros) +
          '</dl></details>';
      }).join('') + '</div>';
    }

    /** «Ver estas fechas» del panel del periodo. */
    function verInforme() {
      const desde = valor('infDesde');
      const hasta = valor('infHasta');
      if (!desde) return errorCampo('infDesde', 'Indica la fecha inicial.');
      if (!hasta) return errorCampo('infHasta', 'Indica la fecha final.');
      if (hasta < desde) return errorCampo('infHasta', 'La fecha final es anterior a la inicial.');
      elegirPeriodo(desde, hasta);
    }

    /** Pide el informe del periodo y taller elegidos (al momento si ya está en memoria). */
    /**
     * Si no está en memoria, bajo los filtros sale al momento el esqueleto (no el informe anterior) hasta que
     * llega; si falla, el error con «Reintentar».
     */
    function cargarInforme() {
      const inf = app.inf;
      const args = [inf.desde, inf.hasta, inf.taller_id];
      const n = app.nav;
      const sigue = function () {
        return n === app.nav && app.vista === 'informe' && inf.desde === args[0] && inf.hasta === args[1] && inf.taller_id === args[2];
      };
      inf.error = null;
      if (!estaEnMemoria('api_informe', args)) { inf.datos = null; pintarInforme(); }
      pedirCon(true, 'api_informe', args).then(function (d) {
        if (!sigue()) return;
        inf.datos = d;
        pintarInforme();
      }).catch(function (e) {
        if (!sigue()) return;
        inf.error = e;
        pintarInforme();
      });
    }

    // --- Exportar (5-nov-2026): descargar en el aparato o enviar por correo, en PDF u hoja de cálculo ---

    const CLAVE_CORREO_INFORME = 'asistencia|correoInforme';
    const FORMATOS_INFORME = [
      { valor: 'pdf', texto: 'PDF', sub: 'Para leer, imprimir o adjuntar. Todas las tablas, sin el detalle de cada registro.' },
      { valor: 'xlsx', texto: 'Hoja de cálculo (Excel)', sub: 'Todas las tablas y el detalle de cada registro.' }
    ];

    function abrirPanelExportar() {
      const inf = app.inf;
      const formato = app.formatoInforme || 'pdf';
      const correo = leerBorradorTexto(CLAVE_CORREO_INFORME) || '';
      abrirPanel('<div><h3>Exportar el informe</h3>' +
        '<p class="ayuda">' + esc(textoPeriodo(inf.datos.desde, inf.datos.hasta)) + ' · ' + esc(nombreTallerInforme()) + '</p>' +
        opcionesRadio('exFormato', 'Formato', FORMATOS_INFORME, formato) +
        '<button type="button" class="boton primario ancho" data-accion="exportar-descargar">Descargar</button>' +
        '<h4 class="subtitulo-panel">O enviarlo por correo</h4>' +
        '<div class="campo"><label for="exCorreo">Correo</label><input type="email" id="exCorreo" inputmode="email" autocomplete="email" ' +
        'enterkeyhint="send" placeholder="nombre@gmail.com" value="' + esc(correo) + '"></div>' +
        '<button type="button" class="boton ancho" data-accion="exportar-correo">Enviar por correo</button></div>');

    function formatoElegido() {
      const f = elegido('exFormato') || 'pdf';
      app.formatoInforme = f;
      return f;
    }

    function descargarInforme() {
      const d = app.inf.datos;
      llamar('api_exportarInforme', d.desde, d.hasta, app.inf.taller_id, formatoElegido()).then(function (r) {
        cerrarPanel();
        guardarEnAparato(r);
        aviso('Informe descargado');
      }).catch(avisoError);
    }

    function enviarInforme() {
      const d = app.inf.datos;
      const correo = valor('exCorreo').trim().toLowerCase();
      if (!/^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(correo)) return errorCampo('exCorreo', 'Escribe un correo como nombre@gmail.com.');
      try { window.localStorage.setItem(CLAVE_CORREO_INFORME, correo); } catch (e) { /* se ignora */ }
      llamar('api_enviarInforme', d.desde, d.hasta, app.inf.taller_id, formatoElegido(), correo).then(function (r) {
        cerrarPanel();
        aviso('Informe enviado · ' + r.correo);
      }).catch(avisoError);
    }

    /** Descarga un archivo que llega del servidor como { nombre, tipo, base64 }. */
    function guardarEnAparato(r) {
      const bin = window.atob(r.base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: r.tipo }));
      const a = document.createElement('a');
      a.href = url;
      a.download = r.nombre;
      a.className = 'oculto';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }

        entrada('g-listas', 'listas', 'Listas', 'Motivos de baja, tipos de día libre y observaciones rápidas') +

        (window.PWA ? entrada('g-conexion', 'conexion', 'Conexión de la app', window.PWA.descripcion()) : '') + '</div>'

    function volverGestion() { irGestion(); }

    // --- Grupos ---

    /** Grupos por taller, cada taller en una lista agrupada; «Nuevo grupo» en el botón flotante. */
    function irGrupos() {
      pantallaSecundaria('g-grupos', 'Grupos y talleres', app.gest.grupos.length + ' grupos', volverGestion);
      let html = '';
      if (!app.gest.grupos.length) html += '<p class="vacio">Todavía no hay grupos. Crea el primero con «Nuevo grupo».</p>';
      let tallerActual = null;
      app.gest.grupos.forEach(function (g) {

          html += (tallerActual === null ? '' : '</div>') + '<h3 class="taller">' + esc(g.taller) + '</h3><div class="lista">';

          '<div class="tarjeta-detalle">' + esc([horario(g), g.inscritos + ' inscritos'].filter(Boolean).join(' · ')) + '</div></div>' +

    function formularioGrupo(grupoId) {
      const g = app.gest.grupos.find(function (x) { return x.grupo_id === grupoId; }) ||

      const dias = String(g.dias).split(',');
      pantallaSecundaria('g-grupo', nuevo ? 'Nuevo grupo' : g.nombre, nuevo ? '' : g.taller, irGrupos);
      let html = '<div class="bloque">' +
        '<div class="campo"><label for="gTaller">Taller</label><select id="gTaller">' +
        (nuevo ? '<option value="">— Elige el taller —</option>' : '') +

        '<option value="__nuevo__">+ Taller nuevo…</option></select></div>' +

        '<input type="text" id="gTallerNuevo" enterkeyhint="next" placeholder="Ej.: Pilates"></div>' +
        '<div class="campo"><label for="gNombre">Nombre del grupo</label><input type="text" id="gNombre" value="' + esc(g.nombre) + '" enterkeyhint="next" placeholder="Ej.: Yoga silla martes y jueves"></div>' +
        '<div class="campo"><span class="etiqueta-campo" id="et-gDias">Días de clase</span><div class="dias" id="gDias" role="group" aria-labelledby="et-gDias">' +
        ORDEN_DIAS.map(function (d) {
          return '<label class="dia"><input type="checkbox" name="gDia" value="' + d[0] + '"' + (dias.indexOf(d[0]) >= 0 ? ' checked' : '') +

    /**
     * Monitoras del grupo como casillas (6-nov-2026; antes, correos escritos a mano): las activas de Gestión ›
     * Monitoras y, si el grupo tiene alguna que ya no está o está desactivada, también, marcada.
     */
    function casillasMonitoras(actuales) {
      const marcadas = String(actuales || '').toLowerCase().split(/[,;\s]+/).filter(Boolean);
      const lista = app.gest.monitoras.filter(function (m) { return m.activa || marcadas.indexOf(m.email) >= 0; })
        .map(function (m) { return { email: m.email, texto: m.nombre || m.email, sub: m.email + (m.activa ? '' : ' · desactivada') }; });
      marcadas.forEach(function (c) {
        if (!lista.some(function (m) { return m.email === c; })) lista.push({ email: c, texto: c, sub: 'No está en Gestión › Monitoras' });
      });
      return '<div class="campo"><span class="etiqueta-campo" id="et-gMonitoras">Monitoras</span>' +
        '<div class="opciones-radio" id="gMonitoras" role="group" aria-labelledby="et-gMonitoras">' +
        lista.map(function (m) {
          return '<label class="opcion-radio"><input type="checkbox" name="gMonitora" value="' + esc(m.email) + '"' +
            (marcadas.indexOf(m.email) >= 0 ? ' checked' : '') + '><span class="opcion-texto">' + esc(m.texto) +
            '<small>' + esc(m.sub) + '</small></span></label>';
        }).join('') + '</div>' +
        '<p class="ayuda">Si hay varias (por ejemplo, una sustituta), marca todas. Se dan de alta en Gestión › Monitoras.</p></div>';
    }

    function guardarGrupo(grupoId) {
      const taller = valor('gTaller');
      const datos = {
        grupo_id: grupoId,
        taller_id: taller === '__nuevo__' ? '' : taller,
        taller_nuevo: taller === '__nuevo__' ? valor('gTallerNuevo') : '',
        nombre: valor('gNombre'),
        dias: Array.prototype.map.call(document.querySelectorAll('input[name="gDia"]:checked'), function (c) { return c.value; }),
        hora: valor('gHora'),
        monitoras: Array.prototype.map.call(document.querySelectorAll('input[name="gMonitora"]:checked'), function (c) { return c.value; }).join(','),
        activo: grupoId ? marcado('gActivo') : true
      };
      if (!taller) return errorCampo('gTaller', 'Elige el taller del grupo.');
      if (taller === '__nuevo__' && !datos.taller_nuevo) return errorCampo('gTallerNuevo', 'Escribe el nombre del taller nuevo.');
      if (!datos.nombre) return errorCampo('gNombre', 'Escribe el nombre del grupo.');
      if (!datos.dias.length) return errorCampo('gDias', 'Elige al menos un día de clase.');
      if (!datos.monitoras) return errorCampo('gMonitoras', 'Elige al menos una monitora.');
      llamar('api_guardarGrupo', datos).then(function () {
        aviso(grupoId ? 'Grupo guardado.' : 'Grupo creado.');
        return recargarDatos('gestion');
      }).then(siSigue(irGrupos)).catch(avisoError);
    }

      pantallaSecundaria('g-usuarios', 'Usuarios', app.gest.totalUsuarios + ' en la base de datos', volverGestion);

    function buscarUsuariosGestion() {
      const caja = $('gBuscarUsuario');
      if (!caja) return;
      app.usuarios.texto = caja.value.trim();
      const numero = ++app.busqueda;
      pedirCon(false, 'api_usuariosGestion', [app.usuarios.texto]).then(function (r) {
        if (numero !== app.busqueda || !$('gListaUsuarios')) return;
        $('gListaUsuarios').innerHTML = (r.encontrados > r.usuarios.length
          ? '<p class="ayuda">Se muestran ' + r.usuarios.length + ' de ' + r.encontrados + '. Escribe para afinar la búsqueda.</p>' : '') +
          (r.usuarios.length ? '<div class="lista">' + r.usuarios.map(function (u) {
            return filaPersona({ nombre: u.nombre, boton: true, clase: u.activo ? '' : 'inactiva',
              atributos: ' data-accion="ficha" data-usuario="' + esc(u.usuario_id) + '" data-nombre="' + esc(u.nombre) + '"',
              detalle: 'ID ' + esc(u.usuario_id) + (u.telefono ? ' · ' + esc(u.telefono) : '') + ' · ' +
                (u.grupos ? u.grupos + (u.grupos === 1 ? ' grupo' : ' grupos') : 'sin grupo'),
              derecha: (u.activo ? '' : '<span class="etiqueta cancelada">Inactivo</span>') + FLECHA });
          }).join('') + '</div>' : '<p class="vacio">No se ha encontrado a nadie.</p>');
      }).catch(function (e) { if ($('gListaUsuarios')) $('gListaUsuarios').innerHTML = '<p class="vacio">' + esc(e.message) + '</p>'; });
    }

    function formularioUsuarioNuevo() {
      pantallaSecundaria('g-usuario-nuevo', 'Nuevo usuario', '', irUsuarios);
      pintar('<div class="bloque">' +
        '<div class="campo"><label for="uId">ID del centro</label><input type="text" id="uId" autocomplete="off" inputmode="numeric" enterkeyhint="next"></div>' +
        '<div class="campo"><label for="uNombre">Apellidos y nombre</label><input type="text" id="uNombre" autocomplete="off" autocapitalize="characters" enterkeyhint="next" placeholder="APELLIDO APELLIDO NOMBRE">' +
        '<p class="ayuda">Sin comas, sin diminutivos. Se guarda en mayúsculas.</p></div>' +
        '<div class="campo"><label for="uTelefono">Teléfono (opcional)</label><input type="tel" id="uTelefono" autocomplete="off" inputmode="tel" enterkeyhint="done"></div>' +
        '<button type="button" class="boton primario ancho" data-accion="g-crear-usuario">Crear usuario</button></div>');

    function crearUsuario(aunqueParecido) {
      const sigue = siSiguePara();
      const datos = { usuario_id: valor('uId'), nombre: valor('uNombre'), telefono: valor('uTelefono'), crear_aunque_parecido: !!aunqueParecido };
      if (!datos.usuario_id) return errorCampo('uId', 'Escribe el ID del centro.');
      if (!datos.nombre) return errorCampo('uNombre', 'Escribe los apellidos y el nombre.');
      llamar('api_guardarUsuario', datos, true).then(function (r) {
        if (r.parecidos) {
          avisarParecidos(datos.nombre.toUpperCase(), r.parecidos, 'Ver ficha',
            function (id) { abrirFicha(id, irUsuarios); },
            function () { crearUsuario(true); });
          return;
        }
        anticuar('usuario-nuevo');
        aviso('Usuario creado: ' + nombreVisible(r.nombre));
        app.gest.totalUsuarios++;
        sigue(function () { abrirFicha(r.usuario_id, irUsuarios, r.nombre); })();
        precargar();
      }).catch(avisoError);
    }

    /**
     * nombre: el que ya se conoce (de la fila tocada), para el título mientras carga la ficha.
     * refresco: se vuelve a cargar la ficha abierta tras guardar (sin esqueleto).
     */
    function abrirFicha(usuarioId, volver, nombre, refresco) {
      const vuelta = volver || irUsuarios;
      cargarPantalla('api_usuario', [usuarioId], function () {
        pantallaSecundaria('ficha', nombreVisible(nombre || '') || 'Usuario', 'ID ' + usuarioId, vuelta, usuarioId);
        pintar(esqueleto('bloques'), true);
      }, function (d, conEsqueleto) {
        d.volver = vuelta;
        app.ficha = d;
        const u = d.usuario;
        if (conEsqueleto) barra(nombreVisible(u.nombre), 'ID ' + u.usuario_id, vuelta);
        else pantallaSecundaria('ficha', nombreVisible(u.nombre), 'ID ' + u.usuario_id, vuelta, usuarioId);
        pintarFicha();
      }, function () { abrirFicha(usuarioId, volver, nombre); }, refresco);
    }

    function pintarFicha() {
      const d = app.ficha;
      const u = d.usuario;
      const vigentes = d.inscripciones.filter(function (i) { return !i.fecha_baja || i.fecha_baja >= app.init.hoy; });
      const gruposLibres = (app.gest ? app.gest.grupos : []).filter(function (g) {
        return g.activo && !vigentes.some(function (i) { return i.grupo_id === g.grupo_id; });
      });

      let html = '<div class="bloque"><h3>Datos</h3>' +
        '<div class="campo"><label for="uNombre">Apellidos y nombre</label><input type="text" id="uNombre" autocapitalize="characters" enterkeyhint="next" value="' + esc(u.nombre) + '"></div>' +
        '<div class="campo"><label for="uTelefono">Teléfono</label><input type="tel" id="uTelefono" inputmode="tel" enterkeyhint="done" value="' + esc(u.telefono) + '"></div>' +
        '<label class="check"><input type="checkbox" id="uActivo"' + (u.activo ? ' checked' : '') + '> Usuario activo</label>' +
        '<button type="button" class="boton primario ancho" data-accion="g-guardar-usuario">Guardar cambios</button></div>';

      html += '<div class="bloque"><h3>Grupos</h3>' + (d.inscripciones.length ? d.inscripciones.map(function (i) {
        return '<div class="resultado"><div class="cuerpo"><div><strong>' + esc(tallerYGrupo(i.taller, i.grupo)) + '</strong></div>' +
          '<div class="sub">Alta ' + esc(fechaNumerica(i.fecha_alta)) +
          (i.fecha_baja ? ' · baja ' + esc(fechaNumerica(i.fecha_baja)) + (i.motivo_baja ? ' (' + esc(i.motivo_baja) + ')' : '') : ' · sigue') +
          '</div></div></div>';
      }).join('') : '<p class="vacio">No está en ningún grupo.</p>');
      if (gruposLibres.length) {
        html += '<div class="campo separado"><label for="uGrupo">Inscribir en</label><select id="uGrupo">' +
          opciones(gruposLibres, '', function (g) { return g.grupo_id; }, function (g) { return tallerYGrupo(g.taller, g.nombre); }) + '</select></div>' +
          campoFecha('uFechaAlta', 'Desde') +
          '<button type="button" class="boton ancho" data-accion="g-inscribir-usuario">Inscribir</button>';
      }
      html += '<p class="ayuda">Para dar de baja o cambiar de grupo, usa «Altas y bajas» del grupo.</p></div>';

      html += '<div class="bloque"><h3>Asistencia este curso</h3>' + (d.asistencia.length
        ? '<div class="tabla-scroll"><table class="datos"><thead><tr><th>Grupo</th><th>Asistencias</th><th>Faltas</th><th>Otros</th><th>%</th></tr></thead><tbody>' +
        d.asistencia.map(function (a) {
          return '<tr><td>' + esc(tallerYGrupo(a.taller, a.grupo)) + '</td><td>' + a.presentes + '</td><td>' + a.ausentes + '</td><td>' +
            a.neutros + '</td><td>' + porcentaje(a.porcentaje) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<p class="vacio">Todavía no hay registros de asistencia.</p>') + '</div>';
      pintar(html);
    }

    function guardarFicha() {
      const sigue = siSiguePara();
      const u = app.ficha.usuario;
      const datos = { usuario_id: u.usuario_id, nombre: valor('uNombre'), telefono: valor('uTelefono'), activo: marcado('uActivo') };
      if (!datos.nombre) return errorCampo('uNombre', 'Escribe los apellidos y el nombre.');
      const volver = app.ficha.volver;
      llamar('api_guardarUsuario', datos, false).then(function () {
        anticuar('usuario');
        aviso('Datos guardados.');
        sigue(function () { abrirFicha(u.usuario_id, volver, datos.nombre, true); })();

    function inscribirDesdeFicha() {

      const u = app.ficha.usuario;
      const volver = app.ficha.volver;
      const fecha = valor('uFechaAlta');
      if (!fecha) return errorCampo('uFechaAlta', 'Indica el primer día en el grupo.');

        anticuar('inscripciones');
        aviso('Inscripción hecha.');
        sigue(function () { abrirFicha(u.usuario_id, volver, u.nombre, true); })();
        precargar();
      }).catch(avisoError);
    }

    // --- Días libres (hoja Dias especiales) ---

    function nombreGrupoGestion(grupoId) {
      if (!grupoId) return 'Todos los grupos';
      const g = app.gest.grupos.find(function (x) { return x.grupo_id === grupoId; });
      return g ? tallerYGrupo(g.taller, g.nombre) : grupoId;
    }

    /** Lista de próximos y pasados; «Añadir día» en el botón flotante, que abre el formulario en un panel. */
    function irDias() {
      pantallaSecundaria('g-dias', 'Días libres', 'No cuentan como pendientes', volverGestion);
      const hoy = app.init.hoy;
      const fila = function (d) {
        return '<div class="resultado"><div class="cuerpo"><div><strong>' + esc(fechaCorta(d.fecha)) + ' ' + d.fecha.substring(0, 4) +
          '</strong> · ' + esc(d.tipo || 'Día libre') + '</div><div class="sub">' + esc(d.descripcion || '') + (d.descripcion ? ' · ' : '') +
          esc(nombreGrupoGestion(d.grupo_id)) + '</div></div>' +
          '<button type="button" class="boton peligro compacto" data-accion="g-borrar-dia" data-fecha="' + esc(d.fecha) + '" data-grupo="' +
          esc(d.grupo_id || '') + '">Quitar</button></div>';
      };
      const proximos = app.gest.diasEspeciales.filter(function (d) { return d.fecha >= hoy; });
      const pasados = app.gest.diasEspeciales.filter(function (d) { return d.fecha < hoy; }).reverse();
      let html = '<h3 class="subtitulo-lista">Próximos (' + proximos.length + ')</h3>' +
        (proximos.length ? '<div class="lista">' + proximos.map(fila).join('') + '</div>' : '<p class="vacio">No hay ninguno apuntado.</p>');
      if (pasados.length) html += '<details class="plegable"><summary>Pasados (' + pasados.length + ')</summary><div class="relleno"><div class="lista">' + pasados.map(fila).join('') + '</div></div></details>';
      pintar(html + fab('g-dia-nuevo', 'Añadir día'));
    }

    function abrirPanelDia() {
      const hoy = app.init.hoy;
      abrirPanel('<div><h3>Añadir día libre</h3><div class="fila-campos">' +
        '<div class="campo"><label for="dDesde">Día (o desde)</label><input type="date" id="dDesde" value="' + esc(hoy) + '"></div>' +
        '<div class="campo"><label for="dHasta">Hasta (opcional)</label><input type="date" id="dHasta"></div></div>' +
        '<p class="ayuda">Para unas vacaciones, rellena «hasta»: se apuntan solo los días en que había clase.</p>' +
        opcionesRadio('dTipo', 'Tipo', app.gest.listas.tipo_dia.map(function (t) { return { valor: t, texto: t }; }), app.gest.listas.tipo_dia[0] || '') +
        '<div class="campo"><label for="dDescripcion">Descripción (opcional)</label><input type="text" id="dDescripcion" enterkeyhint="done" placeholder="Ej.: Navidad, Inmaculada…"></div>' +
        '<div class="campo"><label for="dGrupo">Afecta a</label><select id="dGrupo"><option value="">Todos los grupos</option>' +
        opciones(app.gest.grupos.filter(function (g) { return g.activo; }), '', function (g) { return g.grupo_id; }, function (g) { return tallerYGrupo(g.taller, g.nombre); }) +
        '</select></div><div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Cancelar</button>' +
        '<button type="button" class="boton primario" data-accion="g-guardar-dia">Añadir</button></div></div>');
    }

    function guardarDia() {
      const datos = { desde: valor('dDesde'), hasta: valor('dHasta'), tipo: elegido('dTipo'), descripcion: valor('dDescripcion'), grupo_id: valor('dGrupo') };
      if (!datos.desde) return errorCampo('dDesde', 'Indica el día.');
      if (datos.hasta && datos.hasta < datos.desde) return errorCampo('dHasta', 'Este día es anterior al primero.');
      if (!datos.tipo && app.gest.listas.tipo_dia.length) return errorCampo('dTipo', 'Elige el tipo.');
      llamar('api_guardarDiaEspecial', datos).then(function (r) {
        cerrarPanel();
        aviso(r.dias === 1 ? 'Día apuntado.' : r.dias + ' días apuntados.');

      }).then(siSigue(irDias)).catch(avisoError);

    function borrarDia(fecha, grupoId) {
      confirmar('¿Quitar este día libre?', esc(fechaLarga(fecha)) + ' · ' + esc(nombreGrupoGestion(grupoId)), 'Sí, quitar', true, function () {
        llamar('api_borrarDiaEspecial', fecha, grupoId).then(function () {
          cerrarPanel();
          aviso('Día quitado.');
          return recargarDatos('dias');
        }).then(siSigue(irDias)).catch(function (e) { cerrarPanel(); avisoError(e); });
      }, 'Quitando…');

    // --- Estados ---

    /** Los estados como una lista (letra con su color, nombre y cómo cuenta); cada uno se edita en un panel. */
    function irEstados() {
      pantallaSecundaria('g-estados', 'Estados de asistencia', 'Lo que se marca en el pase de lista', volverGestion);
      const tipoTexto = function (t) { const x = TIPOS_ESTADO.find(function (y) { return y[0] === t; }); return x ? x[1] : t; };
      pintar('<p class="ayuda">La letra es la que se ve en el historial. Cada pase de lista empieza con todos en «' +
        esc(estadoInfo(app.init.estadoPorDefecto).etiqueta) + '». Toca un estado para cambiarlo.</p>' +
        '<div class="lista">' + app.gest.estados.map(function (e) {
          return '<button type="button" class="tarjeta' + (e.activo ? '' : ' inactiva') + '" data-accion="g-estado" data-codigo="' + esc(e.codigo) + '">' +
            '<span class="celda grande" style="' + estiloColor(e.color) + '" aria-hidden="true">' + esc(e.letra) + '</span>' +
            '<div class="tarjeta-cuerpo"><div class="tarjeta-titulo">' + esc(e.etiqueta) + '</div><div class="tarjeta-detalle">' + esc(tipoTexto(e.tipo)) + '</div></div>' +
            (e.activo ? '' : '<span class="etiqueta cancelada">Inactivo</span>') + FLECHA + '</button>';
        }).join('') + '</div>' + fab('g-estado-nuevo', 'Nuevo estado'));

    /** Panel de un estado (codigo vacío = nuevo; su código interno se saca solo del nombre). */
    function abrirPanelEstado(codigo) {
      const e = codigo ? app.gest.estados.find(function (x) { return x.codigo === codigo; })
        : { codigo: '', etiqueta: '', letra: '', color: '#6a1b9a', tipo: 'neutro', activo: true };
      if (!e) return;
      const porDefecto = e.codigo === app.init.estadoPorDefecto;
      abrirPanel('<div><h3>' + (codigo ? esc(e.etiqueta) : 'Nuevo estado') + '</h3>' +
        '<div class="campo"><label for="eEtiqueta">Nombre</label><input type="text" id="eEtiqueta" enterkeyhint="next" value="' + esc(e.etiqueta) + '" placeholder="Ej.: Excursión"></div>' +
        '<div class="fila-campos"><div class="campo"><label for="eLetra">Letra del historial</label><input type="text" id="eLetra" maxlength="2" autocapitalize="characters" enterkeyhint="done" value="' + esc(e.letra) + '"></div>' +
        '<div class="campo estrecho"><label for="eColor">Color</label><input type="color" id="eColor" value="' + esc(e.color || '#607d8b') + '"></div></div>' +
        opcionesRadio('eTipo', 'Cómo cuenta en las estadísticas', TIPOS_ESTADO.map(function (t) { return { valor: t[0], texto: t[1] }; }), e.tipo) +
        (!codigo ? '' : porDefecto ? '<p class="ayuda">Es el estado con el que empieza cada pase de lista: no se puede desactivar.</p>'
          : '<label class="check"><input type="checkbox" id="eActivo"' + (e.activo ? ' checked' : '') + '> Activo (si lo desactivas, no se puede marcar, pero el historial lo conserva)</label>') +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Cancelar</button>' +
        '<button type="button" class="boton primario" data-accion="g-guardar-estado" data-codigo="' + esc(codigo) + '">' + (codigo ? 'Guardar' : 'Crear estado') + '</button></div></div>');
    }

    /** Código interno de un estado nuevo: las 3 primeras letras del nombre («Excursión» → EXC), con un número si ya existe. */
    function codigoEstadoNuevo(etiqueta) {
      const base = paraBuscar(etiqueta).replace(/[^A-Z0-9]/g, '').substring(0, 3) || 'EST';
      const existe = function (c) { return app.gest.estados.some(function (e) { return e.codigo === c; }); };
      let codigo = base;
      for (let n = 2; existe(codigo); n++) codigo = base + n;
      return codigo;
    }

    function guardarEstado(codigo) {
      const nuevo = !codigo;
      const datos = {
        codigo: codigo,
        etiqueta: valor('eEtiqueta'),
        letra: valor('eLetra').toUpperCase(),
        color: valor('eColor'),
        tipo: elegido('eTipo'),
        activo: $('eActivo') ? marcado('eActivo') : true
      };
      if (!datos.etiqueta) return errorCampo('eEtiqueta', 'Escribe el nombre del estado.');
      if (!datos.letra) return errorCampo('eLetra', 'Escribe la letra que se verá en el historial.');
      if (!datos.tipo) return errorCampo('eTipo', 'Elige cómo cuenta.');
      if (nuevo) datos.codigo = codigoEstadoNuevo(datos.etiqueta);
      llamar('api_guardarEstado', datos, nuevo).then(function () {
        cerrarPanel();
        aviso(nuevo ? 'Estado creado.' : 'Estado guardado.');
        return recargarDatos('gestion');
      }).then(siSigue(irEstados)).catch(avisoError);
    }

    // --- Monitoras y sus claves de la app (6-nov-2026) ---
    // Cada monitora entra en la app instalable con su clave y ve solo sus grupos. La clave se crea aquí, se enseña
    // una sola vez y se le envía con un enlace que conecta la app solo (pwa/api.js lo lee).

    function textoMonitora(m) {
      return [m.rol === 'admin' ? 'Administración' : 'Monitora',
        m.grupos === 1 ? '1 grupo' : m.grupos + ' grupos',
        m.tieneClave ? 'con clave' : 'sin clave'].join(' · ');
    }

    function irMonitoras() {
      const lista = app.gest.monitoras;
      pantallaSecundaria('g-monitoras', 'Monitoras', lista.filter(function (m) { return m.activa; }).length + ' activas', volverGestion);
      pintar('<p class="ayuda">Cada monitora entra en la app con su clave y solo ve sus grupos (los que la tienen en Gestión › Grupos). ' +
        'Toca una para darle o cambiarle la clave.</p>' +
        (lista.length ? '<div class="lista">' + lista.map(function (m) {
          return filaPersona({
            boton: true, clase: m.activa ? '' : 'inactiva', nombre: m.nombre || m.email,
            atributos: ' data-accion="g-monitora" data-email="' + esc(m.email) + '"',
            detalle: esc(textoMonitora(m)) + (m.activa ? '' : ' · <b>desactivada</b>'),
            derecha: FLECHA
          });
        }).join('') + '</div>' : '<p class="vacio">Todavía no hay monitoras.</p>') +
        fab('g-monitora-nueva', 'Nueva monitora'));
    }

    /** Panel de una monitora (email vacío = nueva). */
    function abrirPanelMonitora(email) {
      const m = email ? app.gest.monitoras.find(function (x) { return x.email === email; })
        : { email: '', nombre: '', rol: 'monitora', activa: true, tieneClave: false, grupos: 0 };
      if (!m) return;
      const nueva = !m.email;
      abrirPanel('<div><h3>' + (nueva ? 'Nueva monitora' : esc(m.nombre || m.email)) + '</h3>' +
        (nueva ? '' : '<p class="ayuda">' + esc(m.email) + ' · ' + esc(textoMonitora(m)) + '</p>') +
        '<div class="campo"><label for="mNombre">Nombre</label><input type="text" id="mNombre" autocomplete="off" enterkeyhint="next" value="' + esc(m.nombre) + '" placeholder="Ej.: Carmen"></div>' +
        (nueva ? '<div class="campo"><label for="mEmail">Correo</label><input type="email" id="mEmail" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="nombre@gmail.com">' +
          '<p class="ayuda">Sirve para reconocerla y asignarle grupos; no hace falta que use Google. No se puede cambiar después.</p></div>' : '') +
        opcionesRadio('mRol', 'Qué puede hacer', [
          { valor: 'monitora', texto: 'Monitora', sub: 'Pasa lista, altas y bajas, historial e informe de sus grupos' },
          { valor: 'admin', texto: 'Administración', sub: 'Todo, con todos los grupos y la pestaña Gestión' }
        ], m.rol) +
        (nueva ? '' : '<label class="check"><input type="checkbox" id="mActiva"' + (m.activa ? ' checked' : '') + '> Activa (si la desactivas, su clave deja de funcionar al momento)</label>') +
        '<div class="botones"><button type="button" class="boton" data-accion="cerrar-panel">Cancelar</button>' +
        '<button type="button" class="boton primario" data-accion="g-guardar-monitora" data-email="' + esc(m.email) + '">' + (nueva ? 'Crear' : 'Guardar') + '</button></div>' +
        (nueva || !m.activa ? '' : '<button type="button" class="boton ancho separado" data-accion="g-clave-monitora" data-email="' + esc(m.email) + '" data-en-curso="Creando la clave…">' +
          (m.tieneClave ? 'Cambiar la clave…' : 'Crear clave y enviar enlace') + '</button>') +
        '</div>');
    }

    function guardarMonitora(email) {
      const nueva = !email;
      const datos = {
        email: nueva ? valor('mEmail').toLowerCase() : email,
        nombre: valor('mNombre'),
        rol: elegido('mRol'),
        activa: nueva ? true : marcado('mActiva')
      };
      if (!datos.nombre) return errorCampo('mNombre', 'Escribe el nombre de la monitora.');
      if (nueva && !/^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(datos.email)) return errorCampo('mEmail', 'Escribe un correo como nombre@gmail.com.');
      llamar('api_guardarMonitora', datos, nueva).then(function () {
        cerrarPanel();
        aviso(nueva ? 'Monitora creada · ahora créale la clave' : 'Monitora guardada');
        return recargarDatos('gestion');
      }).then(siSigue(function () {
        irMonitoras();
        if (nueva) abrirPanelMonitora(datos.email);
      })).catch(avisoError);
    }

    /** Crea la clave (si ya tenía una, pregunta antes: la anterior deja de valer). */
    function pedirClaveMonitora(email) {
      const m = app.gest.monitoras.find(function (x) { return x.email === email; });
      if (!m) return;
      const crear = function () {
        llamar('api_nuevaClaveMonitora', email).then(function (r) {
          app.claveCreada = { email: email, nombre: m.nombre || email, clave: r.clave, url: r.url, urlApp: r.urlApp };
          // La lista se pinta ya con «con clave» y después se abre el panel con la clave (volver a pintar la
          // pantalla cerraría el panel). Los datos de Gestión se vuelven a pedir en segundo plano.
          m.tieneClave = true;
          if (app.vista === 'g-monitoras') irMonitoras();
          mostrarClaveMonitora();
          anticuar('gestion');
          pedir('api_gestion').then(function (d) { app.gest = d; }).catch(function () { /* se verá al volver */ });
        }).catch(avisoError);
      };
      if (m.tieneClave) {
        confirmar('¿Cambiar la clave de ' + (m.nombre || email) + '?', 'La que tiene ahora dejará de funcionar: tendrá que conectar la app otra vez con el enlace nuevo.',
          'Cambiar la clave', true, crear, 'Creando la clave…');
      } else {
        crear();
      }
    }

    /** Enlace que conecta la app solo: la dirección de la app instalable con la del servidor y la clave tras «#». */
    function enlaceConexion(c) {
      const servidor = window.PWA ? window.PWA.urlServidor() : c.url;
      const base = window.PWA ? window.location.origin + window.location.pathname : c.urlApp;
      return base + '#conectar=' + encodeURIComponent(servidor || '') + '&clave=' + encodeURIComponent(c.clave);
    }
    function textoEnlace(c) {
      return 'Hola, ' + c.nombre + ': abre este enlace en tu móvil con Chrome para usar la app de asistencia. ' +
        'Cuando se abra, en el menú ⋮ elige «Instalar app».\n' + enlaceConexion(c);
    }

    function mostrarClaveMonitora() {
      const c = app.claveCreada;
      if (!c) return;
      abrirPanel('<div><h3>Clave de ' + esc(c.nombre) + '</h3>' +
        '<p class="ayuda">Envíale el enlace: al abrirlo en su móvil, la app se conecta sola con esta clave. ' +
        'La clave solo se enseña ahora; si se pierde, crea otra.</p>' +
        '<p class="clave-grande" aria-label="Clave">' + esc(c.clave) + '</p>' +
        '<button type="button" class="boton lleno ancho" data-accion="clave-enviar">' + ICONO_COMPARTIR + 'Enviar enlace</button>' +
        '<div class="botones separado"><button type="button" class="boton" data-accion="clave-copiar">Copiar enlace</button>' +
        '<button type="button" class="boton" data-accion="cerrar-panel">Hecho</button></div></div>');
    }

    function enviarEnlaceClave() {
      const c = app.claveCreada;
      if (!c) return;
      if (navigator.share) {
        navigator.share({ title: 'App de asistencia', text: textoEnlace(c) }).catch(function (e) {
          if (e && e.name === 'AbortError') return;   // se cerró el menú de compartir
          copiarEnlaceClave();
        });
      } else {
        copiarEnlaceClave();
      }
    }

    function copiarEnlaceClave() {
      const c = app.claveCreada;
      if (!c) return;
      const texto = textoEnlace(c);
      const aMano = function () {
        // Sin portapapeles (marco de Apps Script o navegador antiguo): el texto, seleccionado, para copiarlo a mano.
        abrirPanel('<div><h3>Copia el enlace</h3><p class="ayuda">Mantén pulsado el texto para copiarlo.</p>' +
          '<textarea id="claveTexto" rows="6" readonly>' + esc(texto) + '</textarea>' +
          '<div class="botones separado"><button type="button" class="boton" data-accion="clave-volver">Volver</button></div></div>');
        const t = $('claveTexto');
        if (t) { t.focus(); t.select(); }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { aviso('Enlace copiado'); }, aMano);
      } else {
        aMano();
      }
    }

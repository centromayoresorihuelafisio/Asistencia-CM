<style>
  /* ============================================================================
     ESTILO VISUAL (3-nov-2026): el mismo sistema que la app de fisioterapia
     (Servicio-de-fisioterapia-Orihuela, ui/CSS_Global), adaptado al móvil:
     - Mismos colores, esquinas, sombras, tiempos y nombres de variables (--md-*), solo tema claro.
     - Sin nada de fuera: letra del sistema (Google Sans solo si el aparato ya la tiene) e iconos SVG propios.
     - Tamaños de móvil: botones de 52 px como mínimo y nombres de 17 px como mínimo (CLAUDE.md, sección 7).
     No se escriben colores, esquinas, sombras, duraciones ni z-index sueltos: siempre una variable de aquí.
     Las únicas excepciones son los colores de cada estado, que vienen de la hoja Estados (estilo en línea).
     ============================================================================ */
  :root {
    color-scheme: light;

    /* --- Color (valores del tema claro de fisio) --- */
    --md-primary:           #0b57d0;
    --md-primary-dark:      #004a77;
    --md-primary-light:     #e8f0fe;
    --md-primary-container: #c2e7ff;
    --md-on-primary:        #ffffff;

    --md-success:    #137333;
    --md-success-bg: #e6f4ea;
    --md-error:      #c5221f;
    --md-error-bg:   #fce8e6;
    --md-warning:      #f29900;   /* solo rellenos y bordes */
    --md-warning-text: #8a5d1a;   /* texto de aviso */
    --md-warning-bg:   #fef7e0;

    --md-bg:              #f8f9fa;
    --md-surface:         #ffffff;
    --md-surface-variant: #f1f3f4;
    --md-outline:         #dadce0;   /* separadores y bordes de tarjeta */
    --md-outline-strong:  #80868b;   /* bordes de campos y controles */

    --md-on-surface:     #202124;
    --md-on-surface-med: #5f6368;
    --md-on-surface-low: #80868b;

    --md-scrim:       rgba(32, 33, 36, .50);
    --md-velo:        rgba(248, 249, 250, .60);   /* fondo del indicador de carga: deja ver la pantalla */
    --md-toast-bg:    #323232;
    --md-toast-fg:    #ffffff;
    --md-toast-error: #8c1d18;

    /* --- Letra: la del sistema (sin descargas). Google Sans solo si ya está instalada --- */
    --font: 'Google Sans', 'Segoe UI', Roboto, system-ui, -apple-system, Arial, sans-serif;
    --fs-xs:    13px;   /* cabeceras de tabla, notas al pie */
    --fs-sm:    15px;   /* secundario, insignias, ayudas */
    --fs-md:    17px;   /* cuerpo, botones, nombres (mínimo en el móvil) */
    --fs-lg:    18px;   /* títulos de tarjeta */
    --fs-title: 20px;   /* títulos de pantalla y de panel */
    --fs-kpi:   28px;   /* cifras grandes */

    /* --- Tamaños táctiles --- */
    --alto-boton: 52px;
    --alto-fila:  64px;

    /* --- Forma --- */
    --md-shape-xs:   4px;
    --md-shape-sm:   8px;
    --md-shape-md:   12px;
    --md-shape-lg:   16px;
    --md-shape-xl:   28px;
    --md-shape-full: 999px;

    /* --- Elevación --- */
    --md-elev-1: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
    --md-elev-2: 0 1px 2px rgba(60,64,67,.30), 0 2px 6px 2px rgba(60,64,67,.15);
    --md-elev-3: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.30);
    --md-elev-arriba:  0 -1px 3px rgba(60,64,67,.15);       /* barras fijas abajo (pie, navegación) */
    --md-elev-lateral: 8px 0 10px -8px var(--md-scrim);      /* columna fija de una tabla desplazada */

    /* --- Movimiento (sobrio: sin onda, escalado ni rebote) --- */
    --dur-1: 100ms;
    --dur-2: 180ms;
    --dur-3: 280ms;
    --dur-giro:    .8s;
    --dur-barrido: 1s;
    --ease: cubic-bezier(.2, 0, 0, 1);

    /* --- Capas --- */
    --z-base:   1;
    --z-sticky: 10;
    --z-pie:    15;
    --z-panel:  30;
    --z-carga:  40;
    --z-toast:  50;
  }

  @keyframes md-spin    { to { transform: rotate(360deg); } }
  @keyframes md-entra   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes md-sube    { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes md-barrido { from { background-position: -40% 0; } to { background-position: 140% 0; } }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--md-bg);
    color: var(--md-on-surface);
    font-family: var(--font);
    font-size: var(--fs-md);
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }

  /* Foco con teclado: una sola regla (especificidad 0) */
  :where(a, button, input, select, textarea, summary, [tabindex], [data-accion]):focus-visible {
    outline: 2px solid var(--md-primary);
    outline-offset: 2px;
  }

  .oculto { display: none !important; }

  /* ---------- Barra superior ---------- */
  .barra {
    position: sticky;
    top: 0;
    z-index: var(--z-sticky);
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 64px;
    padding: 8px 12px 8px 16px;
    background: var(--md-surface);
    color: var(--md-on-surface);
    border-bottom: 1px solid var(--md-outline);
    box-shadow: var(--md-elev-1);
  }
  .barra-volver {
    position: relative;
    flex: none;
    width: 48px;
    height: 48px;
    margin-left: -8px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--md-on-surface-med);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .barra-titulo { min-width: 0; flex: 1; }
  .barra-principal {
    font-size: var(--fs-title);
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .barra-sub { font-size: var(--fs-sm); color: var(--md-on-surface-med); }

  .vista { padding: 12px 16px 24px; max-width: 720px; margin: 0 auto; }
  .vista.con-pie { padding-bottom: 190px; }
  .vista.con-nav { padding-bottom: 104px; }

  h2.seccion {
    font-size: var(--fs-sm);
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--md-on-surface-med);
    margin: 24px 4px 8px;
  }
  h2.seccion.peligro { color: var(--md-error); }
  h3.taller {
    font-size: var(--fs-md);
    font-weight: 600;
    color: var(--md-primary-dark);
    margin: 16px 4px 8px;
  }

  .vacio { color: var(--md-on-surface-med); text-align: center; padding: 24px 8px; }

  /* Capa de color al pulsar (la misma idea que .md-btn de fisio: 8 % al pasar, 12 % al pulsar) */
  .boton, .tarjeta, .fila-usuario, .pestana, .nav-boton, .opcion-estado, .barra-volver, .dia span, details.plegable > summary {
    -webkit-tap-highlight-color: transparent;
  }
  .boton::after, .tarjeta::after, .fila-usuario::after, .pestana::after, .opcion-estado::after, .barra-volver::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: currentColor;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-1) var(--ease);
  }
  @media (hover: hover) {
    .boton:hover:not(:disabled)::after, .tarjeta:hover::after, .fila-usuario:hover::after,
    .pestana:hover::after, .opcion-estado:hover::after, .barra-volver:hover::after { opacity: .08; }
  }
  .boton:active:not(:disabled)::after, .tarjeta:active::after, .fila-usuario:active::after,
  .pestana:active::after, .opcion-estado:active::after, .barra-volver:active::after { opacity: .12; }

  /* ---------- Tarjetas ---------- */
  .tarjeta {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: var(--alto-fila);
    padding: 12px 16px;
    margin-bottom: 8px;
    border: 1px solid var(--md-outline);
    border-radius: var(--md-shape-md);
    background: var(--md-surface);
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tarjeta.pendiente {
    border-color: color-mix(in srgb, var(--md-error) 35%, var(--md-outline));
    background: var(--md-error-bg);
    box-shadow: inset 4px 0 0 var(--md-error);
  }
  .tarjeta.inactiva { opacity: .6; }
  .tarjeta-cuerpo { flex: 1; min-width: 0; }
  .tarjeta-titulo { font-weight: 600; font-size: var(--fs-lg); line-height: 1.3; }
  .tarjeta-detalle { color: var(--md-on-surface-med); font-size: var(--fs-sm); margin-top: 2px; }
  .flecha { font-size: 26px; line-height: 1; color: var(--md-on-surface-low); }

  /* Etiqueta de estado (como .md-insignia de fisio, a tamaño de móvil) */
  .etiqueta {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: var(--md-shape-full);
    font-size: var(--fs-sm);
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    background: var(--md-primary-light);
    color: var(--md-primary-dark);
  }
  .etiqueta.pendiente { background: var(--md-error-bg); color: var(--md-error); }
  .etiqueta.realizada { background: var(--md-success-bg); color: var(--md-success); }
  .etiqueta.realizada::before { content: "\2713"; }
  .etiqueta.cancelada { background: var(--md-surface-variant); color: var(--md-on-surface-med); }
  .etiqueta.especial { background: var(--md-warning-bg); color: var(--md-warning-text); }

  /* ---------- Campos (como .md-campo--compacto de fisio: etiqueta encima) ---------- */
  .selector-fecha {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 8px;
  }
  .selector-fecha label { font-weight: 600; font-size: var(--fs-sm); color: var(--md-on-surface-med); }
  .selector-fecha input { width: auto; flex: 1; }

  input, select, textarea {
    display: block;
    width: 100%;
    min-height: var(--alto-boton);
    padding: 12px 14px;
    border: 1.5px solid var(--md-outline-strong);
    border-radius: var(--md-shape-md);
    background: var(--md-surface);
    color: var(--md-on-surface);
    font: inherit;
    font-size: var(--fs-md);
    outline: none;
    transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 40px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--md-on-surface-med) 50%),
      linear-gradient(135deg, var(--md-on-surface-med) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
  }
  textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
  input::placeholder, textarea::placeholder { color: var(--md-on-surface-low); }
  input:focus, select:focus, textarea:focus {
    border-color: var(--md-primary);
    box-shadow: inset 0 0 0 .5px var(--md-primary);
  }
  input:disabled, select:disabled, textarea:disabled {
    background-color: var(--md-surface-variant);
    color: var(--md-on-surface-low);
  }
  input[type="color"] { padding: 6px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--md-primary); }

  .campo { margin-bottom: 16px; }
  .campo > label, .etiqueta-campo {
    display: block;
    margin: 0 0 6px 2px;
    font-size: var(--fs-sm);
    font-weight: 600;
    color: var(--md-on-surface-med);
  }
  .campo:focus-within > label { color: var(--md-primary); }

  .ayuda { color: var(--md-on-surface-med); font-size: var(--fs-sm); margin: 6px 4px 12px; line-height: 1.4; }
  .fila-campos { display: flex; gap: 12px; flex-wrap: wrap; }
  .fila-campos > .campo { flex: 1 1 140px; }
  .fila-campos > .campo.estrecho { flex: 0 0 90px; }

  .check {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin: 4px 0 16px;
    cursor: pointer;
  }
  .check input { width: 24px; height: 24px; min-height: 0; flex: none; margin: 0; padding: 0; }

  /* Días de la semana (como .md-chip de fisio: elegido = fondo del contenedor primario y marca delante) */
  .dias { display: flex; flex-wrap: wrap; gap: 8px; }
  .dia { position: relative; cursor: pointer; }
  .dia input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
  .dia span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 64px;
    min-height: var(--alto-boton);
    padding: 0 12px;
    border: 1px solid var(--md-outline-strong);
    border-radius: var(--md-shape-full);
    background: var(--md-surface);
    font-weight: 600;
    transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
  }
  .dia input:checked + span { background: var(--md-primary-container); border-color: transparent; color: var(--md-primary-dark); }
  .dia input:checked + span::before { content: "\2713"; }
  .dia input:focus-visible + span { outline: 2px solid var(--md-primary); outline-offset: 2px; }

  /* ---------- Botones (como .md-btn de fisio, a 52 px) ---------- */
  .boton {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: var(--alto-boton);
    padding: 10px 24px;
    border: 1px solid var(--md-outline-strong);
    border-radius: var(--md-shape-full);
    background: transparent;
    color: var(--md-primary);
    font: inherit;
    font-size: var(--fs-md);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: .01em;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    transition: border-color var(--dur-1) var(--ease);
  }
  .boton:disabled { opacity: .38; cursor: default; }
  /* Acción principal: tonal, como en fisio (máximo uno por pantalla o bloque) */
  .boton.primario { background: var(--md-primary-container); border-color: transparent; color: var(--md-primary-dark); }
  /* Acción de riesgo: letra roja con borde (como .btn-toolbar.peligro de fisio), para no competir con la principal */
  .boton.peligro { border-color: color-mix(in srgb, var(--md-error) 45%, var(--md-outline)); color: var(--md-error); }
  /* Confirmar algo que no se deshace (dentro del panel de confirmación) */
  .boton.peligro-lleno { background: var(--md-error); border-color: transparent; color: var(--md-on-primary); }
  .boton.ancho { width: 100%; }
  .botones { display: flex; gap: 8px; }
  .botones > .boton { flex: 1; padding-left: 12px; padding-right: 12px; }

  /* ---------- Sección plegable (como details.md-seccion de fisio) ---------- */
  details.plegable {
    margin-top: 24px;
    border-radius: var(--md-shape-md);
    background: var(--md-surface);
    border: 1px solid var(--md-outline);
  }
  details.plegable > summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: var(--alto-boton);
    padding: 14px 16px;
    border-radius: var(--md-shape-md);
    font-size: var(--fs-lg);
    font-weight: 600;
    cursor: pointer;
  }
  details.plegable > summary::-webkit-details-marker { display: none; }
  details.plegable > summary::after {
    content: "";
    margin-left: auto;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--md-on-surface-med);
    border-bottom: 2px solid var(--md-on-surface-med);
    transform: translateY(-3px) rotate(45deg);
    transition: transform var(--dur-2) var(--ease);
  }
  details.plegable[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
  details.plegable[open] > summary { border-bottom: 1px solid var(--md-outline); border-radius: var(--md-shape-md) var(--md-shape-md) 0 0; }
  .grupo-fila { padding: 14px 16px; }
  .grupo-fila + .grupo-fila { border-top: 1px solid var(--md-outline); }
  .grupo-fila .botones { margin-top: 10px; }
  .relleno { padding: 8px 12px; }

  /* ---------- Pase de lista ---------- */
  .avisos-sesion { margin-bottom: 12px; }
  .banda {
    padding: 12px 16px;
    border-radius: var(--md-shape-md);
    margin-bottom: 8px;
    font-size: var(--fs-sm);
    font-weight: 500;
    line-height: 1.4;
  }
  .banda.especial { background: var(--md-warning-bg); color: var(--md-warning-text); }
  .banda.cancelada { background: var(--md-surface-variant); color: var(--md-on-surface-med); }
  .banda.realizada { background: var(--md-success-bg); color: var(--md-success); }
  .banda.info { background: var(--md-primary-light); color: var(--md-primary-dark); }

  .fila-usuario {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--alto-fila);
    padding: 6px 6px 6px 16px;
    margin-bottom: 6px;
    border: 1px solid var(--md-outline);
    border-radius: var(--md-shape-md);
    background: var(--md-surface);
    cursor: pointer;
  }
  .fila-usuario .nombre { flex: 1; min-width: 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.3; }
  .fila-usuario .obs { display: block; font-size: var(--fs-sm); font-weight: 400; color: var(--md-on-surface-med); }
  /* Color de cada estado: viene de la hoja Estados (estilo en línea) */
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    padding: 6px 14px;
    border-radius: var(--md-shape-full);
    font-size: var(--fs-sm);
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    min-width: 96px;
    text-align: center;
  }
  .llamar {
    position: relative;
    z-index: var(--z-base);
    width: var(--alto-boton);
    height: var(--alto-boton);
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--md-success-bg);
    color: var(--md-success);
    text-decoration: none;
  }

  /* Pie fijo */
  .pie {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: var(--z-pie);
    padding: 12px 16px 16px;
    background: var(--md-surface);
    border-top: 1px solid var(--md-outline);
    box-shadow: var(--md-elev-arriba);
  }
  .pie > * { max-width: 720px; margin-left: auto; margin-right: auto; }
  .contadores { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .contadores .chip { min-width: 0; min-height: 30px; padding: 4px 12px; font-size: var(--fs-sm); }
  .pie .botones + .botones { margin-top: 8px; }

  /* Panel inferior (hoja que sube desde abajo) */
  .fondo-panel {
    position: fixed;
    inset: 0;
    z-index: var(--z-panel);
    background: var(--md-scrim);
  }
  .panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: calc(var(--z-panel) + 1);
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px 16px 20px;
    background: var(--md-surface);
    border-radius: var(--md-shape-xl) var(--md-shape-xl) 0 0;
    box-shadow: var(--md-elev-3);
    animation: md-sube var(--dur-3) var(--ease);
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 50%;
    width: 32px;
    height: 4px;
    margin-left: -16px;
    border-radius: var(--md-shape-full);
    background: var(--md-outline-strong);
    opacity: .5;
  }
  .panel > * { max-width: 720px; margin-left: auto; margin-right: auto; }
  .panel h3 { margin: 0 0 12px; font-size: var(--fs-title); font-weight: 600; line-height: 1.3; }
  .panel p { margin: 0 0 16px; color: var(--md-on-surface-med); line-height: 1.45; }
  .panel p strong { color: var(--md-on-surface); }
  .opciones-estado { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .opcion-estado {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 64px;
    padding: 8px 12px;
    border: 0;
    border-radius: var(--md-shape-lg);
    font: inherit;
    font-weight: 600;
    font-size: var(--fs-lg);
    line-height: 1.2;
    cursor: pointer;
  }
  .opcion-estado.elegido { box-shadow: 0 0 0 3px var(--md-surface), 0 0 0 5px var(--md-on-surface); }
  .opcion-estado.elegido::before { content: "\2713"; }
  .resumen-lista { list-style: none; padding: 0; margin: 0 0 16px; }
  .resumen-lista li { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--md-outline); }
  .resumen-lista li:last-child { border-bottom: 0; font-weight: 600; }

  /* ---------- Pestañas (botones segmentados) ---------- */
  .pestanas {
    display: flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 16px;
    border-radius: var(--md-shape-full);
    background: var(--md-surface-variant);
  }
  .pestana {
    position: relative;
    flex: 1;
    min-height: 48px;
    border: 0;
